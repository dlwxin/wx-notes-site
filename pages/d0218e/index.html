span>Fund</span> <span class="arrow down"></span></p> <ul class="sidebar-links sidebar-group-items"><li><a href="/pages/5e9f78/" class="sidebar-link">Fund Basic</a></li><li><a href="/pages/d0218e/" aria-current="page" class="active sidebar-link">Fund Glossary</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level2"><a href="/pages/d0218e/#general" class="sidebar-link">General</a></li><li class="sidebar-sub-header level2"><a href="/pages/d0218e/#fidelity" class="sidebar-link">Fidelity</a></li><li class="sidebar-sub-header level2"><a href="/pages/d0218e/#others" class="sidebar-link">Others</a></li></ul></li></ul></section></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/others/#Others" data-v-057748f7>Others</a></li><li data-v-057748f7><a href="/others/#others" data-v-057748f7>others</a></li><li data-v-057748f7><a href="/others/#Fund" data-v-057748f7>Fund</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2023-12-25</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Fund Glossary<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="general"><a href="#general" class="header-anchor">#</a> General</h2> <table><thead><tr><th>Term/abbreviation</th> <th>Description</th> <th>Translation</th> <th>Remark</th></tr></thead> <tbody><tr><td></td> <td>Autocallable Product</td> <td>自动赎回产品</td> <td></td></tr> <tr><td></td> <td>Alternative Assets</td> <td>另类资产</td> <td></td></tr> <tr><td></td> <td>Alternative Investment</td> <td>另类投资</td> <td></td></tr> <tr><td></td> <td>Incentive fee</td> <td>激励费</td> <td></td></tr> <tr><td></td> <td>Management fee</td> <td>管理费</td> <td></td></tr> <tr><td></td> <td>Hedge funds</td> <td>对冲基金</td> <td></td></tr> <tr><td></td> <td>Real estate</td> <td>不动产</td> <td></td></tr> <tr><td></td> <td>Direct sales</td> <td>直销</td> <td></td></tr> <tr><td></td> <td>Distributor</td> <td>代销机构</td> <td></td></tr> <tr><td></td> <td>Fixed income</td> <td>固定收入</td> <td></td></tr> <tr><td></td> <td>High Net Worth</td> <td>高净值</td> <td></td></tr> <tr><td></td> <td>Listed</td> <td>上市的</td> <td></td></tr> <tr><td></td> <td>Name Screening</td> <td>名称筛查</td> <td>指手动或通过自动筛选工具将内部记录（即客户、交易对手、相关账户方）与受制裁列表记录进行匹配的过程。接受新客户时，会根据制裁名单进行姓名筛查，并实时进行。</td></tr> <tr><td></td> <td>Pure Bond Fund</td> <td>纯债基金</td> <td></td></tr> <tr><td></td> <td>Regulatory Reporting</td> <td>监管报告</td> <td></td></tr> <tr><td></td> <td>Structured Products</td> <td>结构化产品</td> <td>广义上可以理解为所有为客户量身定做的金融产品 （债券+金融大礼包）</td></tr> <tr><td></td> <td>Unlisted</td> <td>未上市的</td> <td></td></tr> <tr><td>AMAC</td> <td>Asset Management Association of China</td> <td>中国证券投资基金业协会</td> <td></td></tr> <tr><td>AML</td> <td>Anti-Money Laundering</td> <td>反洗钱</td> <td></td></tr> <tr><td>AUA</td> <td>Assets Under Administration</td> <td>受托资产规模</td> <td></td></tr> <tr><td>AUM</td> <td>Assets Under Management</td> <td>资产管理规模</td> <td></td></tr> <tr><td>CDD</td> <td>Customer Due Diligence</td> <td>客户尽职调查</td> <td></td></tr> <tr><td>CSI</td> <td>China Securities Index</td> <td>中证指数</td> <td></td></tr> <tr><td>CSRC</td> <td>China Securities Regulatory Commission</td> <td>中国证券监督管理委员会（证监会）</td> <td></td></tr> <tr><td>DD</td> <td>Due Diligence</td> <td>尽职调查</td> <td></td></tr> <tr><td>DRIP</td> <td>Dividend Reinvestment Plan</td> <td>股息再投资计划</td> <td>是指投资者将公司支付的股息再投资到该公司的股票中，而不是将其作为现金支付给投资者。 这种计划允许投资者利用股息再投资的收益来购买额外的股票，从而增加其持有的股票数量。 这种投资策略具有一定的吸引力，特别是对于那些长期投资者来说。</td></tr> <tr><td>ETF</td> <td>Exchange Traded Funds</td> <td>交易所交易基金</td> <td>是一种在交易所上市交易的、基金份额可变的开放式基金</td></tr> <tr><td>FA</td> <td>Financial Advisor</td> <td>财务顾问</td> <td></td></tr> <tr><td>FA</td> <td>Fund Accountant</td> <td>基金会计</td> <td></td></tr> <tr><td>FA</td> <td>Fund Accounting</td> <td></td> <td></td></tr> <tr><td>FOF</td> <td>Fund of Fund</td> <td>基金中的基金</td> <td></td></tr> <tr><td>Forex(FX)</td> <td>Foreign Exchange Market</td> <td>外汇市场</td> <td></td></tr> <tr><td>GP</td> <td>General Partner</td> <td>普通合伙人</td> <td>一般是给投资者管钱的</td></tr> <tr><td>IC</td> <td>Investment Committee</td> <td>投资委员会</td> <td></td></tr> <tr><td>IM</td> <td>Investment Management</td> <td>投资管理</td> <td></td></tr> <tr><td>KYC</td> <td>Know Your Customer</td> <td>了解你的客户</td> <td>用于验证其客户身份并确定其带来欺诈、洗钱或资助恐怖主义等风险的概率极低的流程。</td></tr> <tr><td>LOF</td> <td>Listed Open-ended Funds</td> <td>上市型开放式指数基金</td> <td></td></tr> <tr><td>LP</td> <td>Limited Partner</td> <td>有限合伙人</td> <td>是指一些出钱做投资的人，也就是出资人。</td></tr> <tr><td>LPA</td> <td>Limited Partnership Agreement</td> <td>有限合伙协议</td> <td>是私募股权投资基金重要的法律文书，它直接确定了 GP 与 LP 的权利与义务，以及 LP 如何保护自己的权益，GP 如何承担自己的责任。</td></tr> <tr><td>LTAF</td> <td>Long Term Asset Fund</td> <td>长期资产基金</td> <td></td></tr> <tr><td>MER</td> <td>Management Expense Ratio</td> <td>管理费用比率</td> <td></td></tr> <tr><td>MF</td> <td>Mutual Fund</td> <td>公募基金</td> <td></td></tr> <tr><td>MOF</td> <td>Ministry Of Finance</td> <td>财政部</td> <td></td></tr> <tr><td>MOM</td> <td>Manager of Mangers</td> <td>管理人之管理人</td> <td>是基于 FOF 产生的一种新的投资形态。MOM 将资金交给优秀的管理人打理，MOM 管理人再管理这些子管理人，可以视作“人的组合”。</td></tr> <tr><td>NAV</td> <td>Net Asset Value</td> <td>基金净值</td> <td>净资产价值，也就是基金的实际价值、买卖基金的价格。</td></tr> <tr><td>NAVPS</td> <td>Net asset value per share</td> <td>每股净资产值</td> <td>NAVPS = 所有证券的净值 - 负债/股票数量</td></tr> <tr><td>NB</td> <td>North bound</td> <td>北向资金（北上资金）</td> <td></td></tr> <tr><td>PBOC</td> <td>People's Bank of China</td> <td>中国人民银行</td> <td></td></tr> <tr><td>PE</td> <td>Private Equity</td> <td>私募股权投资</td> <td>是指通过私募基金对非上市公司进行的权益性投资</td></tr> <tr><td>PFM</td> <td>Private Funds Management</td> <td></td> <td></td></tr> <tr><td>PM</td> <td>Portfolio Manager</td> <td>投资组合经理 （基金经理）</td> <td></td></tr> <tr><td>PPM</td> <td>Private Placement Memorandum</td> <td>私募备忘录</td> <td></td></tr> <tr><td>QDII</td> <td>Qualified Domestic Institutional Investor</td> <td>合格境内机构投资者</td> <td></td></tr> <tr><td>REITs</td> <td>Real Estate Investment Trusts</td> <td>不动产投资信托基金</td> <td></td></tr> <tr><td>ROI</td> <td>Return on investment</td> <td>投资回报率</td> <td>是一种绩效评估，用于评估投资效率或比较许多不同投资的效率。投资回报率试图直接衡量特定投资的回报量，相对于投资成本。为了计算投资回报率，将投资的收益（或回报）除以投资成本。结果以百分比或比率表示。</td></tr> <tr><td>RWA</td> <td>Risk Weighted Asset</td> <td>风险加权资产</td> <td>用于衡量根据巴塞尔协议的要求，金融机构根据其账面资产和负债（包括表内与表外)的风险程度所必须持有的最低资本金。</td></tr> <tr><td>SAFE</td> <td>State Administration of Foreign Exchange</td> <td>国家外汇管理局</td> <td></td></tr> <tr><td>SB</td> <td>South bound</td> <td>南向资金（南下资金）</td> <td></td></tr> <tr><td>TA</td> <td>Transfer Agent</td> <td>注册（过户）登记人</td> <td>基金登记结算系统</td></tr> <tr><td>TDF</td> <td>Target Date Fund</td> <td>目标日期基金</td> <td></td></tr> <tr><td>VC</td> <td>Venture Capital</td> <td>风险投资（风投）</td> <td></td></tr></tbody></table> <h2 id="fidelity"><a href="#fidelity" class="header-anchor">#</a> Fidelity</h2> <table><thead><tr><th>Term/abbreviation</th> <th>Description</th> <th>Translation</th> <th>Remark</th></tr></thead> <tbody><tr><td></td> <td>Fidelity Investments</td> <td>富达投资</td> <td></td></tr> <tr><td></td> <td>Fidelity Labs</td> <td>富达实验室</td> <td></td></tr> <tr><td></td> <td>FIL ASIA HOLDINGS PTE. LIMITED</td> <td>富达亚洲控股私人有限公司</td> <td>是富达国际全资控股的子公司；它是富达基金（中国）有限公司的母公司，全资持有这家在中国境内开展公开募集证券投资基金管理、基金销售、以及相关资产管理业务的公司。</td></tr> <tr><td>ER</td> <td>Eight Roads</td> <td>斯道资本</td> <td></td></tr> <tr><td>FAV</td> <td>Fidelity Asia Ventures</td> <td>富达亚洲风险投资</td> <td>负责富达国际在亚洲地区的风险投资业务。FAV 专注投资于 IT 和医疗行业中具备高素质和高成长性的公司，并主要立足于中国市场。</td></tr> <tr><td>FBS</td> <td>Fidelity Brokerage Services LLC</td> <td>富达经纪服务公司</td> <td></td></tr> <tr><td>FCAT</td> <td>Fidelity Center for Applied Technology</td> <td>富达应用技术中心</td> <td></td></tr> <tr><td>FGBG</td> <td>Fidelity Global Brokerage Group</td> <td>富达全球经纪集团</td> <td>A wholly-owned subsidiary of FMR LLC (“FMR”).</td></tr> <tr><td>FIL</td> <td>Fidelity International Limited</td> <td>富达国际</td> <td></td></tr> <tr><td>FMR</td> <td>Fidelity Management &amp; Research</td> <td>富达管理与研究</td> <td></td></tr> <tr><td>NFS</td> <td>National Financial Services LLC</td> <td>国民金融服务公司</td> <td></td></tr></tbody></table> <ul><li><a href="http://www.csrc.gov.cn/csrc/c101879/c949533e59dc741f2a4643ed2004a4c41/content.shtml" target="_blank" rel="noopener noreferrer">关于核准设立富达基金管理（中国）有限公司的批复<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://xueqiu.com/9508834377/231649576" target="_blank" rel="noopener noreferrer">富达投资专题研究：全球领先的投资解决方案巨头<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>富达投资（Fidelity Investments）是一家总部设在美国波士顿的老牌资产管理公司，由 Edward C. Johnson II 于 1946 年创办，是全球最大的金融机构之一。富达投资下设全资子公司富达管理与研究（Fidelity Management &amp; Research, FMR）和富达国际（Fidelity International Limited, FIL）,分别负责美国市场业务和美国以外的海外市 场业务，为各类投资者提供资产管理服务和综合金融服务</p></blockquote> <ul><li><a href="https://xueqiu.com/9508834377/235081231" target="_blank" rel="noopener noreferrer">金融行业专题研究：从海外经验看养老目标产品体系构筑<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>富达自由系列（Fidelity Freedom Series）<br>
三大自由（Freedom）系列产品，构成完整的目标日期基金体系。富达设有三大系列目标 日期产品，包括富达自由（Fidelity Freedom）、富达自由指数（Fidelity Freedom Index ）和富达自由混合（Fidelity Freedom Blend）系列。</p></blockquote> <h2 id="others"><a href="#others" class="header-anchor">#</a> Others</h2> <ul><li><p><a href="https://investors.wiki/zh/assets-under-administration" target="_blank" rel="noopener noreferrer">管理资产 (AUA)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></li> <li><p><a href="https://zhuanlan.zhihu.com/p/352724256" target="_blank" rel="noopener noreferrer">【史上最全基金术语、名词解析】<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></li></ul></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Fund" title="标签">#Fund</a><a href="/tags/?tag=Glossary" title="标签">#Glossary</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">1/20/2025, 10:36:15 AM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/5e9f78/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip
