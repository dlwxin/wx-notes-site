strong>签名方式</strong></td> <td style="text-align:center;">MD5 或 HMAC-SHA256</td> <td style="text-align:center;">非对称密钥 SHA256-RSA</td></tr></tbody></table> <h2 id="私钥和证书"><a href="#私钥和证书" class="header-anchor">#</a> 私钥和证书</h2> <ul><li><a href="https://pay.weixin.qq.com/wiki/doc/apiv3/wechatpay/wechatpay3_1.shtml" target="_blank" rel="noopener noreferrer">私钥和证书<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://kf.qq.com/faq/161222NneAJf161222U7fARv.html" target="_blank" rel="noopener noreferrer">什么是商户 API 证书？如何获取商户 API 证书？<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://pay.weixin.qq.com/wiki/doc/apiv3/wechatpay/wechatpay7_0.shtml" target="_blank" rel="noopener noreferrer">证书相关<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></ ns new window)</span></span></a> 接口，换取 <strong>用户唯一标识 OpenID</strong> 、 用户在微信开放平台帐号下的<strong>唯一标识 UnionID</strong>（若当前小程序已绑定到微信开放平台帐号） 和 <strong>会话密钥 session_key</strong>。</li></ol> <p>注意事项:</p> <ol><li>会话密钥 <strong>session_key</strong> 是对用户数据进行 加密签名 的密钥。为了应用自身的数据安全，开发者服务器<strong>不应该把会话密钥下发到小程序，也不应该对外提供这个密钥</strong>。</li> <li>临时登录凭证 code 只能使用一次</li></ol> <h3 id="小程序订阅消息"><a href="#小程序订阅消息" class="header-anchor">#</a> 小程序订阅消息</h3> <ul><li><a href="https://developers.weixin.qq.com/miniprogram/dev/framework/open-ability/subscribe-message.html" target="_blank" rel="noopener noreferrer">小程序订阅消息<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.eyoucms.com/wxmini/doc/course/25240.html" target="_blank" rel="noopener noreferrer">小程序订阅消息用户拒绝/关闭后，如何引导用户再开启？并获得用户的操作呢<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="小程序加密网络通道"><a href="#小程序加密网络通道" class="header-anchor">#</a> 小程序加密网络通道</h3> <ul><li><a href="https://developers.weixin.qq.com/miniprogram/dev/framework/open-ability/user-encryptkey.html" t l><li>获取全局后台接口调用凭据，有效期最长为 7200s，开发者需要进行妥善保存；</li> <li>有两种调用模式: 1. 普通模式，access_token 有效期内重复调用该接口不会更新 access_token，绝大部分场景下使用该模式；2. 强制刷新模式，会导致上次获取的 access_token 失效，并返回新的 access_token；</li> <li>该接口调用频率限制为 1 万次 每分钟，每天限制调用 50 万 次；</li> <li>与 getAccessToken 获取的调用凭证完全隔离，互不影响。该接口仅支持 POST JSON 形式的调用；</li> <li>如使用云开发，可通过云调用免维护 access_token 调用；</li> <li>如使用云托管，也可以通过微信令牌/开放接口服务免维护 access_token 调用；</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>POST https://api.weixin.qq.com/cgi-bin/stable_token
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>请求示例</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">curl</span> <span class="token parameter variable">-X</span> POST <span class="token string">&quot;https://api.weixin.qq.com/cgi-bin/stable_token&quot;</span> <span class="token punctuation">\</span>
<span class="token parameter variable">-H</span> <span class="token string">&quot;Content-Type: application/json&quot;</span> <span class="token punctuation">\</span>
<span class="token parameter variable">-d</span> <span class="token string">'{
    &quot;grant_type&quot;: &quot;client_credential&quot;,
    &quot;appid&quot;: &quot;APPID&quot;,
    &quot;secret&quot;: &quot;APPSECRET&quot;,
    &quot;force_refresh&quot;: false
}'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>返回示例</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">{</span>

<span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=WeChat" title="标签">#WeChat</a><a href="/tags/?tag=WeChat%20Media%20Platform" title="标签">#WeChat Media Platform</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">8/13/2025, 12:14:59 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/eaeaa9/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Alipay Chore</div></a> <a href="/pages/79820c/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">WeChat Server Side API Example</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
