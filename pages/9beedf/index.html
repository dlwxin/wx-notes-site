h> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://logging.apache.org/log4j/2.x/manual/appenders.html#RollingFileAppender" target="_blank" rel="noopener noreferrer">DefaultRolloverStrategy Parameters<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>DefaultRolloverStrategy Parameters</p> <table><thead><tr><th>Parameter Name</th> <th>Type</th> <th>Description</th></tr></thead> <tbody><tr><td>fileIndex</td> <td>String</td> <td>If set to &quot;max&quot; (the default), files with a higher index will be newer than files with a smaller index. If set to &quot;min&quot;, file renaming and the counter will follow the Fixed Window strategy described above.</td></tr> <tr><td>min</td> <td>integer</td> <td>The minimum value of the counter. The default value is 1.</td></tr> <tr><td>max</td> <td>integer</td> <td>The maximum value of the counter. Once this values is reached older archives will be deleted on subsequent rollovers. The default value is 7.</td></tr> <tr><td>compressionLevel</td> <td>integer</td> <td>Sets the compression level, 0-9, where 0 = none, 1 = best speed, through 9 = best compression. Only implemented for ZIP files.</td></tr> <tr><td>tempCompressedFilePattern</td> <td>String</td> <td>The pattern of the file name of the archived log file during compression.</td></tr></tbody></table> <h2 id="json-template-layout"><a href="#json-template-layout" class="header-anchor">#</a> JSON Template Layout</h2> <ul><li><a href="https://logging.apache.org/log4j/2.x/manual/json-template-layout.html" target="_blank" rel="noopener noreferrer">JSON Template Layout<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=log4j2" title="标签">#log4j2</a><a href="/tags/?tag=Log" title="标签">#Log</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">3/27/2023, 9:54:56 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/18dffd/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">MapStruct Basic</div></a> <a href="/pages/901cfc/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">log4j2 component properties file</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
