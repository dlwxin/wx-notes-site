ww.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></li> <li><p>应用公钥（public key）需提供给支付宝账号管理者上传到支付宝开放平台。</p></li> <li><p>应用私钥（private key）由开发者自己保存，需填写到代码中供签名时使用。</p></li> <li><p>生成的私钥需妥善保管，避免遗失，不要泄露。</p></li> <li><p>密钥和应用（APPID）一一对应，即开发者需要为名下的每个应用分别设置密钥，且不同应用的密钥不能混用。</p></li> <li><p>支付宝公钥（alipay_public_key），是第一次上传应用公钥之后，支付宝平台自动生成的值，非密钥工具生成的应用公钥值，该值主要用于验证支付宝返回的数据通知（即验签）。</p></li></ul> <h2 id="公共错误码"><a href="#公共错误码" class="header-anchor">#</a> 公共错误码</h2> <ul><li><a href="https://opendocs.alipay.com/common/02km9f" target="_blank" rel="noopener noreferrer">公共错误码<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://opensupport.alipay.com/support/FAQ/ee5289d6-c476-4fad-bfc9-343bd9dfd249" target="_blank" rel="noopener noreferrer">公共错误码<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z">< <span class="token comment">//设置应用私钥</span>

<span class="token comment">//设置请求格式，固定值json</span>
alipayConfig<span class="token punctuation">.</span><span class="token function">setFormat</span><span class="token punctuation">(</span><span class="token string">&quot;json&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">//设置字符集</span>

<span class="token comment">//设置支付宝公钥</span>
alipayConfig<span class="token punctuation">.</span><span class="token function">setAlipayPublicKey</span><span class="token punctuation">(</span>alipay_public_key<span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token comment">//设置签名类型</span>
