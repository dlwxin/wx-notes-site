bar-heading"><span>Others</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#Cloud" data-v-057748f7>Cloud</a></li><li data-v-057748f7><a href="/more/#Kubernetes" data-v-057748f7>Kubernetes</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2022-02-10</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->k8s Storage<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="kubernetes-存储类型"><a href="#kubernetes-存储类型" class="header-anchor">#</a> kubernetes 存储类型</h2> <p>pod.spec.volumes|template.spec.volumes</p> <p><img src="https://dlwang.xin:11796/image/cloud/k8s/k8s_storage_type.png" alt="kubernetes 存储类型"></p> <p><strong>Container 的两种消费模型</strong></p> <p>所有的存储资源，最终都是给 Pod 中的 Container 使用。Container 是存储真正的消费者。</p> <ul><li><code>pod.spec.containers.volumeMounts</code> 把存储卷资源挂载到 Container 上 mountPath 路径（文件系统存储）</li> <li><code>pod.spec.containers.volumeDevices</code> 把存储卷映射成 Container 内的 devicePath 上的设备（块存储）</li></ul> <p>默认使用的存储都是容器运行时提供的临时存储。</p> <h3 id="emptydir-存储类型"><a href="#emptydir-存储类型" class="header-anchor">#</a> emptyDir 存储类型</h3> <p>使用节点上 kubelet 的临时存储(<code>/var/lib/kubelet/pods</code>)或节点上的内存，为同一个 pod 中的不同容器（主容器与主容器之间、与初始化容器之间），在启动或运行阶段共享传递数据，临时存储终止 pod 后数据擦除。</p> <p><code>pod.spec.volumes.emptyDir.spec</code> 卷类型字段说明</p> <table><thead><tr><th>字段</th> <th>类型</th> <th>说明</th></tr></thead> <tbody><tr><td>medium</td> <td><code>&lt;string&gt;</code></td> <td>指定后端存储介质类型，默认为空，使用 worker 节点 kubelet 临时存储，&quot;Memory&quot;代表 pod 所在 worker 节点的物理内存。</td></tr> <tr><td>sizeLimit</td> <td><code>&lt;string&gt;</code></td> <td>可使用临时存储最大容量限制。默认为空，不做限制。</td></tr></tbody></table> <p><strong>Examples</strong></p> <ul><li><a href="https://gitee.com/dlwxin/example-kubernetes/blob/main/manifests/storage/volumes/storage-volumes-emptydir-nginx-01.yaml" target="_blank" rel="noopener noreferrer">storage-volumes-emptydir-nginx-01.yaml<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://gitee.com/dlwxin/example-kubernetes/blob/main/manifests/storage/volumes/storage-volumes-emptydir-nginx-02.yaml" target="_blank" rel="noopener noreferrer">storage-volumes-emptydir-nginx-02.yaml<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://gitee.com/dlwxin/example-kubernetes/blob/main/manifests/storage/volumes/storage-volumes-emptydir-sidecar-01.yaml" target="_blank" rel="noopener noreferrer">storage-volumes-emptydir-sidecar-01.yaml<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="hostpath-存储类型"><a href="#hostpath-存储类型" class="header-anchor">#</a> hostPath 存储类型</h3> <p>使用 Pod 所在节点的本机文件系统为同一个 worker 节点上的不同 pod 之间共享数据，提供持久存储。</p> <p>hostPath 存储类型字段说明</p> <table><thead><tr><th>字段</th> <th>类型</th> <th>说明</th></tr></thead> <tbody><tr><td>path</td> <td><code>&lt;string&gt;</code><br>-required-</td> <td>pod 所在的 node 节点的文件系统实体路径。</td></tr> <tr><td>type</td> <td><code>&lt;string&gt;</code></td> <td>HostPath 卷的类型，默认为空无需指定。支持的类型：DirectoryOrCreate、Directory、FileOrCreate、File、Socket、CharDevice、 BlockDevice</td></tr></tbody></table> <h3 id="nfs-第三方存储"><a href="#nfs-第三方存储" class="header-anchor">#</a> NFS 第三方存储</h3> <p>第三方存储 nfs 字段说明</p> <table><thead><tr><th>字段</th> <th>类型</th> <th>说明</th></tr></thead> <tbody><tr><td>server</td> <td><code>&lt;string&gt;</code><br>-required-</td> <td>nfs 服务器 ip 地址或可解析的主机名</td></tr> <tr><td>path</td> <td><code>&lt;string&gt;</code><br>-required-</td> <td>nfs 服务器输出路径</td></tr> <tr><td>readOnly</td> <td><code>&lt;boolean&gt;</code></td> <td>设置是否为只读，布尔值，默认为 false</td></tr></tbody></table> <h2 id="kubernetes-pv-pvc"><a href="#kubernetes-pv-pvc" class="header-anchor">#</a> Kubernetes pv pvc</h2> <h3 id="pv-spec-字段说明"><a href="#pv-spec-字段说明" class="header-anchor">#</a> <code>pv.spec</code> 字段说明</h3> <p><strong>accessModes 字段</strong></p> <p>类型：<code>&lt;[]string&gt;</code></p> <p>定义存储的访问模式：支持以下三种模式：</p> <ul><li>ReadWriteOnce: 仅可被单个 node 节点以读写方式挂载。简写为 RWO</li> <li>ReadOnlyMany: 可以被多个 node 节点以只读的方式挂载。简写为 ROX</li> <li>ReadWriteMany: 可以被多个 node 节点以读写的方式挂载。简写为 RWX</li></ul> <p>在 Kubernetes 中,一个 PersistentVolume (PV)只能被一个 PersistentVolumeClaim (PVC)绑定和使用。这是为了防止出现多个 Pod 同时修改同一个存储卷的情况,从而避免数据损坏或不一致。</p> <p>PV 和 PVC 的关系是一一对应的。当创建一个 PVC 时,Kubernetes 会根据 PVC 对存储资源的请求,查找符合条件的 PV,并将其绑定给 PVC。一旦 PV 被绑定到某个 PVC,其他 PVC 就无法再绑定到这个 PV 上了。</p> <p>如果底层 PV 的访问模式为 ROX 或 RWX,那么绑定到该 PV 的 PVC 就可以被多个 Pod 同时挂载和使用。</p> <p>Kubernetes 设计上要求每个 PV 必须对应一个独立的存储资源路径,并且不允许多个 PV 重复绑定同一路径。一个存储路径(如 NFS 目录、GCE 持久盘等)只能被一个 Kubernetes PersistentVolume(PV)对象绑定和使用。</p> <p><strong>capacity 字段</strong></p> <p>类型：<code>&lt;map[string] string&gt;</code></p> <p>定义 pv 的性能指标。目前仅可用的指标为容量指标：storage: N，将来的属性会增加 IOPS，throughput 等。</p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code>capacity：
  <span class="token key atrule">Storage</span><span class="token punctuation">:</span> 2Gi
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p><strong>persistentVolumeReclaimPolicy 字段</strong></p> <p>类型：<code>&lt;string&gt;</code></p> <p>定义 PV 存储的回收策略。</p> <p>● Retain(保留策略):</p> <p>默认策略，删除 PVC 之后，Kubenetes 不会自动删除 PV，而仅将它置于&quot;释放&quot;(released)状态，此种状态的 PV 不能被其他 PVC 申请绑定，此前产生的数据仍然保留。如需再次使用，需要管理员手动清除，步骤：</p> <ol><li>删除 PV，这之后，此 PV 的数据仍然留存于外部的存储之上。</li> <li>手动清理存储系统上依然留存的数据。</li> <li>再次将其重新创建为 PV。</li></ol> <p>● Delete(删除策略)：</p> <p>对于支持 Delete 回收策略的插件来说，在 PVC 被删除后会直接移除 PV 对象，同时擦除存储上的数据。支持这种操作 的存储系统有 AWS EBS、GCE PD、Azure Disk、OpenStack Cinder</p> <p>● Recycle(回收策略)：</p> <p>如果可以被底层插件支持，资源回收策略会在存储卷上执行数据删除操作并让 PV 资源再次变为可被其它 PVC 申请。另 外，管理员也可以配置一个自定义的回收器 Pod 模板，以便执行自定义的回收操作。只有 NFS 和 HostPath 类型的存储支持 recycling 策略。<strong>此种回收策略将被废弃</strong>。</p> <p><strong>storageClassName 字段</strong></p> <p>类型：<code>&lt;string&gt;</code></p> <p>PV 可以具有一个类，该类名字可以通过将 storageClassName 设置。</p> <ul><li>特定类别的 PV 只能绑定到请求该类别的 PVC。</li> <li>没有 storageClassName 的 PV 没有类别，只能绑定到不要求特定类别的 PVC。</li></ul> <p><strong>mountOptions 字段</strong></p> <p>类型：<code>&lt;[]string&gt;</code></p> <p>管理员为挂载存储指定挂载参数列表。如 [&quot;ro&quot;, &quot;soft&quot;]</p> <p><strong>volumeMode 字段</strong></p> <p>类型：<code>&lt;string&gt;</code></p> <p>如果外部存储为块设备，支持两种模式:Filesystem 和 Block。volumeMode 是可选的 API 参数。默认模式为 Filesystem。</p> <ul><li>Filesystem：如果该卷底层使用的是块设备，且该设备为空，则 Kuberneretes 会在首次安装该设备之前在该设备上 创建一个文件系统。</li> <li>Block：将卷用作原始块设备。这样的卷作为一个块设备呈现在 Pod 中，上面没有任何文件系统。此模式对于为 Pod 提供最快的访问卷的方式很有用，而 Pod 和卷之间没有任何文件系统层</li></ul> <h3 id="不同存储类型所支持的访问方式"><a href="#不同存储类型所支持的访问方式" class="header-anchor">#</a> 不同存储类型所支持的访问方式</h3> <table><thead><tr><th>Volume Plugin</th> <th>ReadWriteOnce</th> <th>ReadOnlyMany</th> <th>ReadWriteMany</th></tr></thead> <tbody><tr><td>AWSElasticBlockStore</td> <td>✓</td> <td>-</td> <td>-</td></tr> <tr><td>AzureDisk</td> <td>✓</td> <td>-</td> <td>-</td></tr> <tr><td>GCEPersistentDisk</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>Cinder</td> <td>✓</td> <td>-</td> <td>-</td></tr> <tr><td>VsphereVolume</td> <td>✓</td> <td>-</td> <td>- (works when Pods are collocated)</td></tr> <tr><td>HostPath</td> <td>✓</td> <td>-</td> <td>-</td></tr> <tr><td>StorageOS</td> <td>✓</td> <td>-</td> <td>-</td></tr> <tr><td>iSCSI</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>FC</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>RBD</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>FlexVolume</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>ScaleIO</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>Flocker</td> <td>✓</td> <td>✓</td> <td>-</td></tr> <tr><td>NFS</td> <td>✓</td> <td>✓</td> <td>✓</td></tr> <tr><td>Glusterfs</td> <td>✓</td> <td>✓</td> <td>✓</td></tr> <tr><td>CephFS</td> <td>✓</td> <td>✓</td> <td>✓</td></tr> <tr><td>AzureFile</td> <td>✓</td> <td>✓</td> <td>✓</td></tr> <tr><td>Quobyte</td> <td>✓</td> <td>✓</td> <td>✓</td></tr> <tr><td>PortworxVolume</td> <td>✓</td> <td>-</td> <td>✓</td></tr> <tr><td>CSI</td> <td>depends on the driver</td> <td>depends on the driver</td> <td>depends on the driver</td></tr></tbody></table> <table><thead><tr><th>类别</th> <th>Volume Plugin</th> <th>访问方式</th></tr></thead> <tbody><tr><td>DAS</td> <td>AWSElasticBlockStore,GCEPersistentDisk,AzureDisk</td> <td>ReadwriteOnce</td></tr> <tr><td>SAN</td> <td>iSCSI,FC,RBD</td> <td>ReadOnlyMany</td></tr> <tr><td>NAS</td> <td>NFS,CephFS,Glusterfs,AzureFile</td> <td>ReadWriteMany</td></tr></tbody></table></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Cloud" title="标签">#Cloud</a><a href="/tags/?tag=Kubernetes" title="标签">#Kubernetes</a><a href="/tags/?tag=k8s" title="标签">#k8s</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">5/26/2024, 9:46:40 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/c6ce5e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">k8s DaemonSet r
