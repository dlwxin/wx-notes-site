LI Documentation<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://spacelift.io/blog/terraform-commands-cheat-sheet" target="_blank" rel="noopener noreferrer">Terraform Cheat Sheet – 21 Terraform CLI Commands &amp; Examples<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://acloudguru.com/blog/engineering/the-ultimate-terraform-cheatsheet" target="_blank" rel="noopener noreferrer">The Ultimate Terraform Commands Cheat Sheet<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="shell-tab-completion"><a href="#shell-tab-completion" class="header-anchor">#</a> Shell Tab-completion</h2> <ul><li><a href="https://developer.hashicorp.com/terraform/cli/commands#shell-tab-completion" target="_blank" rel="noopener noreferrer">Shell Tab-completion<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>If you use either <code>bash</code> or <code>zsh</code> as your command shell, Terraform can provide tab-completion support for all command names and (at this time) some command arguments.</p> <h3 id="installation"><a href="#installation" class="header-anchor">#</a> Installation</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform -install-autocomplete
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="uninstall"><a href="#uninstall" class="header-anchor">#</a> Uninstall</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform -uninstall-autocomplete
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="help"><a href="#help" class="header-anchor">#</a> help</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform <span class="token parameter variable">-help</span>
Usage: terraform <span class="token punctuation">[</span>global options<span class="token punctuation">]</span> <span class="token operator">&lt;</span>subcommand<span class="token operator">&gt;</span> <span class="token punctuation">[</span>args<span class="token punctuation">]</span>

The available commands <span class="token keyword">for</span> execution are listed below.
The primary workflow commands are given first, followed by
<span class="token function">less</span> common or <span class="token function">more</span> advanced commands.

Main commands:
  init          Prepare your working directory <span class="token keyword">for</span> other commands
  validate      Check whether the configuration is valid
  plan          Show changes required by the current configuration
  apply         Create or update infrastructure
  destroy       Destroy previously-created infrastructure

All other commands:
  console       Try Terraform expressions at an interactive <span class="token builtin class-name">command</span> prompt
  <span class="token function">fmt</span>           Reformat your configuration <span class="token keyword">in</span> the standard style
  force-unlock  Release a stuck lock on the current workspace
  get           Install or upgrade remote Terraform modules
  graph         Generate a Graphviz graph of the steps <span class="token keyword">in</span> an operation
  <span class="token function">import</span>        Associate existing infrastructure with a Terraform resource
  login         Obtain and save credentials <span class="token keyword">for</span> a remote <span class="token function">host</span>
  <span class="token builtin class-name">logout</span>        Remove locally-stored credentials <span class="token keyword">for</span> a remote <span class="token function">host</span>
  output        Show output values from your root module
  providers     Show the providers required <span class="token keyword">for</span> this configuration
  refresh       Update the state to match remote systems
  show          Show the current state or a saved plan
  state         Advanced state management
  taint         Mark a resource instance as not fully functional
  <span class="token builtin class-name">test</span>          Experimental support <span class="token keyword">for</span> module integration testing
  untaint       Remove the <span class="token string">'tainted'</span> state from a resource instance
  version       Show the current Terraform version
  workspace     Workspace management

Global options <span class="token punctuation">(</span>use these before the subcommand, <span class="token keyword">if</span> any<span class="token punctuation">)</span>:
  <span class="token parameter variable">-chdir</span><span class="token operator">=</span>DIR    Switch to a different working directory before executing the
                given subcommand.
  <span class="token parameter variable">-help</span>         Show this <span class="token builtin class-name">help</span> output, or the <span class="token builtin class-name">help</span> <span class="token keyword">for</span> a specified subcommand.
  <span class="token parameter variable">-version</span>      An <span class="token builtin class-name">alias</span> <span class="token keyword">for</span> the <span class="token string">&quot;version&quot;</span> subcommand.
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br><span class="line-number">36</span><br><span class="line-number">37</span><br><span class="line-number">38</span><br><span class="line-number">39</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment">#  Display help options for the init command.</span>
terraform init <span class="token parameter variable">-help</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h2 id="version"><a href="#version" class="header-anchor">#</a> version</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform version
Terraform v1.3.2
on linux_amd64
+ provider registry.terraform.io/kreuzwerker/docker v2.13.0

Your version of Terraform is out of date<span class="token operator">!</span> The latest version
is <span class="token number">1.3</span>.3. You can update by downloading from https://www.terraform.io/downloads.html
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h2 id="init"><a href="#init" class="header-anchor">#</a> init</h2> <p>Initialize a new or existing Terraform working directory by <strong>creating initial files</strong>, <strong>loading any remote state</strong>, <strong>downloading modules</strong>, etc.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># terraform init command performs Backend Initialization</span>
terraform init

<span class="token comment"># Install the latest module and provider versions allowed within configured constraints, overriding the default behavior of selecting</span>
<span class="token comment"># exactly the version recorded in the dependency lockfile.</span>
terraform init <span class="token parameter variable">-upgrade</span>

<span class="token comment"># Disable downloading modules for this configuration.</span>
terraform init <span class="token parameter variable">-get</span><span class="token operator">=</span>false

<span class="token comment"># Reconfigure a backend, ignoring any saved configuration.</span>
terraform init <span class="token parameter variable">-reconfigure</span>

<span class="token comment"># Disable backend or Terraform Cloud initialization for this configuration and use what was previously initialized instead.</span>
<span class="token comment"># without accessing any configured remote backend</span>
<span class="token comment"># aliases: -cloud=false</span>
terraform init <span class="token parameter variable">-backend</span><span class="token operator">=</span>false
terraform init <span class="token parameter variable">-cloud</span><span class="token operator">=</span>false

terraform init -backend-config<span class="token operator">=</span><span class="token operator">&lt;</span>path to tfvars file<span class="token operator">&gt;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><h2 id="validate"><a href="#validate" class="header-anchor">#</a> validate</h2> <p>Validate the configuration files in a directory, referring only to the configuration and not accessing any remote services such as remote state,provider APIs, etc.</p> <p><strong>Validation requires an initialized working directory with any referenced plugins and modules installed</strong>.<br>
To initialize a working directory for validation without accessing any configured remote backend, use: <code>terraform init -backend=false</code></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform validate

<span class="token comment"># Produce output in a machine-readable JSON format</span>
terraform validate <span class="token parameter variable">-json</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h2 id="plan"><a href="#plan" class="header-anchor">#</a> plan</h2> <p>Generates a speculative execution plan, showing what actions Terraform would take to apply the current configuration. <strong>This command will not actually perform the planned actions.</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform plan

<span class="token comment"># Creates a plan to destroy all objects, rather than the usual actions.</span>
terraform plan <span class="token parameter variable">-destroy</span>

<span class="token comment"># Write a plan file to the given path. This can be used as input to the &quot;apply&quot; command.</span>
terraform plan <span class="token parameter variable">-out</span><span class="token operator">=</span><span class="token operator">&lt;</span>path<span class="token operator">&gt;</span>

terraform plan <span class="token parameter variable">-var</span> <span class="token string">'foo=bar'</span>

<span class="token comment"># Load variable values from the given file, in addition to the default files terraform.tfvars and *.auto.tfvars.</span>
<span class="token comment"># Use this option more than once to include more than one variables file.</span>
terraform plan -var-file<span class="token operator">=</span>filename
terraform plan -var-file<span class="token operator">=</span>filename1 -var-file<span class="token operator">=</span>filename2
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h2 id="apply"><a href="#apply" class="header-anchor">#</a> apply</h2> <p>Creates or updates infrastructure according to Terraform configuration files in the current directory.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform apply

<span class="token comment"># Skip interactive approval of plan before applying.</span>
terraform apply -auto-approve

<span class="token comment"># Provide the file generated using the terraform plan -out command. If provided, Terraform will take the actions in the plan without any confirmation prompts.</span>
terraform apply <span class="token operator">&lt;</span>planfilename<span class="token operator">&gt;</span>

terraform apply <span class="token parameter variable">-var</span><span class="token operator">=</span><span class="token string">&quot;image_id=ami-abc123&quot;</span>
terraform apply <span class="token parameter variable">-var</span><span class="token operator">=</span><span class="token string">'image_id_list=[&quot;ami-abc123&quot;,&quot;ami-def456&quot;]'</span> <span class="token parameter variable">-var</span><span class="token operator">=</span><span class="token string">&quot;instance_type=t2.micro&quot;</span>
terraform apply <span class="token parameter variable">-var</span><span class="token operator">=</span><span class="token string">'image_id_map={&quot;us-east-1&quot;:&quot;ami-abc123&quot;,&quot;us-east-2&quot;:&quot;ami-def456&quot;}'</span>

<span class="token comment"># Pass in variables contained in a file.</span>
terraform apply -var-file<span class="token operator">=</span><span class="token string">&quot;varfile.tfvars&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h2 id="destroy"><a href="#destroy" class="header-anchor">#</a> destroy</h2> <p>Destroys the infrastructure managed by Terraform.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform destroy

<span class="token comment"># terraform destroy, this command is a convenience alias for:</span>
terraform apply <span class="token parameter variable">-destroy</span>

<span class="token comment"># Destroys the infrastructure without having to interactively type ‘yes’ to the plan.</span>
terraform destroy -auto-approve
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h2 id="providers"><a href="#providers" class="header-anchor">#</a> providers</h2> <p>Prints out a tree of modules in the referenced configuration annotated with their provider requirements.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform providers
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="get"><a href="#get" class="header-anchor">#</a> get</h2> <p>Downloads and installs modules needed for the configuration given by PATH.</p> <p>Usage: terraform [global options] get [options] PATH</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform get

<span class="token comment"># Check already-downloaded modules for available updates and install the newest versions available.</span>
terraform get <span class="token parameter variable">-update</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h2 id="fmt"><a href="#fmt" class="header-anchor">#</a> fmt</h2> <ul><li>Rewrites all Terraform configuration files to a canonical format. Both configuration files (<code>.tf</code>) and variables files (<code>.tfvars</code>) are updated.</li> <li>JSON files (<code>.tf.json</code> or <code>.tfvars.json</code>) are not modified.</li> <li>The content must be in the Terraform language native syntax; JSON is not supported.</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># Format your Terraform configuration files using the HCL language standard.</span>
terraform <span class="token function">fmt</span>

<span class="token comment"># Also process files in subdirectories. By default, only the given directory (or current directory) is processed.</span>
terraform <span class="token function">fmt</span> <span class="token parameter variable">--recursive</span>

<span class="token comment"># Display differences between original configuration files and formatting changes.</span>
terraform <span class="token function">fmt</span> <span class="token parameter variable">--diff</span>

<span class="token comment">#  Check if the input is formatted. Exit status will be 0 if all input is properly formatted and non-zero otherwise.</span>
terraform <span class="token function">fmt</span> <span class="token parameter variable">--check</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><h2 id="workspace"><a href="#workspace" class="header-anchor">#</a> workspace</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>terraform workspace <span class="token parameter variable">-help</span>
Usage: terraform <span class="token punctuation">[</span>global options<span class="token punctuation">]</span> workspace

  new, list, show, <span class="token keyword">select</span> and delete Terraform workspaces.

Subcommands:
    delete    Delete a workspace
    list      List Workspaces
    new       Create a new workspace
    <span class="token keyword">select</span>    Select a workspace
    show      Show the name of the current workspace

<span class="token assign-left variable">WORKSPACE</span><span class="token operator">=</span>global
terraform workspace <span class="token keyword">select</span> <span class="token variable">${WORKSPACE}</span> <span class="token operator">||</span> terraform workspace new <span class="token variable">${WORKSPACE}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h2 id="force-unlock"><a href="#force-unlock" class="header-anchor">#</a> force-unlock</h2> <ul><li><a href="https://developer.hashicorp.com/terraform/language/state/locking" target="_blank" rel="noopener noreferrer">State Locking<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Manually unlock the state for the defined configuration.</p> <p>Remove the lock with the specified lock ID from your workspace. Useful when a lock has become ‘stuck’, usually after an incomplete Terraform run.</p> <blockquote><p>To protect you, the <code>force-unlock</code> command requires a unique lock ID. Terraform will output this lock ID if unlocking fails. This lock ID acts as a nonce, ensuring that locks and unlocks target the correct lock.</p></blockquote> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># Usage: terraform [global options] force-unlock LOCK_ID</span>
terraform force-unlock <span class="token operator">&lt;</span>LOCK_ID<span class="token operator">&gt;</span>

<span class="token comment"># Don't ask for input for unlock confirmation.</span>
terraform force-unlock <span class="token parameter variable">-force</span> <span class="token operator">&lt;</span>LOCK_ID<span class="token operator">&gt;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h2 id="console"><a href="#console" class="header-anchor">#</a> console</h2> <p>Starts an interactive console for experimenting with Terraform interpolations.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token builtin class-name">echo</span> <span class="token string">'join(&quot;,&quot;,[&quot;foo&quot;,&quot;bar&quot;])'</span> <span class="token operator">|</span> terraform console
<span class="token string">&quot;foo,bar&quot;</span>

$ <span class="token builtin class-name">echo</span> <span class="token string">'1 + 5'</span> <span class="token operator">|</span> terraform console
<span class="token number">6</span>

$ <span class="token builtin class-name">echo</span> <span class="token string">&quot;aws_instance.my_ec2.public_ip&quot;</span> <span class="token operator">|</span> terraform console

$ terraform console <span class="token parameter variable">-var</span> <span class="token string">&quot;foo=bar&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># This command provides an interactive command-line console for evaluating and experimenting with expressions.</span>
terraform console <span class="token punctuation">[</span>options<span class="token punctuation">]</span>

$ terraform console
<span class="token operator">&gt;</span>  max<span class="token punctuation">(</span><span class="token number">10,15</span>,5<span class="token punctuation">)</span>
<span class="token number">15</span>
<span class="token operator">&gt;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Cloud" title="标签">#Cloud</a><a href="/tags/?tag=IaC" title="标签">#IaC</a><a href="/tags/?tag=Terraform" title="标签">#Terraform</a><a href="/tags/?tag=HashiCorp" title="标签">#HashiCorp</a><a href="/tags/?tag=Common%20Command" title="标签">#Common Command</a><a href="/tags/?tag=Tool" title="标签">#Tool</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">1/27/2023, 2:53:17 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/68ba98/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Terraform CLI</div></a> <a href="/pages/83e046/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Terraform Chore</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
