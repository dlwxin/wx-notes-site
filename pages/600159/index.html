o" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-01-08</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Keyboard shortcuts in Windows 10<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="copy-paste-and-other-general-keyboard-shortcuts"><a href="#copy-paste-and-other-general-keyboard-shortcuts" class="header-anchor">#</a> Copy, paste, and other general keyboard shortcuts</h2> <table><thead><tr><th>Press this key</th> <th>To do this</th></tr></thead> <tbody><tr><td>Ctrl + X (or <strong>Shift + Delete</strong>)</td> <td>Cut the selected item.</td></tr> <tr><td>Ctrl + C (or <strong>Ctrl + Insert</strong>)</td> <td>Copy the selected item.</td></tr> <tr><td>Ctrl + V (or <strong>Shift + Insert</strong>)</td> <td>Paste the selected item.</td></tr> <tr><td>Ctrl + Z</td> <td>Undo an action.</td></tr> <tr><td>Alt + Tab</td> <td>Switch between open apps.</td></tr> <tr><td>Alt + F4</td> <td>Close the active item, or exit the active app.</td></tr> <tr><td>Windows logo key + L</td> <td>Lock your PC.</td></tr> <tr><td>Windows logo key + D</td> <td>Display and hide the desktop.</td></tr> <tr><td>F2</td> <td>Rename the selected item.</td></tr> <tr><td>F3</td> <td>Search for a file or folder in File Explorer.</td></tr> <tr><td>F4</td> <td>Display the address bar list in File Explorer.</td></tr> <tr><td>F5</td> <td>Refresh the active window.</td></tr> <tr><td>F6</td> <td>Cycle through screen elements in a window or on the desktop.</td></tr> <tr><td>F10</td> <td>Activate the Menu bar in the active app.</td></tr> <tr><td>Alt + F8</td> <td>Show your password on the sign-in screen.</td></tr> <tr><td>Alt + Esc</td> <td>Cycle through items in the order in which they were opened.</td></tr> <tr><td>Alt + underlined letter</td> <td>Perform the command for that letter.</td></tr> <tr><td><strong>Alt + Enter</strong></td> <td>Display properties for the selected item.</td></tr> <tr><td>Alt + Spacebar</td> <td>Open the shortcut menu for the active window.</td></tr> <tr><td>Alt + Left arrow</td> <td>Go back.</td></tr> <tr><td>Alt + Right arrow</td> <td>Go forward.</td></tr> <tr><td>Alt + Page Up</td> <td>Move up one screen.</td></tr> <tr><td>Alt + Page Down</td> <td>Move down one screen.</td></tr> <tr><td>Ctrl + F4</td> <td>Close the active document (in apps that are full-screen and let you have multiple documents open at the same time).</td></tr> <tr><td>Ctrl + A</td> <td>Select all items in a document or window.</td></tr> <tr><td>Ctrl + D (or Delete)</td> <td>Delete the selected item and move it to the Recycle Bin.</td></tr> <tr><td>Ctrl + R (or F5)</td> <td>Refresh the active window.</td></tr> <tr><td>Ctrl + Y</td> <td>Redo an action.</td></tr> <tr><td>Ctrl + Right arrow</td> <td>Move the cursor to the beginning of the next word.</td></tr> <tr><td>Ctrl + Left arrow</td> <td>Move the cursor to the beginning of the previous word.</td></tr> <tr><td>Ctrl + Down arrow</td> <td>Move the cursor to the beginning of the next paragraph.</td></tr> <tr><td>Ctrl + Up arrow</td> <td>Move the cursor to the beginning of the previous paragraph.</td></tr> <tr><td>Ctrl + Alt + Tab</td> <td>Use the arrow keys to switch between all open apps.</td></tr> <tr><td>Alt + Shift + arrow keys</td> <td>When a group or tile is in focus on the Start menu, move it in the direction specified.</td></tr> <tr><td>Ctrl + Shift + arrow keys</td> <td>When a tile is in focus on the Start menu, move it into another tile to create a folder.</td></tr> <tr><td>Ctrl + arrow keys</td> <td>Resize the Start menu when it's open.</td></tr> <tr><td>Ctrl + arrow key (to move to an item) + Spacebar</td> <td>Select multiple individual items in a window or on the desktop.</td></tr> <tr><td>Ctrl + Shift with an arrow key</td> <td>Select a block of text.</td></tr> <tr><td>Ctrl + Esc</td> <td>Open Start.</td></tr> <tr><td>Ctrl + Shift + Esc</td> <td>Open Task Manager.</td></tr> <tr><td>Ctrl + Shift</td> <td>Switch the keyboard layout when multiple keyboard layouts are available.</td></tr> <tr><td><strong>Ctrl + Spacebar</strong></td> <td>Turn the Chinese input method editor (IME) on or off.</td></tr> <tr><td>Shift + F10</td> <td>Display the shortcut menu for the selected item.</td></tr> <tr><td>Shift with any arrow key</td> <td>Select more than one item in a window or on the desktop, or select text in a document.</td></tr> <tr><td>Shift + Delete</td> <td>Delete the selected item without moving it to the Recycle Bin first.</td></tr> <tr><td>Right arrow</td> <td>Open the next menu to the right, or open a submenu.</td></tr> <tr><td>Left arrow</td> <td>Open the next menu to the left, or close a submenu.</td></tr> <tr><td>Esc</td> <td>Stop or leave the current task.</td></tr> <tr><td>PrtScn</td> <td>Take a screenshot of your whole screen and copy it to the clipboard</td></tr></tbody></table> <h2 id="windows-logo-key-keyboard-shortcuts"><a href="#windows-logo-key-keyboard-shortcuts" class="header-anchor">#</a> Windows logo key keyboard shortcuts</h2> <table><thead><tr><th>Press this key</th> <th>To do this</th></tr></thead> <tbody><tr><td>Windows Key</td> <td>Opens/closes the Start menu.</td></tr> <tr><td>Windows Key + Up Arrow</td> <td>Maximizes the selected window.</td></tr> <tr><td>Windows Key + Down Arrow</td> <td>Reduces the window size. (Restore down.)</td></tr> <tr><td>Windows Key + M</td> <td>Minimizes all open windows.</td></tr> <tr><td>Windows Key + Shift + M</td> <td>Opens minimized windows.</td></tr> <tr><td>Windows Key + Tab</td> <td>Shows Task View.</td></tr> <tr><td>Windows Key + L</td> <td>Locks the screen.</td></tr> <tr><td>Windows Key + A</td> <td>Opens the Action Center.</td></tr> <tr><td>Windows Key + V</td> <td>Opens Clipboard History.</td></tr> <tr><td>Windows Key + I</td> <td>Opens the Settings menu.</td></tr> <tr><td>Windows Key + F</td> <td>Opens the Feedback hub.</td></tr> <tr><td>Windows Key + H</td> <td>Opens the dictation toolbar.</td></tr> <tr><td>Windows Key + P</td> <td>Opens the projection settings.</td></tr> <tr><td>Windows Key + . (<code>Windows Key + ;</code>)</td> <td>Opens the emoji panel.</td></tr> <tr><td>Windows Key + C</td> <td>Opens Cortana in listening mode.</td></tr> <tr><td>Windows Key + C (Windows Key + Q)</td> <td>Opens Windows Search.</td></tr> <tr><td>Windows Key + G</td> <td>Opens the Xbox game bar.</td></tr> <tr><td>Windows Key + X</td> <td>Opens the secondary start menu.</td></tr> <tr><td>Windows Key + <code>&lt;number&gt;</code></td> <td>Opens the app in the taskbar relative to the number input.</td></tr> <tr><td>Windows Key + Alt + <code>&lt;number&gt;</code></td> <td>Opens the right-click menu for the app in the taskbar relative to the number input.</td></tr> <tr><td>Windows Key + D</td> <td>Shows/hides open apps on the desktop.</td></tr> <tr><td>Windows Key + E</td> <td>Opens File Explorer.</td></tr> <tr><td>Windows Key + U</td> <td>Opens Ease of Access in the Settings menu.</td></tr> <tr><td>Windows Key + Break</td> <td>Opens About in the Settings menu.</td></tr> <tr><td>Windows Key + Print Screen</td> <td>Takes a screenshot of the desktop.</td></tr> <tr><td>Windows Key + Shift + S</td> <td>Takes a screenshot of part of your screen.</td></tr> <tr><td>Windows Key + Control + F</td> <td>Opens the Find Computers window.</td></tr> <tr><td>Windows Key + Control + D</td> <td>Creates a virtual desktop.</td></tr> <tr><td>Windows Key + Control + Left Arrow</td> <td>Switches to the virtual desktop on the left.</td></tr> <tr><td>Windows Key + Control + Right Arrow</td> <td>Switches to the virtual desktop on the right.</td><
