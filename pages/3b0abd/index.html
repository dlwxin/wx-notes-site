-group depth-1"><p class="sidebar-heading"><span>MacOS</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Container</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>DevOps</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>WebServer</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GPT</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Cloud</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#OperatingSystem" data-v-057748f7>OperatingSystem</a></li><li data-v-057748f7><a href="/more/#Linux" data-v-057748f7>Linux</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-05-31</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Linux Commands about user<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>命令提示符，Linux 用这个符号标识登录的用户权限等级。如果是超级用户，提示符就是 <code>#</code>；如果是普通用户，提示符就是 <code>$</code>。</p> <p>命令格式： 命令 -选项 -参数（目录）
命令的选项用于调整命令功能，而命令的参数是这个命令的操作对象。</p> <h2 id="查看当前用户"><a href="#查看当前用户" class="header-anchor">#</a> 查看当前用户</h2> <p><strong><code>whoami</code> <code>who am i</code> <code>who</code></strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>@sjs_9_108 ~<span class="token punctuation">]</span>$ <span class="token function">whoami</span>
spider
<span class="token punctuation">[</span>@sjs_9_108 ~<span class="token punctuation">]</span>$ <span class="token function">who</span> am i
spider   pts/3        <span class="token number">2016</span>-07-26 <span class="token number">13</span>:16 <span class="token punctuation">(</span><span class="token number">192.168</span>.1.1<span class="token punctuation">)</span>
<span class="token punctuation">[</span>@sjs_9_108 ~<span class="token punctuation">]</span>$ <span class="token function">su</span> - root
Password:
<span class="token punctuation">[</span>@sjs_9_108 ~<span class="token punctuation">]</span><span class="token comment"># whoami  #变了</span>
root
<span class="token punctuation">[</span>@sjs_9_108 ~<span class="token punctuation">]</span><span class="token comment"># who am i #这个却没变</span>
spider   pts/3        <span class="token number">2016</span>-07-26 <span class="token number">13</span>:16 <span class="token punctuation">(</span><span class="token number">192.168</span>.1.1<span class="token punctuation">)</span>
<span class="token punctuation">[</span>@sjs_9_108 ~<span class="token punctuation">]</span><span class="token comment">#</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><ul><li><code>whoami</code> 显示的是当前操作用户的用户名</li> <li><code>who am i</code>显示的是登录用户的用户名（用户登录时用过的 id）</li> <li>实际用户 = uid 即 user id、有效用户 = euid 即 effecttive user id</li> <li><code>who am i</code> 此命令相当于 <code>who -m</code></li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>@sjs_9_108 word_code_160_180<span class="token punctuation">]</span>$ <span class="token function">who</span>
spider   pts/2        <span class="token number">2016</span>-07-26 <span class="token number">13</span>:11 <span class="token punctuation">(</span><span class="token number">192.168</span>.1.1<span class="token punctuation">)</span>
spider   pts/3        <span class="token number">2016</span>-07-26 <span class="token number">13</span>:16 <span class="token punctuation">(</span><span class="token number">192.168</span>.1.1<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ul><li>第一列显示用户名称</li> <li>第二列显示用户连接方式。Tty 意味着用户直接连接到电脑上，而 pts 意味着远程登录。</li> <li>第三、四列分别显示日期和时间</li> <li>第五列显示用户登录 IP 地址</li></ul> <h2 id="切换用户"><a href="#切换用户" class="header-anchor">#</a> 切换用户</h2> <p><strong><code>su</code> <code>su -</code> <code>sudo</code></strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">su</span> user
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><code>su</code>和<code>su -</code>区别</p> <ul><li><code>su</code>只是切换了 root 身份，但 Shell 环境仍然是普通用户的 Shell；此时 pwd，发现工作目录仍然是普通用户的工作目录</li> <li><code>su -</code>连用户和 Shell 环境一起切换成 root 身份了。只有切换了 Shell 环境才不会出现 PATH 环境变量错误。此时 pwd，工作目录变成 root 的工作目录了。用<code>echo $PATH</code>命令看一下<code>su</code>和<code>su -</code>以后的环境变量有何不同。</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>bash-4.2$ <span class="token builtin class-name">echo</span> <span class="token environment constant">$PATH</span>
/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin
<span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># echo $PATH</span>
/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin:/root/bin
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="su和sudo的区别"><a href="#su和sudo的区别" class="header-anchor">#</a> <code>su</code>和<code>sudo</code>的区别</h3> <ul><li>通过<code>sudo</code>，我们能把某些超级权限有针对性的下放，并且不需要普通用户知道<code>root</code>密码（<code>sudo</code>用的不是<code>root</code>密码，而是当前用户密码），所以<code>sudo</code>相对于权限无限制性的<code>su</code>来说，还是比较安全的，所以<code>sudo</code>也能被称为受限制的<code>su</code>，另外<code>sudo</code>是需要授权许可的，所以也被称为授权许可的<code>su</code>。</li> <li><code>sudo</code>执行命令的流程是当前用户切换到<code>root</code>（或其他指定切换到的用户），然后以<code>root</code>（或其他指定的切换到的用户）身份执行命令，执行完成后，直接退回到当前用户，而这些的前提是要通过 sudo 的配置文件/etc/sudoers 来进行授权。</li> <li><code>sudo</code>的配置文件是<code>/etc/sudoers</code>,我们可以用他的专用编辑工具 visodu 来进行配置，配置好后，可以切换到您授权的用户下，通过<code>sudo -l</code>来查看哪些命令是可以执行或禁止的。</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">sudo</span> <span class="token parameter variable">--list</span>
Matching Defaults entries <span class="token keyword">for</span> admin on learning-machine:
    env_reset, mail_badpass, <span class="token assign-left variable">secure_path</span><span class="token operator">=</span>/usr/local/sbin<span class="token punctuation">\</span>:/usr/local/bin<span class="token punctuation">\</span>:/usr/sbin<span class="token punctuation">\</span>:/usr/bin<span class="token punctuation">\</span>:/sbin<span class="token punctuation">\</span>:/bin<span class="token punctuation">\</span>:/snap/bin

User admin may run the following commands on learning-machine:
    <span class="token punctuation">(</span>ALL <span class="token builtin class-name">:</span> ALL<span class="token punctuation">)</span> NOPASSWD: ALL
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><h2 id="become-superuser"><a href="#become-superuser" class="header-anchor">#</a> become superuser</h2> <ul><li><a href="https://www.cyberciti.biz/faq/become-superuser-on-ubuntu-linux/" target="_blank" rel="noopener noreferrer">How do I become superuser on Ubuntu Linux using su/sudo?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>To become root user type:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token parameter variable">-i</span>
<span class="token comment"># OR</span>
<span class="token function">sudo</span> <span class="token parameter variable">-s</span>
<span class="token comment"># OR</span>
<span class="token function">sudo</span> <span class="token function">su</span> -
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>When promoted provide your password
After successful login, the <code>$</code> prompt would change to <code>#</code> to indicate that you logged in as root user on Ubuntu.</p> <p>To exit from sudo session of root user, type any one of the following <code>exit</code> command or <code>logout</code> command:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token builtin class-name">logout</span>

<span class="token builtin class-name">exit</span>
