ading"><span>Harbor</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>AgileDevelopment</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Anchore</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>WebServer</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GPT</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Cloud</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#DevOps" data-v-057748f7>DevOps</a></li><li data-v-057748f7><a href="/more/#Git" data-v-057748f7>Git</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2020-10-16</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Git Common Problem<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="please-clean-your-repository-working-tree-before-checkout"><a href="#please-clean-your-repository-working-tree-before-checkout" class="header-anchor">#</a> please clean your repository working tree before checkout</h2> <p>有的时候，在本地改了一些代码，想要把这些代码 push 到远程。 但在你想在 <code>git commit</code> 之前先执行 <code>git pull</code> 来获取最新的代码。这时 git 可能会报一个错误 <strong>please clean your repository working tree before checkout</strong></p> <blockquote><p>如果没有修改同一个文件，直接 <code>git pull</code> 是没有问题的。
如果可能发生冲突.直接 <code>git pull</code> 会拒绝覆盖当前的修改.</p></blockquote> <p>打开 log 看到如下错误</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>error: Your local changes to the following files would be overwritten by merge:
	test.md
Please commit your changes or stash them before you merge.
Aborting
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><p>根据提示可知 <code>test.md</code> 会被 <code>merge</code> 操作覆盖，因为 <code>test.md</code> 已经被其他人改过并提交到远程了。现在执行 <code>git pull</code>，远程的 <code>test.md</code> 就会把你本地改的 <code>test.md</code> 覆盖。</p> <blockquote><p>NB: <code>git pull</code> = <code>git fetch</code> + <code>git merge</code></p></blockquote> <p>所以 Git 提示，在 <code>merge</code> 之前把本地修改过的文件用 <code>git commit</code> 提交到本地仓库或者用 <code>git stash</code> 暂时存起来。</p> <p><strong>1. git commit</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>git commit -m &quot;update test.md by local&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>现在就可以执行 <code>git pull</code> 了</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>git pull
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>现在已经获取到最新代码了，执行 <code>git log</code> 命令可以看到在你刚才的 commit 后多了一条 commit 记录。</p> <p>E.g :</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># message:</span>
Merge branch <span class="token string">'master'</span> of https://github.com/user/command-test
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p><strong>2. git stash</strong></p> <ul><li>执行 <code>git stash save &quot;tmp&quot;</code> 将修改过的文件暂时存起来。</li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>git stash save &quot;tmp&quot;
# or
git stash
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><ul><li>执行 <code>git pull</code> 获取最新代码</li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>git pull
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><ul><li>这时应该可以看到最新的代码了， 接下来就要执行 <code>git stash pop</code> 把本地修改的代码移出来</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">git</span> stash pop
Auto-merging test.md
On branch master
Your branch is up to <span class="token function">date</span> with <span class="token string">'origin/master'</span><span class="token builtin class-name">.</span>

Changes not staged <span class="token keyword">for</span> commit:
  <span class="token punctuation">(</span>use <span class="token string">&quot;git add &lt;file&gt;...&quot;</span> to update what will be committed<span class="token punctuation">)</span>
  <span class="token punctuation">(</span>use <span class="token string">&quot;git restore &lt;file&gt;...&quot;</span> to discard changes <span class="token keyword">in</span> working directory<span class="token punctuation">)</span>
        modified:   test.md

no changes added to commit <span class="token punctuation">(</span>use <span class="token string">&quot;git add&quot;</span> and/or <span class="token string">&quot;git commit -a&quot;</span><span class="token punctuation">)</span>
Dropped refs/stash@<span class="token punctuation">{</span><span class="token number">0</span><span class="token punctuation">}</span> <span class="token punctuation">(</span>03bced0ac598ea243a003f19061f2e910240c185<span class="token punctuation">)</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p>可以发现本地修改的代码已经被自动 merge 到当前的代码（最新的代码）中了。 接下来的操作就正常的流程一下了</p> <p>E.g</p> <div class="language- line-numbers-mode"><pre class="language-text"><code>git add test.md

git commit -m &quot;update test.md&quot;
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><blockquote><p>值得注意的是：用 <code>git stash</code> 并没有像 <code>git commit</code> 那样多出来一个用来 merge 的 commit 记录</p></blockquote> <p><strong>3. git branch</strong></p> <p>可以新建一个分支,把当前代码提交过去,之后再 merge 回来。</p> <h2 id="this-repository-currently-has-approximately-1500-loose-objects"><a href="#this-repository-currently-has-approximately-1500-loose-objects" class="header-anchor">#</a> This repository currently has approximately 1500 loose objects.</h2> <ul><li><a href="https://stackoverflow.com/questions/21457407/git-gui-perpetually-getting-this-repository-currently-has-approximately-320-lo" target="_blank" rel="noopener noreferrer">Git Gui: Perpetually getting “This repository currently has approximately 320 loose objects.”<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://stackoverflow.com/questions/1106529/how-to-skip-loose-object-popup-when-running-git-gui" target="_blank" rel="noopener noreferrer">How to skip “Loose Object” popup when running 'git gui'<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://stackoverflow.com/questions/5709687/what-are-the-loose-objects-that-the-git-gui-refers-to" target="_blank" rel="noopener noreferrer">What are the “loose objects” that the Git GUI refers to?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Every time I start Git Gui on a particular project I get this message:</p> <blockquote><p>This repository currently has approximately 256 loose objects</p></blockquote> <p>I clicked Yes.</p> <p>when I open Git Gui again, I get the <strong>exact same message</strong>, again about 320 loose objects! It's as if clicking Yes had no effect at all.</p> <p>Soultion:</p> <p>This should be fixable by running this command from the command line:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token builtin class-name">cd</span> path/to/your/git/repo
<span class="token function">git</span> gc <span class="token parameter variable">--aggressive</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>From the output of <code>git help gc</code>:</p> <blockquote><p>Runs a number of housekeeping tasks within the current repository, such as compressing file revisions (to reduce disk space and increase performance) and removing unreachable objects which may have been created from prior invocations of git add.</p> <p>Users are encouraged to run this task on a regular basis within each repository to maintain good disk space utilization and good operating performance.</p> <p>--aggressive</p> <blockquote><p>Usually git gc runs very quickly while providing good disk space utilization and performance. This option will cause git gc to more aggressively optimize the repository at the expense of taking much more time. The effects of this optimization are persistent, so this option only needs to be used occasionally; every few hundred changesets or so.</p></blockquote></blockquote> <p>if you use Git v1.7.9 or newer, you can disable the warning dialog with the following command:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">git</span> config <span class="token parameter variable">--global</span> gui.gcwarning <span class="token boolean">false</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="how-to-prevent-git-stash-dropping-changes-to-files-with-the-assume-unchanged-bit"><a href="#how-to-prevent-git-stash-dropping-changes-to-files-with-the-assume-unchanged-bit" class="header-anchor">#</a> How to prevent git stash dropping changes to files with the “assume unchanged” bit?</h2> <ul><li><a href="https://stackoverflow.com/questions/5962456/how-to-prevent-git-stash-dropping-changes-to-files-with-the-assume-unchanged-b" target="_blank" rel="noopener noreferrer">How to prevent git stash dropping changes to files with the “assume unchanged” bit?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="http://git.661346.n2.nabble.com/git-stash-deletes-drops-changes-of-quot-assume-unchanged-quot-files-td5140213.html" target="_blank" rel="noopener noreferrer">git stash deletes/drops changes of &quot;assume-unchanged&quot; files<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="github-error-unable-to-read-askpass-response-from-gnome-ssh-askpass"><a href="#github-error-unable-to-read-askpass-response-from-gnome-ssh-askpass" class="header-anchor">#</a> github error: unable to read askpass response from gnome-ssh-askpass</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># Root Cause</span>
<span class="token variable">$cat</span> /etc/profile.d/gnome-ssh-askpass.sh
<span class="token assign-left variable">SSH_ASKPASS</span><span class="token operator">=</span>/usr/libexec/openssh/gnome-ssh-askpass

<span class="token comment"># Fixed</span>
<span class="token variable">$unset</span> SSH_ASKPASS
<span class="token comment"># then</span>
<span class="token variable">$git</span> push origin master
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Git" title="标签">#Git</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">12/10/2022, 6:13:34 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/74311f/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Git on MacOS</div></a> <a href="/pages/cd3eff/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">How to exclude files from Git only on your computer</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
