ink">To replace tab with four spaces in Eclipse</a></li><li class="sidebar-sub-header level2"><a href="/pages/8ca6e0/#设置代理-proxy" class="sidebar-link">设置代理(Proxy)</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/8ca6e0/#option1-2" class="sidebar-link">Option1</a></li><li class="sidebar-sub-header level3"><a href="/pages/8ca6e0/#option2-2" class="sidebar-link">Option2</a></li></ul></li></ul></li><li><a href="/pages/82d18f/" class="sidebar-link">Config Weblogic Server in Eclipse</a></li><li><a href="/pages/954b2d/" class="sidebar-link">Shortcut key of Eclipse</a></li><li><a href="/pages/4aa554/" class="sidebar-link">How to specify jdk path for Eclipse</a></li><li><a href="/pages/89422d/" class="sidebar-link">Eclipse Common Plugin</a></li><li><a href="/pages/d11d51/" class="sidebar-link">Eclipse Chore</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>idea</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Fleet</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>vscode</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>notepad++</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>CVE</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>browser</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>articles</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>others</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/others/#Others" data-v-057748f7>Others</a></li><li data-v-057748f7><a href="/others/#editorAndIDE" data-v-057748f7>editorAndIDE</a></li><li data-v-057748f7><a href="/others/#eclipse" data-v-057748f7>eclipse</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2020-09-25</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Settings of Eclipse<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="设置字体大小"><a href="#设置字体大小" class="header-anchor">#</a> 设置字体大小</h2> <p>Window -&gt; Preferences -&gt; General -&gt; Apprearance -&gt; Colors and Fonts -&gt; Basic -&gt; Text font</p> <p>Description: The text font is used by text editors.</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-setting-font1.9063ef44.png" alt="Eclipse settings font1"></p></details> <p>Window -&gt; Preferences -&gt; General -&gt; Apprearance -&gt; Colors and Fonts -&gt; Java -&gt; Java Editor Text Font(<em>set to default: Text font</em>)</p> <p>Description: The Java editor text font is used by Java editors.</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-setting-font2.e65ec6e4.png" alt="Eclipse settings font2"></p></details> <br> <h2 id="设置背景颜色"><a href="#设置背景颜色" class="header-anchor">#</a> 设置背景颜色</h2> <p>Window -&gt; Preferences -&gt; General -&gt; Editors -&gt; Text Editors -&gt; Backgroud colors</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-setting-bg.dff3fc65.png" alt="Eclipse settings backgroud"></p></details> <br> <h2 id="设置代码自动补全"><a href="#设置代码自动补全" class="header-anchor">#</a> 设置代码自动补全</h2> <p>Window -&gt; Perferences -&gt; Java -&gt; Editor -&gt; Content Assist</p> <p>在<code>Auto activation triggers for Java:</code>选项后的文本框中会看到一个<code>.</code>。</p> <p>eclipse 默认只有在你输入<code>.</code>之后才会有代码提示和自动补全。</p> <p>需要在<code>.</code>之后加上<code>abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ</code>,</p> <p>但是配置了代码自动补全后，常常空格时<strong>被补全代码</strong>，这就很烦了. 所以需要勾选 <code>Disable insertion triggers except 'Enter'</code></p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-auto-activation-triggers-for-Java.90a3c828.png" alt="Eclipse settings auto activation trigger for java"></p></details> <p>注意，如果代码自动补全不起作用。看一下 Window -&gt; Perferences -&gt; Java -&gt; Editor -&gt; Content Assist -&gt; Advanced<br>
在 <strong>Select the proposal kinds contained in the 'default' content assist list:</strong> tab 中<br>
勾选 checkbox <code>Java Proposals</code> 或者 <code>Java Proposals(Task-Focused)</code>（如果这个选项存在）</p> <br> <h2 id="禁用-appxray"><a href="#禁用-appxray" class="header-anchor">#</a> 禁用 AppXray</h2> <p>Window -&gt; Perferences -&gt; Oracle -&gt; AppXray</p> <p>eclipse 启动后， 经常卡在 AppXray Resource Change Handler，不管进行什么操作都是这里要等待这个进程的完成。然后不断关闭进程重启启动都是这样。</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-disable-AppXray.2d50377b.png" alt="Eclipse settings for disable AppXray"></p></details> <br> <h2 id="移除最近的-workspaces"><a href="#移除最近的-workspaces" class="header-anchor">#</a> 移除最近的 workspaces</h2> <p>Window -&gt; Preferences -&gt; General -&gt; Startup and Shutdown -&gt; Workspaces</p> <p><code>Prompt for workspace on startup</code> checkbox: if seleced, it means can select workspace when eclipse startup.</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-remove-recent-workspace.841fe0a4.png" alt="Eclipse settings for remove recent workspace"></p></details> <br> <h2 id="移除不需要的启动项"><a href="#移除不需要的启动项" class="header-anchor">#</a> 移除不需要的启动项</h2> <p>Window -&gt; Preferences -&gt; General -&gt; Startup and Shutdown</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-startup-shutdown.1d9cf8a7.png" alt="Eclipse settings for Startup and Shutdown"></p></details> <br> <h2 id="禁用自动更新"><a href="#禁用自动更新" class="header-anchor">#</a> 禁用自动更新</h2> <p>Window -&gt; Preferences -&gt; Install/Update &gt; Automatic Updates</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-automatic-update.6dd18f73.png" alt="Eclipse settings for Automatic Update"></p></details> <br> <h2 id="customize-perspective"><a href="#customize-perspective" class="header-anchor">#</a> Customize Perspective</h2> <p>Window -&gt; Perspective &gt; Customize Perspective</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-customize-perspective.63d11bba.png" alt="Eclipse settings for Customize Perspective"></p></details> <br> <h2 id="禁用-validation"><a href="#禁用-validation" class="header-anchor">#</a> 禁用 Validation</h2> <p>Window -&gt; Preferences -&gt; Validation</p> <details class="custom-block details"><summary>Click me to view the image</summary> <p><img src="/assets/img/eclipse-validation.3adfddea.png" alt="Eclipse settings for Validation"></p></details> <br> <h2 id="code-snippets-in-eclipse"><a href="#code-snippets-in-eclipse" class="header-anchor">#</a> Code Snippets in Eclipse</h2> <p>Window -&gt; Perferences -&gt; Java -&gt; Editor -&gt; Templates</p> <h2 id="modify-shortcuts-in-eclipse"><a href="#modify-shortcuts-in-eclipse" class="header-anchor">#</a> Modify shortcuts in Eclipse</h2> <p>Window -&gt; Perferences -&gt; General -&gt; Keys</p> <h2 id="how-to-support-utf-8-encoding-in-eclipse"><a href="#how-to-support-utf-8-encoding-in-eclipse" class="header-anchor">#</a> How to support UTF-8 encoding in Eclipse</h2> <h3 id="option1"><a href="#option1" class="header-anchor">#</a> Option1</h3> <ul><li><p>Window -&gt; Perferences -&gt; General -&gt; Content Types, set UTF-8 as the default encoding for all content types.</p></li> <li><p>Window -&gt; Preferences -&gt; General -&gt; Workspace, set Text file encoding to Other : UTF-8</p></li></ul> <h3 id="option2"><a href="#option2" class="header-anchor">#</a> Option2</h3> <p>You can set a default encoding-set whenever you run <code>eclipse.exe</code>.</p> <ul><li>Open <code>eclipse.ini</code> in your eclipse home directory Or <code>STS.ini</code> in case of STS(Spring Tool Suite)</li> <li>put the line below at the end of the file</li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>-Dfile.encoding=UTF-8
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="set-targeted-runtimes-for-project-in-eclipse"><a href="#set-targeted-runtimes-for-project-in-eclipse" class="header-anchor">#</a> Set Targeted Runtimes for project in Eclipse</h2> <p>E.g:</p> <p>Select project <code>MyProject</code> -&gt; right click -&gt; select <code>Targeted Runtimes</code> -&gt; choose runtime <code>Oracle Weblogic Server 14.1.1.0</code></p> <p>Note: You need to install Weblogic Server tool in Eclipse firstly, then you can choose runtime <code>Oracle Weblogic Server 14.1.1.0</code></p> <h2 id="import-folder-as-a-project-into-eclipse"><a href="#import-folder-as-a-project-into-eclipse" class="header-anchor">#</a> Import folder as a project into Eclipse</h2> <p>E.g:</p> <p>If you import the <code>deploy</code> folder as a project into the workspace. First, you need to create a file called <code>.project</code> and copy the following content to the file.</p> <div class="language-xml line-numbers-mode"><pre class="language-xml"><code><span class="token prolog">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;</span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>projectDescription</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>name</span><span class="token punctuation">&gt;</span></span>deploy<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>name</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>comment</span><span class="token punctuation">&gt;</span></span><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>comment</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>projects</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>projects</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>buildSpec</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>buildSpec</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>natures</span><span class="token punctuation">&gt;</span></span>
	<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>natures</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>projectDescription</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><h2 id="increase-ui-scaling-in-eclipse-on-macos"><a href="#increase-ui-scaling-in-eclipse-on-macos" class="header-anchor">#</a> Increase UI scaling in eclipse on MacOS</h2> <ul><li><a href="https://stackoverflow.com/questions/70357385/can-i-increase-ui-scaling-in-eclipse-on-mac" target="_blank" rel="noopener noreferrer">increase UI scaling in eclipse on Mac<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Eclipse -&gt; Perferences...(<code>Cmd + ,</code>) -&gt; General -&gt; Apprearance -&gt; Colors and Fonts -&gt; View and Editor Folders</p> <ol><li>Change <code>Tree and Table font for views</code></li> <li>Change <code>Part title font</code></li></ol> <h2 id="to-replace-tab-with-four-spaces-in-eclipse"><a href="#to-replace-tab-with-four-spaces-in-eclipse" class="header-anchor">#</a> To replace tab with four spaces in Eclipse</h2> <ol><li>Eclipse -&gt; Perferences -&gt; General -&gt; Editors -&gt; Click <code>Text Editors</code> -&gt; Set <code>Displayed tab width</code> to <code>4</code> and selected <code>Insert spaces for tabs</code></li> <li>Eclipse -&gt; Perferences -&gt; Java -&gt; Code Style -&gt; Formatter<br>
Click <code>new</code> -&gt; Enter Profile name(for example: <code>use-spaces</code>) -&gt; Click <code>OK</code> -&gt; Click <code>indentation</code> -&gt; set <code>Tab policy</code> to <code>Spaces only</code>, <code>indentation size</code> to <code>4</code>, <code>Tab sizes</code> to <code>4</code> -&gt; Click <code>OK</code> -&gt; Click <code>Apply</code></li> <li>Eclipse -&gt; Perferences -&gt; Web -&gt; HTML Files -&gt; Editors -&gt; Selected <code>indent using spaces</code> and set <code>indentation size</code> to <code>4</code></li> <li>Eclipse -&gt; Perferences -&gt; XML -&gt; XML Files -&gt; Editors -&gt; Selected <code>indent using spaces</code> and set <code>indentation size</code> to <code>4</code></li></ol> <h2 id="设置代理-proxy"><a href="#设置代理-proxy" class="header-anchor">#</a> 设置代理(Proxy)</h2> <h3 id="option1-2"><a href="#option1-2" class="header-anchor">#</a> Option1</h3> <ol><li>Open Eclipse and go to <code>Window</code> -&gt; <code>Preferences</code>.</li> <li>In the Preferences dialog box, expand the <code>General</code> menu by clicking on the arrow next to it.</li> <li>Click on <code>Network Connections</code> option from the General menu.</li> <li>In the Network Connections dialog box, select the <code>Active Provider</code> drop-down list and choose <code>Manual</code>.</li> <li>To add a new proxy entry, click on the <code>Add</code> button on the right side.</li> <li>Fill up the proxy server details such as Proxy Name, Host, Port and Authentication if required.</li> <li>Click on OK button to save the changes.</li> <li>Finally, restart Eclipse for the changes to take effect.</li></ol> <h3 id="option2-2"><a href="#option2-2" class="header-anchor">#</a> Option2</h3> <ul><li>Open <code>eclipse.ini</code> in your eclipse home directory Or <code>STS.ini</code> in case of STS(Spring Tool Suite)</li> <li>Add the following lines at the end of the file</li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>-Djava.net.useSystemProxies=true
-Dhttp.proxyHost=127.0.0.1
-Dhttp.proxyPort=1080
;-Dhttps.proxyHost=yourproxyaddress.com
;-Dhttps.proxyPort=yourproxyportnumber
;-Dhttp.proxyUser=mydomain\myusername
;-Dhttp.proxyPassword=mypassword
;-Dhttp.nonProxyHosts=localhost|127.0.0.1|192.168.*|10.*
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Eclipse" title="标签">#Eclipse</a><a href="/tags/?tag=IDE%2FEditor" title="标签">#IDE/Editor</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">11/25/2023, 7:16:27 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/59ccd3/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">brew Common Commands</div></a> <a href="/pages/82d18f/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Config Weblogic Server in Eclipse</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
