i><a href="https://plugins.jenkins.io/purge-job-history/" target="_blank" rel="noopener noreferrer">Purge Job History<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Go to a Job (Any type of) or a Folder and click on the &quot;Purge Build History&quot; link on the left menu.</p> <p>Select none or all of the options.</p> <ul><li>Reset build number to 1: Resets the next build number 1 if all the builds are deleted.</li> <li>Delete builds marked to be kept forever: Als delete any builds even they are marked to keep forever.</li> <li>Recurse into sub-folders/sub-jobs: Recurse into all Jobs/Folders under the selected Job/Folder</li></ul> <p>Note: If you click &quot;Purge Build History&quot; link on the main page of the Jenkins. Plugin will recurse into all Jobs/Folder and delete the builds depending on your selection.</p> <h3 id="version-number"><a href="#version-number" class="header-anchor">#</a> Version Number</h3> <div id="version_number"></div> <ul><li><a href="https://plugins.jenkins.io/versionnumber/" target="_blank" rel="noopener noreferrer">Version Number<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.         <span class="token comment">// tag = VersionNumber projectStartDate: '', versionNumberString: 'V${BUILDS_ALL_TIME}' versionPrefix: '', worstResultForIncrement: 'SUCCESS'</span>
        <span class="token comment">// tag = VersionNumber (versionNumberString: '${BUILD_DATE_FORMATTED, &quot;yyyyMMdd&quot;}-develop-${BUILDS_TODAY}') // 20220816-develop-1</span>
        tag <span class="token operator">=</span> VersionNumber <span class="token punctuation">(</span>versionNumberString<span class="token punctuation">:</span> <span class="token string">'V${BUILDS_ALL_TIME}'</span><span class="token punctuation">)</span> <span class="token comment">// V2</span>
    <span class="token punctuation">}</span>
    stages <span class="token punctuation">{</span>
        <span class="token function">stage</span><span class="token punctuation">(</span><span class="token string">'Build'</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
            steps <span class="token punctuation">{</span>
                echo <span class="token string">'Building..'</span>

            <span class="token punctuation">}</span>
        <span class="token punctuation">}</span>
    <span class="token punctuation">}</span>
<span class="token punctuation">}</span>

s<span class="token punctuation">:</span> <span class="token punctuation">[</span><span class="token punctuation">[</span>scanPattern<span class="token punctuation">:</span> <span class="token string">'**'</span><span class="token punctuation">]</span><span class="token punctuation">,</span> <span class="token punctuation">[</span>scanPattern<span class="token punctuation">:</span> <span class="token string">'!.git/**'</span><span class="token punctuation">]</span><span class="token punctuation">]</span>

    <span class="token function">stage</span><span class="token punctuation">(</span><span class="token string">'IQ Evaluation'</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>

        echo <span class="token interpolation-string"><span class="token string">&quot;Patterns: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span><span class="token expression">patterns <span class="token keyword">as</span> List</span><span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">&quot;</span></span>

        <span class="token comment">// 如果直接把 value 付给一个变量， value 必须用 '', e.g.: '**/*.js'</span>
        <span class="token comment">// def iqScanPatternsObj = [[scanPattern: '**/*.js'], [scanPattern: '**/*.ts'], [scanPattern: '**/package.json'], [scanPattern: '**/package-lock.json'],[scanPattern: '**/npm-shrinkwrap.json'], [scanPattern: '**/yarn.lock'], [scanPattern: '**/pnpm-lock.yaml'], [scanPattern: '**/*.*.tgz']]</span>
        <span class="token comment">// 如果 value 是通过解析生成的， value 一定不能用 '', e.g.: **/*.js</span>
        <span class="token keyword">def</span> iqScanPatternsObj <span class="token operator">=</span> patterns<span class="token punctuation">.</span>collect <span class="token punctuation">{</span><span class="token punctuation">[</span> scanPattern<span class="token punctuation">:</span> it<span class="token punctuation">.</span><span class="token function">trim</span><span class="token punctuation">(</span><span class="token punctuation">)</span> <span class="token punctuation">]</span><span class="token punctuation">}</span>
        <span class="token comment">// [[scanPattern:**/*.js], [scanPattern:**/*.ts], [scanPattern:**/package.json], [scanPattern:**/package-lock.json], [scanPattern:**/npm-shrinkwrap.json], [scanPattern:**/yarn.lock], [scanPattern:**/pnpm-lock.yaml], [scanPattern:**/*.*.tgz]]</span>
        echo <span class="token interpolation-string"><span class="token string">&quot;iqScanPatternsObj: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span><span class="token expression">iqScanPatternsObj</span><span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">&quot;</span></span>

        echo <span class="token interpolation-string"><span class="token string">&quot;iqScanPatternsObj class: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span><span class="token expression">iqScanPatternsObj<span class="token punctuation">.</span><span class="token function">getClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span></span><span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">&quot;</span></span>
        echo <span class="token interpolation-string"><span class="token string">&quot;iqScanPatternsObj first element class: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span><span class="token expression">iqScanPatternsObj<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span><span class="token function">getClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span></span><span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">&quot;</span></span>
        echo <span class="token interpolation-string"><span class="token string">&quot;iqScanPatternsObj first element scanPattern class: </span><span class="token interpolation"><span class="token interpolation-punctuation punctuation">${</span><span class="token expression">iqScanPatternsObj<span class="token punctuation">[</span><span class="token number">0</span><span class="token punctuation">]</span><span class="token punctuation">.</span>scanPattern<span class="token punctuation">.</span><span class="token function">getClass</span><span class="token punctuation">(</span><span class="token punctuation">)</span></span><span class="token interpolation-punctuation punctuation">}</span></span><span class="token string">&quot;</span></span>

        nexusPolicyEvaluation <span class="token punctuation">(</span>
            iqApplication<span class="token punctuation">:</span> <span class="token string">'testApp'</span><span class="token punctuation">,</span>
            iqScanPatterns<span class="token punctuation">:</span> iqScanPatternsObj<span class="token punctuation">,</span>
            iqStage<span class="token punctuation">:</span> <span class="token string">'build'</span><span class="token punctuation">,</span>

    <span class="token punctuation">}</span>
