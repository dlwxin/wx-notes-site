der level2"><a href="/pages/759582/#what-is-the-expect" class="sidebar-link">What is the Expect?</a></li><li class="sidebar-sub-header level2"><a href="/pages/759582/#installation" class="sidebar-link">Installation</a><ul class="sidebar-sub-headers"><li class="sidebar-sub-header level3"><a href="/pages/759582/#expect-usage" class="sidebar-link">Expect Usage</a></li></ul></li><li class="sidebar-sub-header level2"><a href="/pages/759582/#examples" class="sidebar-link">Examples</a></li></ul></li><li><a href="/pages/0b86b1/" class="sidebar-link">Linux Commands df and du</a></li><li><a href="/pages/1b05e3/" class="sidebar-link">Linux Run SCP SSH Without Password</a></li><li><a href="/pages/fa4788/" class="sidebar-link">Linux common question</a></li><li><a href="/pages/68f2bf/" class="sidebar-link">Shell</a></li><li><a href="/pages/ea121a/" class="sidebar-link">Shell Command sed</a></li><li><a href="/pages/cd6b1f/" class="sidebar-link">Shell Command test</a></li><li><a href="/pages/d664f6/" class="sidebar-link">Shell Command awk</a></li><li><a href="/pages/ac2689/" class="sidebar-link">Shell Command grep</a></li><li><a href="/pages/1677f0/" class="sidebar-link">Shell Input Output Redirection</a></li><li><a href="/pages/6e998d/" class="sidebar-link">Shell string interception</a></li><li><a href="/pages/151885/" class="sidebar-link">Shell Auto Completion</a></li><li><a href="/pages/84a54b/" class="sidebar-link">Shell reading content line by line</a></li><li><a href="/pages/dd1ecd/" class="sidebar-link">Shell Array and Map</a></li><li><a href="/pages/f46d1b/" class="sidebar-link">Shell script examples</a></li><li><a href="/pages/044c59/" class="sidebar-link">Shell Chore</a></li><li><a href="/pages/368de5/" class="sidebar-link">Linux interview question</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Windows</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>MacOS</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Container</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>DevOps</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>WebServer</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GPT</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Cloud</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#OperatingSystem" data-v-057748f7>OperatingSystem</a></li><li data-v-057748f7><a href="/more/#Linux" data-v-057748f7>Linux</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-12-12</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Linux Command expect<!----></h1> <!----> <div class="theme-vdoing-content content__default"><ul><li><a href="https://www.cnblogs.com/saneri/p/10819348.html" target="_blank" rel="noopener noreferrer">Linux expect 介绍和用法<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="what-is-the-expect"><a href="#what-is-the-expect" class="header-anchor">#</a> What is the Expect?</h2> <p>Expect 是一个免费的编程工具语言，用来实现自动和交互式任务进行通信，而无需人的干预。expect 就是一套用来实现自动交互功能的软件。</p> <p>比如说在 shell 脚本中通过 ssh 去登录另一台机器，或者通过 scp 复制文件，等等。就会有交互式界面等待你输入密码，手动输入密码后脚本才能继续执行。很多时候我们不希望在脚本的执行过程中需要人为的干预，比如 CICD。 这时就可以用 Expect 来处理这类问题。</p> <h2 id="installation"><a href="#installation" class="header-anchor">#</a> Installation</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>yum <span class="token function">install</span> <span class="token parameter variable">-y</span> <span class="token function">expect</span>
<span class="token comment"># or</span>
dnf <span class="token function">install</span> <span class="token parameter variable">-y</span> <span class="token function">expect</span>
<span class="token comment"># or</span>
<span class="token function">apt</span> <span class="token function">install</span> <span class="token function">expect</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="expect-usage"><a href="#expect-usage" class="header-anchor">#</a> Expect Usage</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">expect</span> <span class="token parameter variable">-help</span>
usage: <span class="token function">expect</span> <span class="token punctuation">[</span>-dDhinNv<span class="token punctuation">]</span> <span class="token punctuation">[</span>-c cmds<span class="token punctuation">]</span> <span class="token punctuation">[</span><span class="token punctuation">[</span>-<span class="token punctuation">[</span>f<span class="token operator">|</span>b<span class="token punctuation">]</span><span class="token punctuation">]</span> cmdfile<span class="token punctuation">]</span> <span class="token punctuation">[</span>args<span class="token punctuation">]</span>
  Flags are as follows:
  <span class="token parameter variable">-b</span>     prefaces a <span class="token function">file</span> from <span class="token function">which</span> to <span class="token builtin class-name">read</span> commands from
           <span class="token punctuation">(</span>expect reads one line at a timei from the <span class="token function">file</span><span class="token punctuation">)</span>
  <span class="token parameter variable">-c</span>     prefaces a <span class="token builtin class-name">command</span> to be executed before any <span class="token keyword">in</span> the script,
           may be used multiple <span class="token builtin class-name">times</span>
  <span class="token parameter variable">-d</span>     enables diagnostic output
  <span class="token parameter variable">-D</span>     enables interactive debugger
  <span class="token parameter variable">-f</span>     prefaces a <span class="token function">file</span> from <span class="token function">which</span> to <span class="token builtin class-name">read</span> commands from
           <span class="token punctuation">(</span>expect reads the whole <span class="token function">file</span> at once<span class="token punctuation">)</span>
  <span class="token parameter variable">-h</span>     prints this usage message and exits
  <span class="token parameter variable">-i</span>     interactively prompts <span class="token keyword">for</span> commands
  <span class="token parameter variable">-n</span>     <span class="token function">expect</span> doesn<span class="token string">'t read personal rc file
  -N     expect doesn'</span>t <span class="token builtin class-name">read</span> system-wide rc <span class="token function">file</span>
  <span class="token parameter variable">-v</span>     prints version and exits
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code>spawn               <span class="token comment"># 交互程序开始后面跟命令或者指定程序</span>
<span class="token function">expect</span>              <span class="token comment"># 获取匹配信息匹配成功则执行expect后面的程序动作</span>
send exp_send       <span class="token comment"># 用于发送指定的字符串信息</span>
exp_continue        <span class="token comment"># 在expect中多次匹配就需要用到</span>
send_user           <span class="token comment"># 用来打印输出 相当于shell中的echo</span>
<span class="token builtin class-name">exit</span>                <span class="token comment"># 退出expect脚本</span>
eof                 <span class="token comment"># expect执行结束 退出</span>
<span class="token builtin class-name">set</span>                 <span class="token comment"># 定义变量</span>
puts                <span class="token comment"># 输出变量</span>
<span class="token builtin class-name">set</span> <span class="token function">timeout</span>         <span class="token comment"># 设置超时时间</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><h2 id="examples"><a href="#examples" class="header-anchor">#</a> Examples</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token assign-left variable"><span class="token environment constant">USER</span></span><span class="token operator">=</span>admin
