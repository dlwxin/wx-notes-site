s="sidebar-link">minikube basic</a></li><li><a href="/pages/8b748f/" class="sidebar-link">Kubernetes Related Tool</a></li><li><a href="/pages/ebe316/" class="sidebar-link">k8s Chore</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Rancher</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>OpenShift</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Tencent</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Azure</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Aliyun</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>AWS</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>ElasticStack</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Terraform</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Helm</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Kong</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Prometheus</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Grafana</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Others</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#Cloud" data-v-057748f7>Cloud</a></li><li data-v-057748f7><a href="/more/#Kubernetes" data-v-057748f7>Kubernetes</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2022-02-10</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->k8s DaemonSet related<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="ds-spec-字段说明"><a href="#ds-spec-字段说明" class="header-anchor">#</a> <code>ds.spec</code> 字段说明</h2> <table><thead><tr><th>字段</th> <th>类型</th> <th>说明</th></tr></thead> <tbody><tr><td>minReadySeconds</td> <td><code>&lt;integer&gt;</code></td> <td>新创建的 DaemonSet pod 在容器不崩溃的情况下准备就绪的最小秒数，这样才能认为它可用。默认值为 0 (pod 准备好 后即被认为可用)</td></tr> <tr><td>revisionHistoryLimit</td> <td><code>&lt;integer&gt;</code></td> <td>要保留以允许回滚的旧历史记录数。默认为 10。</td></tr> <tr><td>selector</td> <td><code>&lt;Object&gt;</code><br> -required-</td> <td>通过 DaemonSet 管理的容器上的标签查询。 必须匹配才能被控制。 它必须与 Pod 模板的标签匹配。</td></tr> <tr><td>template</td> <td><code>&lt;Object&gt;</code><br> -required-</td> <td>描述将要创建的 pod 的对象。DaemonSet 将在与模板的节点选择器相匹配的每个节点上(或者在没有指定节点选择器的 每个节点上)创建这个 pod 的一个副本。</td></tr> <tr><td>updateStrategy</td> <td><code>&lt;Object&gt;</code></td> <td>更新策略，用新的 Pod 替换现有的 DaemonSet Pod。</td></tr></tbody></table> <h2 id="ds-spec-updatestrategy-部署策略"><a href="#ds-spec-updatestrategy-部署策略" class="header-anchor">#</a> <code>ds.spec.updateStrategy</code> 部署策略</h2> <table><thead><tr><th>字段</th> <th>说明</th></tr></thead> <tbody><tr><td>OnDelete</td> <td>当删除该 node 节点上的 ds pod 后，才进行更新(创建新版本的 pod)</td></tr> <tr><td>RollingUpdate</td> <td>默认策略滚动更新。一个 node 节点上的 ds pod 更新后等待 minReadySeconds 秒后，更新下一个 node 节点的 ds pod。 maxUnavailable 默认为 1，即一个节点一个节点进行更新。</td></tr></tbody></table> <h2 id="deployment-控制器和-daemonset-控制器比较"><a href="#deployment-控制器和-daemonset-控制器比较" class="header-anchor">#</a> Deployment 控制器和 DaemonSet 控制器比较</h2> <h3 id="说明"><a href="#说明" class="header-anchor">#</a> 说明</h3> <p>Deployment 为 Pod 和 ReplicaSet 提供声明式更新。只需 要在 Deployment 中描述想要的目标状态是什么，Deployment controller 就会帮您将 Pod 和 ReplicaSet 的实际状态改变 到您的目标状态。也可以定义一个全新的 Deployment 来创建 ReplicaSet 或者删除已有的 Deployment 并创建一个新的来 替换。</p> <p>DaemonSet 控制器用于在集群中的全部（或者某些）节点上同时运行一 个指定的 Pod 资源副本，后续新加入集群的工作节点也会自动创建一个相同 的 Pod 对象，当从集群移除节点时，此类 Pod 对象也将被自动回收而无需重 建。删除 DaemonSet 将会删除它创建的所有 Pod。管理员也可以使用 nodeSelector(节点选择器)及节点 label(标签)指定仅在部分具有特定特 征的节点上运行指定的 Pod 对象。</p> <h3 id="stateless"><a href="#stateless" class="header-anchor">#</a> Stateless</h3> <p>这点 Deployment 控制器和 DaemonSet 控制器是一样的</p> <p>所有 pod 只需要共享一个持久存储，并不需要每个 pod 一个持久存储，并且多个 pod 对于同一个请求响应的结果是完全一致的。</p> <h3 id="基于-replicaset"><a href="#基于-replicaset" class="header-anchor">#</a> 基于 ReplicaSet</h3> <p>Deployment 是基于 ReplicaSet， DaemonSet 不是</p> <h3 id="使用-selector"><a href="#使用-selector" class="header-anchor">#</a> 使用 selector</h3> <p>二者都使用 selector</p> <h3 id="业务场景"><a href="#业务场景" class="header-anchor">#</a> 业务场景</h3> <p><strong>Deployment</strong></p> <p>通用型多副本无状态应用程序，副本保持、动态伸缩、自动重 新部署、版本回滚</p> <p><strong>DaemonSet</strong></p> <ul><li>在每个节点上运行集群存储 DaemonSet，例如 glusterd、ceph。</li> <li>在每个节点上运行日志收集 DaemonSet，例如 fluentd、logstash。</li> <li>在每个节点上运行监控 DaemonSet，例如 Prometheus Node Exporter、 zabbix agent 等。</li></ul> <h3 id="自动触发更新部署"><a href="#自动触发更新部署" class="header-anchor">#</a> 自动触发更新部署</h3> <p><strong>Deployment</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>kubectl apply <span class="token parameter variable">-f</span>
kubectl replace <span class="token parameter variable">-f</span>
kubectl edit deployments
