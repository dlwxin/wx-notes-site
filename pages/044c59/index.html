"0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://tldp.org/LDP/abs/html/here-docs.html" target="_blank" rel="noopener noreferrer">Chapter 19. Here Documents(heredoc)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="获取脚本当前路径"><a href="#获取脚本当前路径" class="header-anchor">#</a> 获取脚本当前路径</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># The path to execute the $0 (where the script is executed)</span>
<span class="token assign-left variable">CURR_DIR</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">pwd</span><span class="token variable">)</span></span>
<span class="token assign-left variable">CURR_DIR</span><span class="token operator">=</span><span class="token variable"><span class="token variable">`</span><span class="token builtin class-name">pwd</span><span class="token variable">`</span></span>

<span class="token comment"># The path where the script $0 is located</span>
<span class="token assign-left variable">SCRIPT_DIR</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">cd</span> <span class="token punctuation">$(</span>dirname $0<span class="token punctuation">)</span><span class="token punctuation">;</span> <span class="token builtin class-name">pwd</span><span class="token variable">)</span></span>
<span class="token assign-left variable">SCRIPT_DIR</span><span class="token operator">=</span><span class="token string">&quot;$(cd &quot;<span class="token variable"><span class="token variable">$(</span><span class="token function">dirname</span> <span class="token string">&quot;<span class="token variable">${<span class="token environment constant">BASH_SOURCE</span><span class="token punctuation">[</span>0<span class="token punctuation">]</span>}</span>&quot;</span><span class="token variable">)</span></span>&quot;</span> <span class="token operator">&amp;&amp;</span> <span class="token builtin class-name">pwd</span><span class="token punctuation">)</span><span class="token string">&quot;

# realpath 命令用于获取 realpath，也就是去除所有 . 和 .. 后的绝对路径
# dirname 命令用于获取目录的路径，即脚本所在的路径。
SCRIPT_DIR=$(dirname &quot;<span class="token variable"><span class="token variable">$(</span>realpath <span class="token string">&quot;<span class="token variable">$0</span>&quot;</span><span class="token variable">)</span></span>&quot;</span><span class="token punctuation">)</span>

<span class="token builtin class-name">echo</span> <span class="token string">&quot;Script is located at: <span class="token variable">$SCRIPT_DIR</span>&quot;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br></div></div><h2 id="lowercase-and-uppercase"><a href="#lowercase-and-uppercase" class="header-anchor">#</a> Lowercase and Uppercase</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token assign-left variable">app</span><span class="token operator">=</span>myall-test.zip
<span class="token assign-left variable">environment</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">echo</span> $app <span class="token operator">|</span> <span class="token function">awk</span> <span class="token parameter variable">-F</span> <span class="token string">'-'</span> <span class="token string">'{print $NF}'</span> <span class="token operator">|</span> <span class="token function">awk</span> <span class="token parameter variable">-F</span> <span class="token string">'.'</span> <span class="token string">'{print toupper($1)}'</span><span class="token variable">)</span></span>
<span class="token builtin class-name">echo</span> <span class="token variable">$environment</span> <span class="token comment"># TEST</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token assign-left variable">string</span><span class="token operator">=</span><span class="token string">&quot;hello, world&quot;</span>
<span class="token assign-left variable">uppercase</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$string</span>&quot;</span> <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{print toupper($0)}'</span><span class="token variable">)</span></span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$uppercase</span>&quot;</span> <span class="token comment"># HELLO, WORLD</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token assign-left variable">string</span><span class="token operator">=</span><span class="token string">&quot;hello, world&quot;</span>
<span class="token assign-left variable">uppercase</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$string</span>&quot;</span> <span class="token operator">|</span> <span class="token function">tr</span> <span class="token string">'[:lower:]'</span> <span class="token string">'[:upper:]'</span><span class="token variable">)</span></span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$uppercase</span>&quot;</span> <span class="token comment"># HELLO, WORLD</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># doesn't work in `sh` and `zsh`</span>
<span class="token assign-left variable">string</span><span class="token operator">=</span><span class="token string">&quot;hello, world&quot;</span>
<span class="token assign-left variable">uppercase</span><span class="token operator">=</span><span class="token variable">${string<span class="token operator">^^</span>}</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$uppercase</span>&quot;</span> <span class="token comment"># HELLO, WORLD</span>

<span class="token assign-left variable">str</span><span class="token operator">=</span><span class="token string">&quot;LOCAL&quot;</span>
<span class="token assign-left variable">lowercase</span><span class="token operator">=</span><span class="token variable">${str<span class="token operator">,,</span>}</span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$lowercase</span>&quot;</span> <span class="token comment"># local</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token assign-left variable">string</span><span class="token operator">=</span><span class="token string">&quot;hello, world&quot;</span>
<span class="token comment"># 使用 sed 命令来替换字符串中的整个行，并通过 \U 将其转换为大写形式。&amp; 表示匹配的整个行</span>
<span class="token assign-left variable">uppercase</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$string</span>&quot;</span> <span class="token operator">|</span> <span class="token function">sed</span> <span class="token string">'s/.*/\U&amp;/'</span><span class="token variable">)</span></span>
<span class="token builtin class-name">echo</span> <span class="token string">&quot;<span class="token variable">$uppercase</span>&quot;</span> <span class="token comment"># HELLO, WORLD</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h2 id="比较时间"><a href="#比较时间" class="header-anchor">#</a> 比较时间</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token assign-left variable">time1</span><span class="token operator">=</span><span class="token number">2021</span>-12-20T08:08:10.000Z
<span class="token assign-left variable">time2</span><span class="token operator">=</span><span class="token number">2021</span>-12-20T08:07:10.000Z
<span class="token assign-left variable">period</span><span class="token operator">=</span><span class="token variable"><span class="token variable">$((</span>$<span class="token punctuation">(</span>date <span class="token operator">+</span><span class="token operator">%</span>s <span class="token operator">-</span>d $time1<span class="token punctuation">)</span> <span class="token operator">-</span> $<span class="token punctuation">(</span>date <span class="token operator">+</span><span class="token operator">%</span>s <span class="token operator">-</span>d $time2<span class="token variable">))</span></span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token builtin class-name">echo</span> <span class="token variable">$period</span>
<span class="token number">60</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="在-macos-中"><a href="#在-macos-中" class="header-anchor">#</a> 在 MacOS 中</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">date</span>

<span class="token comment"># Because MacOS is based on BSD, not linux</span>
<span class="token comment">#Display the date of yesterday.</span>
<span class="token function">date</span> <span class="token parameter variable">-v</span> <span class="token parameter variable">-1d</span>
<span class="token function">date</span> -v-1d
<span class="token comment">#Tue May 10 12:34:56 CST 2023</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><h3 id="在-aix-机器上比较时间"><a href="#在-aix-机器上比较时间" class="header-anchor">#</a> 在 AIX 机器上比较时间</h3> <ul><li><a href="https://unix.stackexchange.com/questions/538886/convert-string-to-date-in-aix-and-get-difference-between-date-time" target="_blank" rel="noopener noreferrer">Convert string to date in AIX and get difference between date time<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://serverfault.com/questions/790941/timestamp-comparison-on-aix-without-date-d" target="_blank" rel="noopener noreferrer">Timestamp comparison on AIX without date -d<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.unix.com/unix-for-dummies-questions-and-answers/114084-comparing-two-dates.html" target="_blank" rel="noopener noreferrer">comparing two dates.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token shebang important">#!/bin/ksh93</span>

<span class="token comment"># date1=&quot;01/10/2009&quot;</span>
<span class="token comment"># date2=&quot;06/10/2009&quot;</span>

<span class="token builtin class-name">export</span> <span class="token assign-left variable">SSL_CERT_FILE</span><span class="token operator">=~</span>/app.pem
<span class="token comment"># 用于Node.js应用程序</span>
<span class="token comment"># NODE_EXTRA_CA_CERTS 环境变量仅在 Node.js 进程第一次启动时读取。 在运行时使用 process.env.NODE_EXTRA_CA_CERTS 更改值对当前进程没有影响。</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">NODE_EXTRA_CA_CERTS</span><span class="token operator">=~</span>/app.pem
<span class="token comment"># 用于Python的requests库</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">REQUESTS_CA_BUNDLE</span><span class="token operator">=~</span>/app.pem
<span class="token comment"># 不太常见，但有些应用程序可能使用这个变量</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">CERT_FILE</span><span class="token operator">=~</span>/app.pem
