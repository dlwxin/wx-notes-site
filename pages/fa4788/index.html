n/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-08-10</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Linux common question<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="can-not-login-after-change-limits-conf"><a href="#can-not-login-after-change-limits-conf" class="header-anchor">#</a> Can not login after change limits.conf</h2> <ul><li><a href="https://serverfault.com/questions/836929/can-not-login-after-change-limits-conf" target="_blank" rel="noopener noreferrer">Can not login after change limits.conf<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="start-linux-with-emergency-mode"><a href="#start-linux-with-emergency-mode" class="header-anchor">#</a> Start linux with emergency mode</h3> <p>First restart the server, After BIOS load when the GRUB menu shows up, press the 'e' key for edit:</p> <p>Move on that line which starts with 'linux16', press 'ctrl+e' to go end of the line, then add <code>systemd.unit=emergency.target</code> parameter to this line.</p> <p>Press 'ctrl+x' to boot the server with added parameter. After login to sever, all files are in read only mode, so to remount the filesystem as read-write,
remount root (<code>/</code>) or target directory <code>/etc/security/</code> with read and write permissions.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">mount</span> <span class="token parameter variable">-o</span> remount,rw /
<span class="token function">mount</span> <span class="token parameter variable">-o</span> remount,rw /proc
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>Finally open config file: <code>/etc/security/limits.conf</code> and edit config and restart the server.</p> <p>Now you can ssh into your server.</p> <h2 id="how-do-i-increase-size-of-per-user-tmpfs-partition-run-user-id"><a href="#how-do-i-increase-size-of-per-user-tmpfs-partition-run-user-id" class="header-anchor">#</a> How do I increase size of per-user tmpfs partition /run/user/$(id)?</h2> <ul><li><a href="https://askubuntu.com/questions/855740/how-do-i-increase-size-of-per-user-tmpfs-partition-run-user-id" target="_blank" rel="noopener noreferrer">How do I increase size of per-user tmpfs partition /run/user/$(id)?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://wiki.archlinux.org/title/Profile-sync-daemon#I_need_more_memory_to_accommodate_my_profile.2Fprofiles_in_.2Frun.2Fuser.2Fxxxx._How_can_I_allocate_more.3F" target="_blank" rel="noopener noreferrer">I need more memory to accommodate my profile/profiles in /run/user/xxxx. How can I allocate more?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>The standard way of controlling the size of /run/user is the <strong>RuntimeDirectorySize</strong> directive in <strong>/etc/systemd/logind.conf</strong> (see the man page for logind.conf for more). By default, 10% of physical memory is used but one can increase it safely. Remember that tmpfs only consumes what is actually used; the number specified here is just a maximum allowed.</p></blockquote> <p>For Example:</p> <ol><li><p><code>sudo vi /etc/systemd/logind.conf</code> to update the value of <code>RuntimeDirectorySize</code></p></li> <li><p>Check result:</p></li></ol> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">grep</span> RuntimeDirectorySize /etc/systemd/logind.conf
<span class="token assign-left variable">RuntimeDirectorySize</span><span class="token operator">=</span>2G
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><ol start="3"><li>Reboot your machine</li></ol> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">shutdown</span> <span class="token parameter variable">-r</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="ssh-add-error-permissions-are-too-open"><a href="#ssh-add-error-permissions-are-too-open" class="header-anchor">#</a> ssh-add error: &quot;Permissions are too open&quot;</h2> <div id="permissions_are_too_open"></div> <ul><li><a href="https://stackoverflow.nilmap.com/question?dest_url=https://stackoverflow.com/questions/19972441/ssh-add-error-permissions-are-too-open" target="_blank" rel="noopener noreferrer">ssh-add error: &quot;Permissions are too open&quot;<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Your <code>.ssh</code> directory should have permissions <code>0700</code>. Not <code>0600</code> (too strict) or <code>0755</code> (too permissive). Do:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">chmod</span> <span class="token parameter variable">-R</span> <span class="token number">700</span> ~/.ssh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>Use <code>-R</code> to recursively change permissions for all files in there.</p> <h2 id="ssh-config-file"><a href="#ssh-config-file" class="header-anchor">#</a> SSH Config File</h2> <ul><li><a href="https://linuxize.com/post/using-the-ssh-config-file/" target="_blank" rel="noopener noreferrer">Using the SSH Config File<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="ssh-config-file-location"><a href="#ssh-config-file-location" class="header-anchor">#</a> SSH Config File Location</h3> <p>OpenSSH client-side configuration file is named <code>config</code>, and it is stored in the <code>.ssh</code> directory under the user’s home directory.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">touch</span> ~/.ssh/config
<span class="token comment"># This file must be readable and writable only by the user and not accessible by others</span>
<span class="token function">chmod</span> <span class="token number">600</span> ~/.ssh/config
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h3 id="ssh-config-file-structure-and-patterns"><a href="#ssh-config-file-structure-and-patterns" class="header-anchor">#</a> SSH Config File Structure and Patterns</h3> <div class="language- line-numbers-mode"><pre class="language-text"><code>Host hostname1
    SSH_OPTION value
    SSH_OPTION value

Host hostname2
    SSH_OPTION value

Host *
    SSH_OPTION value
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><h3 id="example"><a href="#example" class="header-anchor">#</a> Example</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">ls</span> ~/.ssh/config
Host dev
    HostName dev.example.com
    User john
    Port <span class="token number">2322</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>Now when you type <code>ssh dev</code>, the ssh client will read the configuration file and use the connection details that are specified for the <code>dev</code> host:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">ssh</span> dev
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="how-to-increase-ssh-connection-timeout-in-linux"><a href="#how-to-increase-ssh-connection-timeout-in-linux" class="header-anchor">#</a> How to Increase SSH Connection Timeout in Linux</h2> <ul><li><a href="https://fsou.cc/search?q=ssh+session+timeout" target="_blank" rel="noopener noreferrer">【玩转腾讯云】SSH 到云服务器的连接又超时断开了<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.tecmint.com/increase-ssh-connection-timeout/" target="_blank" rel="noopener noreferrer">How to Increase SSH Connection Timeout in Linux<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.cnblogs.com/CooCoChoco/p/14351485.html" target="_blank" rel="noopener noreferrer">阿里云服务器通过 SSH 连接 自动断开连接的解决方案<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token function">grep</span> ClientAliveInterval /etc/ssh/sshd_config
<span class="token comment">#ClientAliveInterval 0</span>
<span class="token function">sudo</span> <span class="token function">grep</span> ClientAliveCountMax /etc/ssh/sshd_config
<span class="token comment">#ClientAliveCountMax 3</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token function">vi</span> /etc/ssh/sshd_config
<span class="token comment"># update thoes attrs as below</span>
ClientAliveInterval <span class="token number">60</span>
ClientAliveCountMax <span class="token number">3</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token function">service</span> sshd restart
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><blockquote><p>Maybe need to re-connect currect session.</p></blockquote> <h2 id="how-do-i-add-a-user-to-the-sudo-group"><a href="#how-do-i-add-a-user-to-the-sudo-group" class="header-anchor">#</a> How do I add a user to the sudo group?</h2> <ul><li><a href="https://askubuntu.com/questions/2214/how-do-i-add-a-user-to-the-sudo-group" target="_blank" rel="noopener noreferrer">How do I add a user to the &quot;sudo&quot; group?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="how-to-run-sudo-commands-without-password"><a href="#how-to-run-sudo-commands-without-password" class="header-anchor">#</a> How to Run sudo Commands Without Password</h2> <ul><li><a href="https://linuxhandbook.com/sudo-without-password/" target="_blank" rel="noopener noreferrer">How to Run sudo Commands Without Password<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="checking-the-status-of-networkmanager-on-redhat"><a href="#checking-the-status-of-networkmanager-on-redhat" class="header-anchor">#</a> Checking the Status of NetworkManager on RedHat</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ systemctl status NetworkManager
NetworkManager.service - Network Manager
   Loaded: loaded <span class="token punctuation">(</span>/lib/systemd/system/NetworkManager.service<span class="token punctuation">;</span> enabled<span class="token punctuation">)</span>
   Active: active <span class="token punctuation">(</span>running<span class="token punctuation">)</span> since Fri, 08 Mar <span class="token number">2013</span> <span class="token number">12</span>:50:04 +0100<span class="token punctuation">;</span> <span class="token number">3</span> days ago
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h2 id="http-proxy-vs-http-proxy"><a href="#http-proxy-vs-http-proxy" class="header-anchor">#</a> HTTP_PROXY VS http_proxy</h2> <ul><li><a href="https://unix.stackexchange.com/questions/212894/whats-the-right-format-for-the-http-proxy-environment-variable-caps-or-no-ca" target="_blank" rel="noopener noreferrer">What's the 'right' format for the HTTP_PROXY environment variable? Caps or no caps?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>There is no central authority who assigns an official meaning to environment variables before applications can use them. POSIX defines the meaning of some variables (PATH, TERM, …) and lists several more in a non-normative way as being in common use, all of them in uppercase. http_proxy and friends isn't one of them.</p> <p>Unlike basically all conventional environment variables used by many applications, http_proxy, https_proxy, ftp_proxy and no_proxy are commonly lowercase.</p></blockquote> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">man</span> <span class="token function">curl</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-i</span> <span class="token parameter variable">-A15</span> <span class="token parameter variable">-B1</span> http_proxy
ENVIRONMENT
       The environment variables can be specified <span class="token keyword">in</span> lower <span class="token keyword">case</span> or upper case. The lower <span class="token keyword">case</span> version has precedence. http_proxy is an exception as it is only available <span class="token keyword">in</span> lower case.

       Using an environment variable to <span class="token builtin class-name">set</span> the proxy has the same effect as using the -x, <span class="token parameter variable">--proxy</span> option.

       http_proxy <span class="token punctuation">[</span>protocol://<span class="token punctuation">]</span><span class="token operator">&lt;</span>host<span class="token operator">&gt;</span><span class="token punctuation">[</span>:port<span class="token punctuation">]</span>
              Sets the proxy server to use <span class="token keyword">for</span> HTTP.

       HTTPS_PROXY <span class="token punctuation">[</span>protocol://<span class="token punctuation">]</span><span class="token operator">&lt;</span>host<span class="token operator">&gt;</span><span class="token punctuation">[</span>:port<span class="token punctuation">]</span>
              Sets the proxy server to use <span class="token keyword">for</span> HTTPS.

       <span class="token punctuation">[</span>url-protocol<span class="token punctuation">]</span>_PROXY <span class="token punctuation">[</span>protocol://<span class="token punctuation">]</span><span class="token operator">&lt;</span>host<span class="token operator">&gt;</span><span class="token punctuation">[</span>:port<span class="token punctuation">]</span>
              Sets the proxy server to use <span class="token keyword">for</span> <span class="token punctuation">[</span>url-protocol<span class="token punctuation">]</span>, where the protocol is a protocol that <span class="token function">curl</span> supports and as specified <span class="token keyword">in</span> a URL. FTP, FTPS, POP3, IMAP, SMTP, LDAP etc.

       ALL_PROXY <span class="token punctuation">[</span>protocol://<span class="token punctuation">]</span><span class="token operator">&lt;</span>host<span class="token operator">&gt;</span><span class="token punctuation">[</span>:port<span class="token punctuation">]</span>
              Sets the proxy server to use <span class="token keyword">if</span> no protocol-specific proxy is set.

       NO_PROXY <span class="token operator">&lt;</span>comma-separated list of hosts/domains<span class="token operator">&gt;</span>
              list of <span class="token function">host</span> names that shouldn<span class="token string">'t go through any proxy. If set to an asterisk '</span>*' only, it matches all hosts. Each name <span class="token keyword">in</span> this list is matched as either a domain name  <span class="token function">which</span>  contains  the
              hostname, or the <span class="token function">hostname</span> itself.
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">man</span> <span class="token function">wget</span> <span class="token operator">|</span> <span class="token function">grep</span> <span class="token parameter variable">-i</span> <span class="token parameter variable">-A5</span> <span class="token parameter variable">-B3</span>  http_proxy
ENVIRONMENT
       Wget supports proxies <span class="token keyword">for</span> both HTTP and FTP retrievals.  The standard way to specify proxy location, <span class="token function">which</span> Wget recognizes, is using the following environment variables:

       http_proxy
       https_proxy
           If set, the http_proxy and https_proxy variables should contain the URLs of the proxies <span class="token keyword">for</span> HTTP and HTTPS connections respectively.

       ftp_proxy
           This variable should contain the URL of the proxy <span class="token keyword">for</span> FTP connections.  It is quite common that http_proxy and ftp_proxy are <span class="token builtin class-name">set</span> to the same URL.

       no_proxy
           This variable should contain a comma-separated list of domain extensions proxy should not be used for.  For instance, <span class="token keyword">if</span> the value of no_proxy is .mit.edu, proxy will not be used to retrieve
           documents from MIT.
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br></div></div><h2 id="linux-etc-fstab-file"><a href="#linux-etc-fstab-file" class="header-anchor">#</a> Linux <code>/etc/fstab</code> file</h2> <ul><li><a href="https://zhuanlan.zhihu.com/p/250658106" target="_blank" rel="noopener noreferrer">【纯干货】linux 之 fstab 文件详解<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>在 Linux 系统中，<code>/etc/fstab</code> 文件是一个重要的配置文件，用于定义系统启动时要挂载的文件系统。</p> <p>当系统启动的时候，系统会自动地从这个文件读取信息，并且会自动将此文件中指定的文件系统挂载到指定的目录。下面我来介绍如何在此文件下填写信息</p> <p>可以使用文本编辑器（如 vi、nano 等）打开这个文件进行编辑。请注意，对于修改<code>/etc/fstab</code>文件这样关键的配置文件，应该小心操作，确保在进行任何更改之前备份原始文件。</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code> <span class="token function">cat</span> /etc/fstab
<span class="token comment"># /etc/fstab: static file system information.</span>
<span class="token comment">#</span>
<span class="token comment"># Use 'blkid' to print the universally unique identifier for a</span>
<span class="token comment"># device; this may be used with UUID= as a more robust way to name devices</span>
<span class="token comment"># that works even if disks are added and removed. See fstab(5).</span>
<span class="token comment">#</span>
<span class="token comment"># &lt;设备名称(要挂载的分区或存储设备)&gt;    &lt;挂载点&gt;        &lt;文件系统类型&gt;    &lt;挂载选项&gt;    &lt;备份选项&gt;    &lt;文件系统检查顺序&gt;</span>
<span class="token comment"># &lt;file system&gt;                      &lt;mount point&gt;   &lt;type&gt;           &lt;options&gt;    &lt;dump&gt;       &lt;pass&gt;</span>
<span class="token comment"># / was on /dev/vda1 during installation</span>
<span class="token assign-left variable">UUID</span><span class="token operator">=</span>3d5af7aa-dd5c-4ed3-b38a-e74236d4d773 /               ext4    <span class="token assign-left variable">errors</span><span class="token operator">=</span>remount-ro <span class="token number">0</span>       <span class="token number">1</span>
/dev/fd0        /media/floppy0  auto    rw,user,noauto,exec,utf8 <span class="token number">0</span>       <span class="token number">0</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><h2 id="you-dcfn35c8st1b-are-not-allowed-to-use-this-program-crontab"><a href="#you-dcfn35c8st1b-are-not-allowed-to-use-this-program-crontab" class="header-anchor">#</a> You (dcfn35c8st1b) are not allowed to use this program (crontab)</h2> <p>这个错误表明当前用户没有权限使用 crontab 命令。</p> <h3 id="检查-cron-访问控制文件"><a href="#检查-cron-访问控制文件" class="header-anchor">#</a> 检查 cron 访问控制文件</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># 如果这个文件存在，只有文件中列出的用户才能使用 crontab</span>
<span class="token function">ls</span> <span class="token parameter variable">-la</span> /etc/cron.allow

<span class="token comment"># 如果这个文件存在，文件中列出的用户将被禁止使用 crontab。</span>
<span class="token function">ls</span> <span class="token parameter variable">-la</span> /etc/cron.deny
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="解决方案"><a href="#解决方案" class="header-anchor">#</a> 解决方案</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">sudo</span> <span class="token builtin class-name">echo</span> <span class="token string">&quot;your_username&quot;</span> <span class="token operator">&gt;&gt;</span> /etc/cron.allow
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>注意，应该确保该用户设置过密码</p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Linux" title="标签">#Linux</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">7/10/2025, 4:48:36 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/1b05e3/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Linux Run SCP SSH Without Password</div></a> <a href="/pages/68f2bf/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Shell</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
