ction class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Container</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>DevOps</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>WebServer</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GPT</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Cloud</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#OperatingSystem" data-v-057748f7>OperatingSystem</a></li><li data-v-057748f7><a href="/more/#Linux" data-v-057748f7>Linux</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-02-17</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Shell Command awk<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="awk-overview"><a href="#awk-overview" class="header-anchor">#</a> awk overview</h2> <p><strong>1. awk 命令的基本格式</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># awk '条件1 {动作 1} 条件 2 {动作 2} …' 文件名</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>2. 选项</strong></p> <ul><li>-F 指定分隔符</li> <li>-f 调用脚本</li> <li>-v 定义变量</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">git</span> <span class="token function">diff</span> HEAD --name-only
DemoAll/pom.xml
t - Copy/u/kk
test02.js
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">git</span> <span class="token function">diff</span> HEAD --name-only <span class="token operator">|</span> <span class="token function">awk</span> <span class="token parameter variable">-F</span> <span class="token string">&quot;/&quot;</span> <span class="token string">'{print $NF}'</span>
pom.xml
kk
test02.js

<span class="token comment"># git diff HEAD -&gt; 显示工作区与当前分支最新commit之间的差异</span>
<span class="token comment"># --name-only   -&gt; 只显示有变化的文件名（包括路径），不显示具体的内容</span>
<span class="token comment"># awk -F &quot;/&quot; '{print $NF}' -&gt; 用 &quot;/&quot; 作为分隔符， 提取最后一列</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p><strong>3. 常用 awk 内置变量</strong></p> <table><thead><tr><th>变量名</th> <th>描述</th></tr></thead> <tbody><tr><td><code>$0</code></td> <td>当前记录(整条记录)</td></tr> <tr><td><code>$1-$n</code></td> <td>当前记录的第 n 个字段</td></tr> <tr><td><code>FS</code></td> <td>输入字段分隔符（等价于命令行 <code>-F</code>选项）默认是空格</td></tr> <tr><td><code>RS</code></td> <td>输入记录分割符， 默认是换行符</td></tr> <tr><td><code>NF</code></td> <td>当前记录中字段的个数，就是有多少列</td></tr> <tr><td><code>NR</code></td> <td>已经读出的记录数，就是行号，从 1 开始</td></tr> <tr><td><code>OFS</code></td> <td>输出字段分隔符，默认是空格</td></tr> <tr><td><code>ORS</code></td> <td>输出记录分隔符 ，默认是换行符</td></tr></tbody></table> <p><strong>4. 条件（Pattern）</strong></p> <p>一般使用关系表达式作为条件。</p> <p>awk 支持的主要条件类型</p> <table><thead><tr><th style="text-align:left;">条件类型</th> <th style="text-align:left;">条 件</th> <th style="text-align:left;">说 明</th></tr></thead> <tbody><tr><td style="text-align:left;">awk 保留字</td> <td style="text-align:left;">BEGIN</td> <td style="text-align:left;">在 awk 程序一开始，尚未读取任何数据之前执行。BEGIN 后的动作只在程序开始时执行一次</td></tr> <tr><td style="text-align:left;">awk 保留字</td> <td style="text-align:left;">END</td> <td style="text-align:left;">在 awk 程序处理完所有数据，即将结束时执行?END 后的动作只在程序结束时执行一次</td></tr> <tr><td style="text-align:left;">关系运算符</td> <td style="text-align:left;">&gt;</td> <td style="text-align:left;">大于</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">&lt;</td> <td style="text-align:left;">小于</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">&gt;=</td> <td style="text-align:left;">大于等于</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">&lt;=</td> <td style="text-align:left;">小于等于</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">==</td> <td style="text-align:left;">等于。用于判断两个值是否相等。如果是给变童赋值，则使用&quot;=”</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">!=</td> <td style="text-align:left;">不等于</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">A~B</td> <td style="text-align:left;">判断字符串 A 中是否包含能匹配 B 表达式的子字符串</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">A!~B</td> <td style="text-align:left;">判断字符串 A 中是否不包含能匹配 B 表达式的子字符串</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">正则表达式</td> <td style="text-align:left;">/正则/ 如果在“//”中可以写入字符，则也可以支持正则表达式</td></tr></tbody></table> <p><strong>5. 动作（Action）</strong></p> <ul><li>格式化输出</li> <li>流程控制语句</li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># awk '{printf $2 &quot;\t&quot; $6 &quot;\n&quot;}' student.txt</span>
<span class="token comment"># 输出第二列和第六列的内容</span>
Name Average
Liming <span class="token number">87.66</span>
Sc <span class="token number">85.66</span>
Gao <span class="token number">91.66</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>在这个例子中没有设定任何的条件类型，所以这个文件中的所有内容都符合条件，动作会无条件执行。动作是格式化输出 <code>printf</code>，<code>$2</code>和<code>$6</code>分别代表第二个字段和第六个字段，所以这条 <code>awk</code> 命令会列出 <code>student.txt</code> 文件的第二个字段和第六个字段。</p> <p>虽然都是截取列的命令，但是 <code>awk</code> 命令比 <code>cut</code> 命令智能多了，<code>cut</code> 命令是不能很好地识别空格作为分隔符的；而对于 <code>awk</code> 命令来说，只要分隔开，不管是空格还是制表符，都可以识别。</p> <h2 id="awk-的条件"><a href="#awk-的条件" class="header-anchor">#</a> awk 的条件</h2> <p><strong>1. BEGIN</strong></p> <p><code>BEGIN</code> 是 <code>awk</code> 的保留字，是一种特殊的条件类型。<code>BEGIN</code> 的执行时机是&quot;在 <code>awk</code> 程序一开始，尚未读取任何数据之前&quot;。一旦 <code>BEGIN</code> 后的动作执行一次，当 <code>awk</code> 开始从文件中读入数据时，<code>BEGIN</code> 的条件就不再成立，所以 <code>BEGIN</code> 定义的动作只能被执行一次。</p> <p>Example 1:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># awk 'BEGIN{printf &quot;This is a transcript\n&quot;}</span>
<span class="token punctuation">{</span>printf <span class="token variable">$2</span> <span class="token string">&quot;<span class="token entity" title="\t">\t</span>&quot;</span> <span class="token variable">$6</span> <span class="token string">&quot;<span class="token entity" title="\n">\n</span>&quot;</span><span class="token punctuation">}</span>' student.txt
<span class="token comment">#awk命令只要检测不到完整的单引号就不会执行，所以这条命令的换行不用加入&quot;\&quot;，就是一行命令</span>
<span class="token comment">#这里定义了两个动作</span>
<span class="token comment">#第一个动作使用BEGIN条件，所以会在读入文件数据前打印&quot;这是一张成绩单&quot;（只会执行一次）</span>
<span class="token comment">#第二个动作会打印文件的第二个字段和第六个字段</span>
This is a transcript
Name Average
Liming <span class="token number">87.66</span>
Sc <span class="token number">85.66</span>
Gao <span class="token number">91.66</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br></div></div><p>Example 2:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">awk</span> <span class="token string">'BEGIN {printf &quot;This is a list\n&quot;} {printf $1 &quot;\t&quot; $2 &quot;\n&quot;}'</span> book
This is a list
<span class="token number">101</span>     西游记
<span class="token number">102</span>     红楼梦
<span class="token number">103</span>     水浒传
<span class="token number">104</span>     三国演义
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p><strong>2. END</strong></p> <p><code>END</code> 也是 <code>awk</code> 的保留字，不过刚好和 <code>BEGIN</code> 相反。<code>END</code> 是在 <code>awk</code> 程序处理完所有数据，即将结束时执行的。<code>END</code> 后的动作只在程序结束时执行一次。</p> <p>Example 1:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># awk 'END{printf &quot;The End \n&quot;}</span>
<span class="token punctuation">{</span>printf <span class="token variable">$2</span> <span class="token string">&quot;<span class="token entity" title="\t">\t</span>&quot;</span> <span class="token variable">$6</span> <span class="token string">&quot;<span class="token entity" title="\n">\n</span>&quot;</span><span class="token punctuation">}</span>' student.txt
<span class="token comment">#输出结尾输入&quot;The End&quot;，这并不是文档本身的内容，而且只会执行一次</span>
Name Average
Liming <span class="token number">87.66</span>
Sc <span class="token number">85.66</span>
Gao <span class="token number">91.66</span>
The End
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p>Example 2:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>wx@DESKTOP-HREI907 MINGW64 /c/wx/linuxLearn/temp
$ <span class="token function">awk</span> <span class="token string">'END{printf &quot;the end \n&quot;}
&gt; {printf $1 &quot;\t&quot; $2 &quot;\n&quot;}'</span> <span class="token number">123</span>
<span class="token number">101</span>     西游记
<span class="token number">102</span>     红楼梦
<span class="token number">103</span>     水浒传
<span class="token number">104</span>     三国演义
the end
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><p><strong>3. 关系运算符</strong></p> <p>Example 1:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># cat student.txt | grep -v Name |awk'$6 &gt;= 87 {printf $2'\n&quot;}'</span>
<span class="token comment"># 使用cat输出文件内容，用grep取反包含&quot;Name&quot;的行</span>
<span class="token comment"># 判断第六个字段（平均成绩）大于等于87分的行，如果判断式成立，则打印第2列（学员名）</span>
Liming
Gao
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p>这条命令的执行过程是这样的：</p> <ul><li>如果有 BEGIN 条件，则先执行 BEGIN 定义的动作。</li> <li>如果没有 BEGIN 条件，则读入第一行，把第一行的数据依次赋予 $0、$1、$2 等变量。其中，$0 代表此行的整体数据，$1 代表第一个字段，$2 代表第二个字段。</li> <li>依据条件类型判断动作是否执行。如果条件符合，则执行动作；否则读入下一行激据。如果没有条件，则每行都执行动作。</li> <li>读入下一行数据，重复执行社步骤。</li></ul> <p>Example 2: 看 Sc 用户的平均成绩</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># awk'$2 -/Sc/ {printf $6 &quot;\n&quot;}' student.txt</span>
<span class="token comment"># 如果第二个字段中包含&quot;Sc&quot;字符，则打印第六个字段</span>
<span class="token number">85.66</span>

<span class="token comment"># 在 awk 中，只有使用&quot;//&quot;包含的字符串，awk 命令才会査找。也就是说，字符串必须用&quot;//&quot;包含，awk 命令才能正确识别。</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p><strong>4. 正则表达式</strong></p> <p>Example: 如果想让 awk 识别字符串，则必须使用&quot;//&quot;包含，</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># awk '/Liming/ {print}' student.txt</span>
<span class="token comment">#打印Liming的成绩</span>
<span class="token number">1</span> Liming <span class="token number">82</span> <span class="token number">95</span> <span class="token number">86</span> <span class="token number">87.66</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p><strong>5. awk 流程制</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>	<span class="token comment"># TODO</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="examples"><a href="#examples" class="header-anchor">#</a> Examples</h2> <p><strong>1. 如何用 awk 打印除第一列之外的所有列</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">less</span> test.txt <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{$1=&quot;&quot;;print}'</span>

<span class="token function">awk</span> <span class="token string">'sub($1,&quot;&quot;)'</span> test.txt

<span class="token comment"># awk '{for(i=2;i&lt;=NF;++i) printf $i &quot;\t&quot;;printf &quot;\n&quot;}' test.txt</span>
<span class="token function">awk</span> <span class="token string">'{for(i=2;i&lt;=NF;++i);print}'</span> test.txt

<span class="token comment"># 		if(i&lt;NF) {printf &quot;%s &quot;,$i} else {print $i}</span>
<span class="token comment"># 	}</span>
<span class="token comment"># }'  test.txt</span>
<span class="token function">awk</span> <span class="token string">'{for(i=2;i&lt;=NF;i++) { if(i&lt;NF) {printf &quot;%s &quot;,$i} else {print $i} } }'</span>  test.txt
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><p><strong>替换 k8s deployment.yml 的 image version</strong></p> <div class="language-yaml line-numbers-mode"><pre class="language-yaml"><code><span class="token comment"># deployment-simple-nginx-01.yaml</span>
<span class="token comment"># ...</span>
<span class="token key atrule">template</span><span class="token punctuation">:</span>
  <span class="token key atrule">metadata</span><span class="token punctuation">:</span>
    <span class="token key atrule">name</span><span class="token punctuation">:</span> deployment<span class="token punctuation">-</span>simple<span class="token punctuation">-</span>nginx<span class="token punctuation">-</span><span class="token number">01</span>
    <span class="token key atrule">labels</span><span class="token punctuation">:</span>
      <span class="token key atrule">app</span><span class="token punctuation">:</span> deployment<span class="token punctuation">-</span>simple<span class="token punctuation">-</span>nginx<span class="token punctuation">-</span><span class="token number">01</span>
  <span class="token key atrule">spec</span><span class="token punctuation">:</span>
    <span class="token key atrule">containers</span><span class="token punctuation">:</span>
      <span class="token punctuation">-</span> <span class="token key atrule">name</span><span class="token punctuation">:</span> nginx
        <span class="token key atrule">image</span><span class="token punctuation">:</span> quay.io/bitnami/nginx<span class="token punctuation">:</span>1.20.2
        <span class="token key atrule">imagePullPolicy</span><span class="token punctuation">:</span> IfNotPresent
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token builtin class-name">echo</span> <span class="token variable"><span class="token variable">$(</span><span class="token function">awk</span> <span class="token parameter variable">-F</span> <span class="token string">&quot;image:&quot;</span> <span class="token string">'{print $2}'</span> ./deployment-simple-nginx-01.yaml <span class="token operator">|</span> <span class="token function">awk</span> <span class="token string">'{split($0, arr, &quot;:&quot;); print arr[2]}'</span><span class="token variable">)</span></span>
