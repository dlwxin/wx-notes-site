e-in-conainer" class="sidebar-link">Run Oracle database in conainer</a></li></ul></li><li><a href="/pages/3a70c9/" class="sidebar-link">Podman Chore</a></li></ul></section></li><li><section class="sidebar-group collapsable is-sub-group depth-1"><p class="sidebar-heading"><span>Buildpacks</span> <span class="arrow right"></span></p> <!----></section></li></ul></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>DevOps</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>WebServer</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>GPT</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Cloud</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#Container" data-v-057748f7>Container</a></li><li data-v-057748f7><a href="/more/#Podman" data-v-057748f7>Podman</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-11-01</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Podman Example<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="example1"><a href="#example1" class="header-anchor">#</a> Example1</h2> <div class="language-shell line-numbers-mode"><div class="highlight-lines"><br><br><div class="highlighted"> </div><br><br><br><br><br></div><pre class="language-shell"><code><span class="token function">docker</span> run <span class="token punctuation">\</span>
    <span class="token parameter variable">--name</span> some-postgres <span class="token punctuation">\</span>
    --security-opt <span class="token assign-left variable">label</span><span class="token operator">=</span>disable <span class="token punctuation">\</span>
    <span class="token parameter variable">-e</span> <span class="token assign-left variable">POSTGRES_PASSWORD</span><span class="token operator">=</span>postgres <span class="token punctuation">\</span>
    <span class="token parameter variable">-v</span> /data/db_data/postgresql:/home/data/ <span class="token punctuation">\</span>
    <span class="token parameter variable">-p</span> <span class="token number">5432</span>:5432 <span class="token punctuation">\</span>
    <span class="token parameter variable">-d</span> postgres
</code></pre><div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><p>If no permission to mkdir in Container or mounted path. Can add option <code>--security-opt label=disable</code></p> <h2 id="example2"><a href="#example2" class="header-anchor">#</a> Example2</h2> <p>Create a shell script <code>start_postges.sh</code></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token shebang important">#!/bin/bash</span>
<span class="token function">podman</span> <span class="token function">rm</span> <span class="token parameter variable">-f</span> test_postgres
<span class="token function">podman</span> run <span class="token parameter variable">--name</span><span class="token operator">=</span>test_postgres <span class="token parameter variable">-d</span> <span class="token punctuation">\</span>
    <span class="token parameter variable">-p</span> <span class="token number">15432</span>:5432 <span class="token punctuation">\</span>
    <span class="token parameter variable">-u</span> <span class="token environment constant">$UID</span> <span class="token punctuation">\</span>
    <span class="token parameter variable">-e</span> <span class="token assign-left variable">PGDATA</span><span class="token operator">=</span>/var/lib/postgresql/data/pgdata <span class="token punctuation">\</span>
    <span class="token parameter variable">-e</span> <span class="token assign-left variable">POSTGRES_PASSWORD</span><span class="token operator">=</span>postgres <span class="token punctuation">\</span>
    <span class="token parameter variable">-v</span> <span class="token variable"><span class="token variable">$(</span><span class="token builtin class-name">pwd</span><span class="token variable">)</span></span>/test_data:/var/lib/postgresql/data <span class="token punctuation">\</span>
    --security-opt <span class="token assign-left variable">label</span><span class="token operator">=</span>disable <span class="token punctuation">\</span>
    docker.io/postgres
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><h2 id="build-a-postgres-image-including-pg-cron-plugin"><a href="#build-a-postgres-image-including-pg-cron-plugin" class="header-anchor">#</a> Build a postgres image including pg_cron plugin</h2> <ul><li><a href="https://github.com/citusdata/pg_cron" target="_blank" rel="noopener noreferrer">pg_cron<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p><strong>Step1</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">podman</span> run <span class="token punctuation">\</span>
    <span class="token parameter variable">--name</span> some-postgres <span class="token punctuation">\</span>
    <span class="token parameter variable">-e</span> <span class="token assign-left variable">POSTGRES_PASSWORD</span><span class="token operator">=</span>postgres <span class="token punctuation">\</span>
    <span class="token parameter variable">-p</span> <span class="token number">16432</span>:5432 <span class="token punctuation">\</span>
    <span class="token parameter variable">-d</span> postgres:12.7
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><p><strong>Step2</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">podman</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> some-postgres <span class="token function">apt-get</span> update
<span class="token comment"># Note: The version of pg_cron should be the same as the version of postgres</span>
<span class="token function">podman</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> some-postgres <span class="token function">apt-get</span> <span class="token parameter variable">-y</span> <span class="token function">install</span> postgresql-12-cron
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p><strong>Step3</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># now there is a image include pg_cron plugin, but it does not work now</span>
<span class="token comment"># https://github.com/citusdata/pg_cron</span>
<span class="token function">podman</span> commit some-postgres postgres-with-pgcron:12.7
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p><strong>Step4</strong></p> <div class="language-shell line-numbers-mode"><div class="highlight-lines"><br><br><br><br><br><div class="highlighted"> </div><br></div><pre class="language-shell"><code><span class="token function">podman</span> <span class="token function">rm</span> <span class="token parameter variable">-f</span> some-postgres
<span class="token function">podman</span> run <span class="token punctuation">\</span>
    <span class="token parameter variable">--name</span> some-postgres <span class="token punctuation">\</span>
    <span class="token parameter variable">-e</span> <span class="token assign-left variable">POSTGRES_PASSWORD</span><span class="token operator">=</span>postgres <span class="token punctuation">\</span>
    <span class="token parameter variable">-p</span> <span class="token number">16432</span>:5432 <span class="token punctuation">\</span>
    <span class="token parameter variable">-d</span> postgres-with-pgcron:12.7
</code></pre><div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p><strong>Optional: This step can replace the first 5 steps</strong></p> <div class="language-Dockerfile line-numbers-mode"><pre class="language-dockerfile"><code><span class="token instruction"><span class="token keyword">FROM</span> postgres:12.7</span>
<span class="token instruction"><span class="token keyword">RUN</span> apt-get update &amp;&amp; apt-get -y install postgresql-12-cron</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">docker</span> build <span class="token parameter variable">-t</span> postgres-with-pgcron:12.7 <span class="token builtin class-name">.</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>Step5</strong></p> <p>Init a shell script called <code>setup_pg_cron.sh</code></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># setup_pg_cron.sh</span>

<span class="token comment">#!/bin/bash</span>

<span class="token function">cat</span> <span class="token operator">&lt;&lt;</span><span class="token string">EOT<span class="token bash punctuation"> <span class="token operator">&gt;&gt;</span> <span class="token variable">${PGDATA}</span>/postgresql.conf</span>
shared_preload_libraries='pg_cron'
# cron.database_name='PRODUCT'
