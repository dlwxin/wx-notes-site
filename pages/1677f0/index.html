-> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Shell Input Output Redirection<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>在 Linux 中，所有的内容都是文件，计算机硬件也是文件，标准输入设备（键盘）和标准输出设备（显示器）也是文件
标准输入设备</p> <table><thead><tr><th style="text-align:left;">设 备</th> <th style="text-align:left;">设备文件名</th> <th style="text-align:left;">文件描述符</th> <th style="text-align:left;">类 型</th></tr></thead> <tbody><tr><td style="text-align:left;">键盘</td> <td style="text-align:left;">/dev/stdin</td> <td style="text-align:left;">0</td> <td style="text-align:left;">标准输入</td></tr> <tr><td style="text-align:left;">显示器</td> <td style="text-align:left;">/dev/stdout</td> <td style="text-align:left;">1</td> <td style="text-align:left;">标准输出</td></tr> <tr><td style="text-align:left;">显示器</td> <td style="text-align:left;">/dev/stderr</td> <td style="text-align:left;">2</td> <td style="text-align:left;">标准错误输出</td></tr></tbody></table> <p>Linux 是使用设备文件名来表示硬件的（比如 /dev/sda1 就代表第一块 SATA 硬盘的第一个主分区），但是键盘和显示器的设备文件名并不好记忆，我们用&quot;0&quot;、&quot;1&quot;、&quot;2&quot;来分别代表标准输入、标准输出和标准错误输出。</p> <p>输出重定向指的是改变输出方向，不再输出到屏幕上，而是输出到文件他设备中；输入重定向则是指不再使用键盘作为输入设备，而是把文件的内容作为命令的输入。</p> <ul><li>Bash 支持的输出重定向符号</li></ul> <table><thead><tr><th style="text-align:left;">类 型</th> <th style="text-align:left;">符 号</th> <th style="text-align:left;">作 用</th></tr></thead> <tbody><tr><td style="text-align:left;">标准输出重定向的文件或设备中出输出到指定</td> <td style="text-align:left;">命令 &gt; 文件</td> <td style="text-align:left;">以覆盖的方式，把命令的正确输</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">命令 &gt;&gt; 文件</td> <td style="text-align:left;">以追加的方式，把命令的正确输出输出到指定的文件或设备中</td></tr> <tr><td style="text-align:left;">标准错误输出重定向</td> <td style="text-align:left;">错误命令 2&gt; 文件</td> <td style="text-align:left;">以覆盖的方式，把命令的错误输出输出到指定的文件或设备中</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">错误命令 2&gt;&gt; 文件</td> <td style="text-align:left;">以追加的方式，把命令的错误输出输出到指定的文件或设备中</td></tr> <tr><td style="text-align:left;">正确输出和错误输出</td> <td style="text-align:left;">命令 &gt; 文件 2&gt;&amp;1</td> <td style="text-align:left;">以覆盖的方式，把正确输出和错误输出都保存到同一个文件中</td></tr> <tr><td style="text-align:left;">同时保存</td> <td style="text-align:left;">命令 &gt;&gt; 文件 2&gt;&amp;1</td> <td style="text-align:left;">以追加的方式，把正确输出和错误输出都保存到同一个文件中</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">命令&amp;&gt;文件</td> <td style="text-align:left;">以覆盖的方式，把正确输出和错误输出都保存到同一个文件中</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">命令&amp;&gt;&gt;文件</td> <td style="text-align:left;">以追加的方式，把正确输出和错误输出都保存到同一个文件中</td></tr> <tr><td style="text-align:left;"></td> <td style="text-align:left;">命令&gt;&gt;文件 1 2&gt;&gt;文件 2</td> <td style="text-align:left;">把正确的输出追加到文件 1 中，把错误的输出追加到文件 2 中</td></tr></tbody></table> <h2 id="输出重定向"><a href="#输出重定向" class="header-anchor">#</a> 输出重定向</h2> <h3 id="标准输出重定向"><a href="#标准输出重定向" class="header-anchor">#</a> 标准输出重定向</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host temp<span class="token punctuation">]</span>$ ll <span class="token operator">&gt;</span> abc

drwxr-xr-x. <span class="token number">2</span> wx <span class="token builtin class-name">test</span> <span class="token number">4096</span> Dec <span class="token number">27</span> <span class="token number">10</span>:47 mm
-r-xr-xr-x. <span class="token number">1</span> wx <span class="token builtin class-name">test</span> <span class="token number">1400</span> Dec <span class="token number">26</span> <span class="token number">16</span>:38 show
<span class="token comment"># 在abc文件中只有pwd命令的输出，而ll命令的被覆盖了</span>
<span class="token punctuation">[</span>test@host temp<span class="token punctuation">]</span>$ <span class="token builtin class-name">pwd</span> <span class="token operator">&gt;</span> abc
<span class="token punctuation">[</span>test@host temp<span class="token punctuation">]</span>$ <span class="token function">cat</span> abc

/home/wx/linuxLearn/temp
Thu Dec <span class="token number">27</span> <span class="token number">13</span>:53:49 CST <span class="token number">2018</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><h3 id="标准错误输出重定向"><a href="#标准错误输出重定向" class="header-anchor">#</a> 标准错误输出重定向</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host temp<span class="token punctuation">]</span>$ <span class="token function">touch</span> err.log
<span class="token punctuation">[</span>test@host temp<span class="token punctuation">]</span>$ ll <span class="token parameter variable">-test</span> <span class="token operator"><span class="token file-descriptor important">2</span>&gt;&gt;</span> err.log
<span class="token punctuation">[</span>test@host temp<span class="token punctuation">]</span>$ <span class="token function">cat</span> err.log
ls: invalid option -- <span class="token string">'e'</span>
Try <span class="token string">'ls --help'</span> <span class="token keyword">for</span> <span class="token function">more</span> information.
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><div class="custom-block warning"><p class="custom-block-title">注意</p> <p>ps: 2 代表错误输出，只有这样才能把命令的错误输出保存到指定的文件中。&quot;2&gt;&gt;&quot;一定不能有空格，否则会报错。</p></div> <h3 id="正确输出和错误输出同时保存"><a href="#正确输出和错误输出同时保存" class="header-anchor">#</a> 正确输出和错误输出同时保存</h3> <p>E.g 1:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token builtin class-name">pwd</span> <span class="token operator">&amp;&gt;&gt;</span> out.log
<span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">cat</span> out.log
/home/wx/linuxLearn/tmp
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>E.g 2:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">rm</span> tt.txt <span class="token operator">&gt;&gt;</span> out.log <span class="token operator"><span class="token file-descriptor important">2</span>&gt;</span><span class="token file-descriptor important">&amp;1</span>
<span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">cat</span> out.log
rm: cannot remove ‘tt.txt’: No such <span class="token function">file</span> or directory
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>E.g 3:</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ ll
total <span class="token number">0</span>
-rw-r--r--. <span class="token number">1</span> wx <span class="token builtin class-name">test</span> <span class="token number">0</span> Dec <span class="token number">27</span> <span class="token number">14</span>:29 err.log
-rw-r--r--. <span class="token number">1</span> wx <span class="token builtin class-name">test</span> <span class="token number">0</span> Dec <span class="token number">27</span> <span class="token number">14</span>:37 out.log
<span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token builtin class-name">pwd</span> <span class="token operator">&gt;&gt;</span> out.log <span class="token operator"><span class="token file-descriptor important">2</span>&gt;&gt;</span> err.log
<span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ ll <span class="token parameter variable">-show.sh</span> <span class="token operator">&gt;&gt;</span> out.log <span class="token operator"><span class="token file-descriptor important">2</span>&gt;&gt;</span> err.log
<span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">cat</span> out.log
/home/wx/linuxLearn/tmp
<span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">cat</span> err.log
ls: invalid line width: .sh
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br></div></div><p>如果不想把命令的输出保存下来，也不想把命令的执行结果输出到屏幕上，干扰命令的执行，就可以把命令的所有
执行结果放入 <code>/dev/null</code> 中。大家可以把 <code>/dev/null</code> 当成 Linux 系统的垃圾箱，任何放入垃圾箱的数据都会被丢弃，
但是不能被恢复。命令如下：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>root@localhost ~<span class="token punctuation">]</span><span class="token comment"># ls &amp;&gt;/dev/null</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="输入重定向"><a href="#输入重定向" class="header-anchor">#</a> 输入重定向</h2> <p>输入重定向是改变输入的方向，不再使用键盘作为命令的输入，而是使用文件作为命令的输入</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token punctuation">[</span>test@host tmp<span class="token punctuation">]</span>$ <span class="token function">wc</span> <span class="token operator">&lt;&lt;</span> out.log
<span class="token operator">&gt;</span> Hello World
<span class="token operator">&gt;</span> Today is Thursday
<span class="token operator">&gt;</span> out.log
<span class="token number">2</span>  <span class="token number">5</span> <span class="token number">30</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><div class="custom-block tip"><p class="custom-block-title">提示</p> <p>&quot;&lt;&lt;&quot;之后的关键字可以自由定义，只要再碰到相同的关键字，两个关键字之间的内容将作为命令的输入（不包括关键字本身）。</p></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Shell" title="标签">#Shell</a><a href="/tags/?tag=Shell%20Redirection" title="标签">#Shell Redirection</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">12/10/2022, 6:13:34 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/ac2689/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Shell Command grep</div></a> <a href="/pages/6e998d/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Shell string interception</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
