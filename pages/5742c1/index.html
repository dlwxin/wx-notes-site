1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>亲您好洗衣机的 E3A 故障代码指的是脱水不平衡。处理方法：1、检查水龙头是否打开，是否停水 。建议打开水龙头，开关上盖一次。2、检查进水阀是否堵塞 ，建议清理进水阀，开关上盖一次。3、检查水压是否</p></blockquote> <blockquote><p>美的洗衣机出现 E3 可能有以下几种原因：<strong>1、美的滚筒洗衣机故障代码 E3 表示洗衣机启动后，电脑板尝试关门失败，此类故障只需重新关闭洗衣机仓门，直至确认完全关闭即可。</strong> 2、洗衣机的门没关好，可能是衣服卡在门里了，或者是门关不严了，电子锁锁不上了。3、有可能是电路板烧坏了。4、也许是电机坏了，换一个试试。5、有可能是洗衣服时，硬币，纸堵了排水管或排水电磁阀，导致无法排水或排水慢，清理一下。</p></blockquote> <h2 id="大连医保-个人医保缴费证明打印方法-download-medical-insurance-payment-voucher"><a href="#大连医保-个人医保缴费证明打印方法-download-medical-insurance-payment-voucher" class="header-anchor">#</a> 大连医保：个人医保缴费证明打印方法(Download medical insurance payment voucher)</h2> <ul><li><a href="https://mp.weixin.qq.com/s?__biz=MzkzMjQwNTc5Nw==&amp;mid=2247485932&amp;idx=1&amp;sn=e51938d4092a2025b3d31ea9b79be011&amp;source=41#wechat_redirect" target="_blank" rel="noopener noreferrer">大连医保：个人医保缴费证明打印方法<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <ol><li>使用前，需先在<a href="https://www.lnzwfw.gov.cn" target="_blank" rel="noopener noreferrer">辽宁省政务网<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>上进行注册，注册路径：点击右上角的“注册”→ 填写登录帐号、密码 → 填写基本信息后，进行实名认证，认证完成后即可使用帐号、密码登录大连市医保局公众号。</li> <li>微信搜索或扫码关注“大连市医保局”微信公众号,点击“服务大厅”，使用帐号、密码登录后点击“我要查”→“权益证明打印”→“职工缴费信息打印”→ 选择起始、终止日期并搜索。</li> <li>搜索后，生成《职工基本医疗、生育保险缴费证明》图片，长按图片保存即可。</li></ol> <h2 id="社保"><a href="#社保" class="header-anchor">#</a> 社保</h2> <h3 id="社保-个人身份查询"><a href="#社保-个人身份查询" class="header-anchor">#</a> 社保 个人身份查询</h3> <p>支付宝 -&gt; 城市服务 -&gt; 社保参保查询 -&gt; 企业养老 -&gt; 在“信息查询”中可以可以看到“个人身份”</p> <h3 id="大连社保迁出到外省"><a href="#大连社保迁出到外省" class="header-anchor">#</a> 大连社保迁出到外省</h3> <p>高新园区社保局地址：高新园区行政服务大厅 2 号楼 1 层左侧， 早上 8:30 开始办理业务</p> <h3 id="养老保险转移业务须知-2023-07-18"><a href="#养老保险转移业务须知-2023-07-18" class="header-anchor">#</a> 养老保险转移业务须知(2023-07-18)</h3> <p><strong>基本养老保险转出程序</strong></p> <p>网上办理：</p> <ol><li>下载 App &quot;掌上 12333&quot;</li> <li>本人注册、登录，选择&quot;服务&quot;---社会保障---社保关系转移---社保转移申请，填写所需信息（高新园区职工请选择大连甘井子区）。</li></ol> <p>窗口办理：</p> <ol><li>本人身份证复印件一份</li> <li>如有代办请再提供代办人的身份证复印件一份</li></ol> <p><strong>基本养老保险转入程序</strong></p> <p>网上办理：</p> <ol><li>下载 App &quot;掌上 12333&quot;</li> <li>本人注册、登录，选择&quot;服务&quot;---社会保障---社保关系转移---社保转移申请，填写所需信息（高新园区职工请选择大连甘井子区）。</li></ol> <p>窗口办理：</p> <ol><li>本人身份证复印件一份</li> <li>原参保地名称或行政区划代码</li></ol> <h2 id="大连市联合收费"><a href="#大连市联合收费" class="header-anchor">#</a> 大连市联合收费</h2> <ul><li><a href="https://mp.weixin.qq.com/s/sScdtithmF_dnsPc4RbknA" target="_blank" rel="noopener noreferrer">公众号使用指南<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28. 关于部分派出所合井办公的通告<br>
为全面加强新时代公安派出所建设，进一步整合警务资源，提升基层警务服务效能，按照上级关于派出所标准化建设要求，经研究，决定对河口沿海派出所按照区域管辖分别与凌水&gt; 派出所、七贤岭派出所进行合并办公。现将有关事项通告如下：<br>
一、管辖区域调整<br>
原河口沿海派出所辖区的小平岛第一社区、圣岛亲海社区、瑞丰园社区、依海社区、桃峪园社区、枫峪园社区、观海社区、听海社区合并至凌水派出所管辖。<br>
原河口沿海派出所辖区的环海社区、环涛社区、黄浦社区、善水社区、辅贤社区合井至七贤岭派出所管辖。<br>
二、公安业务办理调整<br>
原河口沿海派出所辖区范围内的相关公安派出所业务，由整合后的凌水派出所、七贤岭派出所受理。<br>
三、整合办公时间<br>
2024 年 7 月 27 日零时起正式运行。<br>
四、合并办公后派出所办公地址及电话<br>
（一）凌水派出所办公地址：甘井子区凌南路 58 号。 电话：0411-84671510<br>
（二）七贤岭派出所办公地址：甘井子区任贤街 18 号。电话：0411-84978110<br>
感谢您一直以来对高新园区公安工作的理解和支持，请广大居民相互转告，因派出所合并工作给您带来的不便，敬请谅解！我们将以此为契机，进一步提高基层派出所管理服务水&gt; 平，全力提升广大人民群众的安全感和满意度。<br>
