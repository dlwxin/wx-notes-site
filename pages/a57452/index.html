n class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Go</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Framework</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>Database</span> <span class="arrow right"></span></p> <!----></section></li><li><section class="sidebar-group collapsable depth-0"><p class="sidebar-heading"><span>MessageMiddleware</span> <span class="arrow right"></span></p> <!----></section></li></ul> </aside> <div><main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/backend/#BE" data-v-057748f7>BE</a></li><li data-v-057748f7><a href="/backend/#java" data-v-057748f7>java</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-12-25</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Java Multithreading<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="basic-concept"><a href="#basic-concept" class="header-anchor">#</a> Basic Concept</h2> <h3 id="程序"><a href="#程序" class="header-anchor">#</a> 程序</h3> <p>程序（program）是为完成特定任务、用某种语言编写的一组指令的集合。即指一段静态的代码，静态对象。</p> <h3 id="进程"><a href="#进程" class="header-anchor">#</a> 进程</h3> <p>进程（process）是程序的一次执行过程，或是<strong>正在运行的一个程序</strong>。在操作系统中每一个独立执行的程序就称为一个进程。是一个动态的过程：有它自身的产生、存在和消亡的过程（生命周期）。</p> <ol><li>如 ∶ 运行中的 QQ，运行中的 MP3 播放器</li> <li>程序是静态的，进程是动态的</li> <li>进程作为资源分配的单位，系统在运行时会为每个进程分配不同的内存区域</li></ol> <h3 id="线程"><a href="#线程" class="header-anchor">#</a> 线程</h3> <p>线程（thread），操作系统能够进行运算调度的最小单位，是进程的执行单位。进程可进一步细化为线程，是一个程序内部的一条执行路径。</p> <h3 id="单线程和多线程"><a href="#单线程和多线程" class="header-anchor">#</a> 单线程和多线程</h3> <ol><li>单线程：在一段时间内程序只能有一条执行路径</li> <li>多线程：指一个运用程序中同一个时间段运行多个线程完成不同的工作，称为多线程</li></ol> <p>每一个运行的程序，都会创建一个进程,每一个进程都至少有一个线程，若程序只有一个线程，那就是程序本身</p> <ul><li>若一个进程同一时间并行执行多个线程，就是支持多线程的</li> <li>线程作为调度和执行的单位，每个线程拥有独立的运行栈和程序计数器（pc），线程切换的开销小</li> <li>一个进程中的多个线程共享相同的内存单元/内存地址空间，它们从同一堆中分配对象，可以访问相同的变量和对象。这就使得线程间通信更简便、高效。但多个线程操作共享的系统资源可能就会带来安全的隐患。</li></ul> <p>一个 Java 程序 java.exe 其实至少有三个线程：main() 主线程，gc()垃圾回收线程，异常处理线程。当然如果发生异常，会影响主线程。</p> <h3 id="cpu"><a href="#cpu" class="header-anchor">#</a> CPU</h3> <p>中央处理器（central processing unit，简称 CPU）作为计算机系统的运算和控制核心，是信息处理、程序运行的最终执行单元。</p> <h3 id="单核-cpu"><a href="#单核-cpu" class="header-anchor">#</a> 单核 CPU</h3> <p>单核就是 CPU 集成了一个运算核心，在工作期间只能执行某一个程序，处理多个程序时，只能分时处理。其实是一种假的多线程，因为在一个时间单位内，只能执行一个线程任务。</p> <p>现在推出的 CPU 基本没有单核 CPU 了。</p> <h3 id="多核-cpu"><a href="#多核-cpu" class="header-anchor">#</a> 多核 CPU</h3> <p>在一颗芯片里集成了多个 CPU 运算核心，相当于多个单核 CPU 同时工作。因此，多核处理器可以同时处理多个程序，而不用等上一个程序完成。</p> <h3 id="并行与并发"><a href="#并行与并发" class="header-anchor">#</a> 并行与并发</h3> <p>并行：多个 CPU 同时执行多个任务。比如：多个人同时做不同的事。<br>
并发：一个 CPU（采用时间片）同时执行多个任务。比如秒杀，多个人做同一件事。</p> <h2 id="线程的创建和启动"><a href="#线程的创建和启动" class="header-anchor">#</a> 线程的创建和启动</h2> <ol><li><p>继承 Thread 类<br>
a.覆盖 run()方法:run 中的代码会在多线程中执行。<br>
b.创建一个该类的实例。<br>
c.通过调用 start()方法来启动一个线程。</p></li> <li><p>实现 Runnable 接口<br>
a.强制覆盖 run()方法。<br>
b.需要创建一个 Thread 类的实例。<br>
c.通过 Thread 类的 start()方法来启动线程。</p></li> <li><p>实现 Callable 接口</p></li></ol> <h3 id="两种线程创建方式的比较"><a href="#两种线程创建方式的比较" class="header-anchor">#</a> 两种线程创建方式的比较</h3> <p>实现 Runnable 接口相对于继承 Thread 类，有以下好处</p> <ol><li>适合多个相同的程序代码去处理统一资源，把线程同程序代码、数据有效的分离，能很好地体现面向对象的特性</li> <li>可以避免 java 单继承的局限性</li></ol> <p>对 java 程序来说，只要有一个前台线程，进程就不会结束，如果进程中只有后台线程运行。这个线程就会结束。新创建的线程都是前台线程，如果某个线程对象在启动之前调用了 setDaemon(),这个线程就会变成后台线程</p> <p>调用 setDaemon()必须在调用 start()方法之前，否则会抛出 <code>IllegalThreadStateException</code> 异常</p> <h3 id="thread-类-的常用方法"><a href="#thread-类-的常用方法" class="header-anchor">#</a> Thread 类 的常用方法</h3> <ol><li>String getName() 返回该线程的名称</li> <li>static Thread currentThread() 返回对当前正在执行的线程对象的引用。</li> <li>void setName(String name) 改变线程名称，使之与参数 name 相同</li> <li>void start() 使该线程开始执行；Java 虚拟机调用该线程的 run 方法。</li> <li>线程休眠：static void sleep(long millis) 在指定的毫秒数内让当前正在执行的线程休眠（暂停执行），此操作受到系统计时器和调度程序精度和准确性的影响。</li></ol> <p>wait(),notify();Wait();当前线程进入 wait pool;
notify();唤醒对象的 wait pool 中的一个或所有等待线程。</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">ThreadSleep</span> <span class="token punctuation">{</span>

			<span class="token class-name">System</span><span class="token punctuation">.</span>out<span class="token punctuation">.</span><span class="token function">println</span><span class="token punctuation">(</span><span class="token function">getName</span><span class="token punctuation">(</span><span class="token punctuation">)</span><span class="token operator">+</span>i<span class="token operator">+</span><span class="token string">&quot;在执行***********&quot;</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
		<span class="token punctuation">}</span>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br><span class="line-number">30</span><br><span class="line-number">31</span><br><span class="line-number">32</span><br><span class="line-number">33</span><br><span class="line-number">34</span><br><span class="line-number">35</span><br></div></div><h3 id="线程的生命周期"><a href="#线程的生命周期" class="header-anchor">#</a> 线程的生命周期</h3> <ul><li>New：新创建的线程，尚未执行；</li> <li>Runnable：运行中的线程，正在执行 run()方法的 Java 代码；</li> <li>Blocked：运行中的线程，因为某些操作被阻塞而挂起；</li> <li>Waiting：运行中的线程，因为某些操作在等待中；</li> <li>Timed Waiting：运行中的线程，因为执行 sleep()方法正在计时等待；</li> <li>Terminated：线程已终止，因为 run()方法执行完毕。</li></ul> <h3 id="线程池状态"><a href="#线程池状态" class="header-anchor">#</a> 线程池状态</h3> <ul><li>RUNNING：这是最正常的状态，接受新的任务，处理等待队列中的任务。</li> <li>SHUTDOWN：不接受新的任务提交，但是会继续处理等待队列中的任务。</li> <li>STOP：不接受新的任务提交，不再处理等待队列中的任务，中断正在执行任务的线程。</li> <li>TIDYING：所有的任务都销毁了，workCount 为 0，线程池的状态在转换为 TIDYING 状态时，会执行钩子方法 terminated()。</li> <li>TERMINATED：terminated()方法结束后，线程池的状态就会变成这个。</li></ul> <h3 id="如何保证多线程安全"><a href="#如何保证多线程安全" class="header-anchor">#</a> 如何保证多线程安全</h3> <p>给方法或代码块加上同步，用关键字 synchronized</p> <ol><li>代码块锁（同步代码块）
当线程执行到同步代码块时会加锁，保证其他线程无法使用这段代码</li> <li>方法锁（同步方法）</li></ol> <h3 id="造成死锁的两种原因"><a href="#造成死锁的两种原因" class="header-anchor">#</a> 造成死锁的两种原因</h3> <ol><li>synchronized 修饰 run 函数,run()函数中有一个无限循环，一个线程进入后会在其中往复操作，这使它永远不会放弃对 this 的锁定，结果 导致其它线程无法调用;</li> <li>两个线程都要获得两个对象的锁定才能执行实质性操作，但运行起来却发现其它线程持有了自己需要的另一个锁定，于是停在 WaitSet 中等待对方释放这个锁定，结果造成了死锁。</li></ol> <h3 id="解决死锁的办法"><a href="#解决死锁的办法" class="header-anchor">#</a> 解决死锁的办法</h3> <ol><li>某线程持续不退出同步函数会造成死锁.解决方法是去掉或更换不正确的同步锁;</li> <li>两个线程都等待对方释放自己需要的资源也会造成死锁.这种情况的解决方法是确保同步锁对象的持有顺序。</li></ol> <h3 id="sleep-和-wait-的区别"><a href="#sleep-和-wait-的区别" class="header-anchor">#</a> Sleep()和 wait()的区别：</h3> <ol><li>Sleep()不释放同步锁，wait()释放同步锁；</li> <li>Sleep()自动醒来，时间不到可以用 interrupt 来强行打断，wait()可以用 notify()直接唤醒；</li> <li>Sleep()来源于类 Thread，wait()来自原 Object;</li> <li>wait,notify 和 notifyAll 只能在同步方法或者同步块里面用，而 sleep 可以在任何地方使用；</li> <li>Sleep 必须捕获异常，而.wait,notify 和 notifyAll 不需要捕获异常。</li></ol></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Java" title="标签">#Java</a><a href="/tags/?tag=BE" title="标签">#BE</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">12/10/2022, 6:13:34 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/c681b1/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Java Generics</div></a> <a href="/pages/004ccb/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Java Unit Test(UT)</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
