ight="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="how-to-fix-2502-or-2503-uninstall-errors-in-windows"><a href="#how-to-fix-2502-or-2503-uninstall-errors-in-windows" class="header-anchor">#</a> How to Fix 2502 or 2503 Uninstall Errors in Windows</h2> <ul><li><a href="https://www.boxaid.com/blog/how-to-fix-2502-2503-errors/" target="_blank" rel="noopener noreferrer">How to Fix 2502 or 2503 Uninstall Errors in Windows<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>The installer has encountered an unexpected error installing this package. This may indicate a problem with this package. The error code is 2502.</p></blockquote> <h2 id="microsoft-lifecycle-policy-announcements"><a href="#microsoft-lifecycle-policy-announcements" class="header-anchor">#</a> Microsoft Lifecycle Policy Announcements</h2> <ul><li><a href="https://learn.microsoft.com/en-us/lifecycle/#announcements" target="_blank" rel="noopener noreferrer">Announcements<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="win11-右键默认显示更多"><a href="#win11-右键默认显示更多" class="header-anchor">#</a> Win11 右键默认显示更多</h2> <ul><li><a href="https://www.xda-developers.com/how-to-open-full-right-click-menu-by-default-windows-11/" target="_blank" rel="noopener noreferrer">How to open the full right-click menu by default on Windows 11<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Disable &quot;Show more options&quot; and get the full right-click context menu in Windows 11(切换到 win10 版右键菜单)</p> <div class="language-batch line-numbers-mode"><pre class="language-batch"><code><span class="token command"><span class="token keyword">reg</span> add <span class="token string">&quot;HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32&quot;</span> <span class="token parameter attr-name">/f</span> <span class="token parameter attr-name">/ve</span></span>

<span class="token command"><span class="token keyword">taskkill</span> <span class="token parameter attr-name">/f</span> <span class="token parameter attr-name">/im</span> explorer.exe </span><span class="token operator">&amp;</span> <span class="token command"><span class="token keyword">start</span> explorer.exe</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>Enable &quot;Show more options&quot; (恢复到 win11 版右键菜单)</p> <div class="language-batch line-numbers-mode"><pre class="language-batch"><code><span class="token command"><span class="token keyword">reg</span> delete <span class="token string">&quot;HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32&quot;</span> <span class="token parameter attr-name">/f</span> <span class="token parameter attr-name">/ve</span></span>

<span class="token command"><span class="token keyword">taskkill</span> <span class="token parameter attr-name">/f</span> <span class="token parameter attr-name">/im</span> explorer.exe </span><span class="token operator">&amp;</span> <span class="token command"><span class="token keyword">start</span> explorer.exe</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h2 id="修复-windows-hello-指纹解锁此选项当前不可用的问题"><a href="#修复-windows-hello-指纹解锁此选项当前不可用的问题" class="header-anchor">#</a> 修复 Windows Hello 指纹解锁此选项当前不可用的问题</h2> <ul><li><a href="https://www.bilibili.com/read/cv27002268/" target="_blank" rel="noopener noreferrer">修复 Windows Hello 指纹解锁此选项当前不可用的问题<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://answers.microsoft.com/zh-hans/windows/forum/all/%E6%8C%87%E7%BA%B9%E8%AF%86%E5%88%AB%E6%B2%A1/2933a396-fdce-4f8f-880a-70265d7aa671%20" target="_blank" rel="noopener noreferrer">指纹识别没用<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="option1"><a href="#option1" class="header-anchor">#</a> Option1</h3> <p>Windows 11 指纹识别不可用，提示该选项目前不可用。</p> <p>可能是 Windows 生物识别服务出现了问题，您可以尝试重启您的 Windows 生物识别服务看看效果：</p> <p>“Win+R”打开运行，键入：services.msc，打开服务界面 ，找到 Windows Biometric Service 服务，</p> <p>暂时停止该服务，再打开 Windows 资源管理器，找到：</p> <p>C:\Windows\System32\WinBioDatabase 下的数据文件 [GUID].DAT，将其删除（如果无法删除将其名称更改之后删除）</p> <p>完成后再重启您的 Windows Windows Biometric Service 服务，再尝试启用 Windows Hello 添加指纹识别，看看是否可行。</p> <blockquote><p>重启（开启） Windows Biometric Service 服务， 然后重新启动计算机，就好用了，我没删 C:\Windows\System32\WinBioDatabase 下的数据文件 [GUID].DAT</p></blockquote> <h3 id="option2"><a href="#option2" class="header-anchor">#</a> Option2</h3> <div class="language-batch line-numbers-mode"><pre class="language-batch"><code><span class="token command"><span class="token keyword">reg</span> add “HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Biometrics” <span class="token parameter attr-name">/v</span> Enabled <span class="token parameter attr-name">/t</span> REG_DWORD <span class="token parameter attr-name">/d</span> <span class="token number">1</span> <span class="token parameter attr-name">/f</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Windows" title="标签">#Windows</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">8/5/2024, 7:14:06 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/a8290e/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Windows PowerShell Chore</div></a> <a href="/pages/ea62d0/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Create MacOS Aliases</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
