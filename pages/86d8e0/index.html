base is down?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://stackoverflow.com/questions/23850585/how-to-start-spring-boot-app-without-depending-on-database/26128057#26128057" target="_blank" rel="noopener noreferrer">How to start spring-boot app without depending on Database?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <div class="language-properties line-numbers-mode"><pre class="language-properties"><code><span class="token comment">### It's worked for me ###</span>
<span class="token comment"># Oracle</span>
<span class="token key attr-name">spring.jpa.properties.hibernate.dialect</span><span class="token punctuation">=</span><span class="token value attr-value">org.hibernate.dialect.OracleDialect</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><blockquote><p>For Hikari, From the <a href="https://github.com/brettwooldridge/HikariCP" target="_blank" rel="noopener noreferrer">HikariCP documentation<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>:
<strong>initialization-fail-timeout</strong>
This property controls whether the pool will &quot;fail fast&quot; if the pool cannot be seeded with an initial connection successfully. Any positive number is taken to be the number of milliseconds to attempt to acquire an initial connection; the application thread will be blocked during this period. If a connection cannot be acquired before this timeout occurs, an exception will be thrown. This timeout is applied after the connectionTimeout period. If the value is zero (0), HikariCP will attempt to obtain and validate a connection. If a connection is obtained, but fails validation, an exception will be thrown and the pool not started. However, if a connection cannot be obtained, the pool will start, but later efforts to obtain a connection may fail. A value less than zero will bypass any initial connection attempt, and the pool will start immediately while trying to obtain connections in the background. Consequently, later efforts to obtain a connection may fail. Default: 1</p></blockquote> <p>如果值为 0 或者-1，Hikari 会在后台不断的尝试获取 connection， 但是不会 block 程序的启动<br>
如果值为 1 或者更大的整数，Hikari 不会在后台不断的尝试获取 connection， 但是不会 block 程序的启动</p> <hr> <blockquote><p>For tomcat jdbc, see <a href="https://tomcat.apache.org/tomcat-9.0-doc/jdbc-pool.html" target="_blank" rel="noopener noreferrer">documentation<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> &gt; <strong>ignoreExceptionOnPreLoad</strong>

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><h2 id="java-io-tmpdir-和-server-tomcat-basedir"><a href="#java-io-tmpdir-和-server-tomcat-basedir" class="header-anchor">#</a> java.io.tmpdir 和 server.tomcat.basedir</h2> <h3 id="springboot-中-临时文件夹-java-io-tmpdir-和-server-tomcat-basedir-的关系"><a href="#springboot-中-临时文件夹-java-io-tmpdir-和-server-tomcat-basedir-的关系" class="header-anchor">#</a> springboot 中 临时文件夹 java.io.tmpdir 和 server.tomcat.basedir 的关系</h3> <p><code>java.io.tmpdir</code> 和 <code>server.tomcat.basedir</code> 是两个不同的概念,并没有直接的关系。</p> <p><code>java.io.tmpdir</code>是 Java 虚拟机(JVM)的一个系统属性,它指定了 JVM 的临时目录,用于存储一些临时文件。在运行 Java 程序时,会使用这个目录来存放一些临时数据。Spring Boot 应用在运行时也会使用这个临时目录。
<code>server.tomcat.basedir</code>是 Spring Boot 内嵌的 Tomcat 服务器的一个配置属性。它指定了 Tomcat 的基础目录,Tomcat 会在这个目录下存储一些工作数据,例如临时文件、日志文件等。</p> <p>默认情况下,<code>server.tomcat.basedir</code>的值是由 Spring Boot 自动生成的一个临时目录,这个临时目录位于<code>java.io.tmpdir</code>指定的位置下。也就是说,Spring Boot 为每一个应用实例创建了一个唯一的 Tomcat 工作目录,存放在系统临时目录中。</p> <p>我们也可以通过在<code>application.properties</code>中显式设置<code>server.tomcat.basedir</code>属性来指定 Tomcat 的工作目录位置。例如:</p> <div class="language-properties line-numbers-mode"><pre class="language-properties"><code><span class="token key attr-name">server.tomcat.basedir</span><span class="token punctuation">=</span><span class="token value attr-value">/path/to/tomcat/base</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>这种情况下,Tomcat 的工作目录就不再位于系统临时目录下,而是使用指定的路径。
总的来说,<code>java.io.tmpdir</code>是 JVM 层面的临时目录设置,而<code>server.tomcat.basedir</code>是 Spring Boot 内嵌 Tomcat 的工作目录设置,默认情况下后者会使用前者指定的临时目录作为工作目录的父目录,但也可以手动配置为其他路径。</p> <h3 id="这两个目录下的文件会自动清理吗"><a href="#这两个目录下的文件会自动清理吗" class="header-anchor">#</a> 这两个目录下的文件会自动清理吗</h3> <p>关于这两个目录下文件的清理情况:</p> <ol><li><p><code>java.io.tmpdir</code>指定的系统临时目录</p> <ul><li>这个目录下的临时文件在 Java 程序退出时通常会被自动清理,但有些情况下可能无法完全清理(如程序异常退出)</li> <li>大多数操作系统都有定期清理过期临时文件的机制,但周期可能比较长</li></ul></li> <li><p><code>server.tomcat.basedir</code>指定的 Tomcat 工作目录</p> <ul><li>对于默认生成的临时工作目录(在系统临时目录下),Spring Boot 应用退出时会自动清理</li> <li>如果是手动指定的工作目录,Spring Boot 不会自动删除,需要手动清理</li> <li>Tomcat 在运行期间会在工作目录下生成一些工作文件,这些文件在 Tomcat 停止时也不会自动删除</li></ul></li></ol> <p>综上所述:</p> <ul><li><code>java.io.tmpdir</code>目录下通常能自动清理,但有遗漏的可能</li> <li><code>server.tomcat.basedir</code>默认临时目录能自动清理,手动指定则不会</li></ul> <p>因此,建议对于这两类临时文件目录,进行以下操作:</p> <ol><li>主动监控并定期清理,避免临时文件无限积累</li> <li>在应用发布的部署/钩子脚本中增加清理临时文件的逻辑</li> <li>对于<code>server.tomcat.basedir</code>手动指定的目录,在应用停止时主动清理</li></ol> <p>这样能确保系统的临时文件得到有效控制,避免临时文件泄露导致的潜在问题。</p></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=Java" title="标签">#Java</a><a href="/tags/?tag=SpringBoot" title="标签">#SpringBoot</a><a href="/tags/?tag=BE" title="标签">#BE</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">6/26/2024, 8:29:25 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/f6f93b/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Spring Boot Rest Template</div></a> <a href="/pages/33386b/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Spring Cloud Kubernetes Basic</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
