mber">102</span><br><span class="line-number">103</span><br><span class="line-number">104</span><br><span class="line-number">105</span><br><span class="line-number">106</span><br><span class="line-number">107</span><br><span class="line-number">108</span><br><span class="line-number">109</span><br><span class="line-number">110</span><br><span class="line-number">111</span><br><span class="line-number">112</span><br><span class="line-number">113</span><br><span class="line-number">114</span><br><span class="line-number">115</span><br><span class="line-number">116</span><br><span class="line-number">117</span><br><span class="line-number">118</span><br><span class="line-number">119</span><br><span class="line-number">120</span><br><span class="line-number">121</span><br><span class="line-number">122</span><br><span class="line-number">123</span><br><span class="line-number">124</span><br><span class="line-number">125</span><br><span class="line-number">126</span><br><span class="line-number">127</span><br><span class="line-number">128</span><br><span class="line-number">129</span><br><span class="line-number">130</span><br><span class="line-number">131</span><br><span class="line-number">132</span><br><span class="line-number">133</span><br><span class="line-number">134</span><br><span class="line-number">135</span><br><span class="line-number">136</span><br><span class="line-number">137</span><br><span class="line-number">138</span><br><span class="line-number">139</span><br><span class="line-number">140</span><br><span class="line-number">141</span><br><span class="line-number">142</span><br><span class="line-number">143</span><br><span class="line-number">144</span><br><span class="line-number">145</span><br><span class="line-number">146</span><br><span class="line-number">147</span><br><span class="line-number">148</span><br><span class="line-number">149</span><br><span class="line-number">150</span><br><span class="line-number">151</span><br><span class="line-number">152</span><br><span class="line-number">153</span><br><span class="line-number">154</span><br><span class="line-number">155</span><br><span class="line-number">156</span><br><span class="line-number">157</span><br><span class="line-number">158</span><br><span class="line-number">159</span><br><span class="line-number">160</span><br><span class="line-number">161</span><br></div></div><p><strong>获取 Tag name (Option1):</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">curl</span> <span class="token string">'https://demo.goharbor.io/api/v2.0/projects/dlwxin_demo/repositories/busybox/artifacts'</span> <span class="token operator">|</span> jq <span class="token string">'
  map(select(.tags != null and (.tags | length &gt; 0))) |
  sort_by(.tags[0].push_time // &quot;0&quot;) |
  reverse |
  map(select(.tags[0].name != null)) |
  map(.tags[0].name)
'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><ol><li><code>map(select(.tags != null and (.tags | length &gt; 0)))</code>: 这一步过滤掉了 tags 为 null 或空数组的项。</li> <li><code>sort_by(.tags[0].push_time // &quot;0&quot;)</code>: 使用 <code>//</code> 运算符来提供一个默认值。如果 <code>.tags[0].push_time</code> 不存在或为 null，将使用 &quot;0&quot; 作为默认值进行排序。</li> <li><code>reverse</code>: 将排序结果反转，使最新的排在最前面。</li> <li><code>map(select(.tags[0].name != null))</code>: 过滤掉 tags 属性中 name 为 null 的项。</li> <li><code>map(.tags[0].name)</code>: 只输出每个项目的第一个 tag 的 name。</li></ol> <blockquote><p>请注意，这个命令假设每个项目只有一个 tag。如果一个项目可能有多个 tags，命令可能需要进行调整。</p></blockquote> <p>Output:</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">[</span><span class="token string">&quot;latest&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;1.28.4&quot;</span><span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>获取 Tag name (Option2):</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">curl</span> <span class="token string">'https://demo.goharbor.io/api/v2.0/projects/dlwxin_demo/repositories/busybox/artifacts'</span> <span class="token operator">|</span> jq <span class="token string">'
  [.[] | select(.tags != null) | .tags[] | select(.name != null and .push_time != null and (.name | contains(&quot;CI&quot;))) | {name: .name, push_time: .push_time}] |
  sort_by(.push_time) |
  reverse |
  map(.name)
'</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><ol><li><code>.[]</code>: 遍历顶层数组的所有元素。</li> <li><code>select(.tags != null)</code>: 过滤掉 tags 为 null 的项。</li> <li><code>.tags[]</code>: 遍历 tags 数组的所有元素。</li> <li><code>select(.name != null and .push_time != null and (.name | contains(&quot;CI&quot;)))</code>: 确保我们只处理 name 和 push_time 都不为 null, 并且 name 包含 &quot;CI&quot; 的标签。</li> <li><code>{name: .name, push_time: .push_time}</code>: 创建一个新对象，只包含 name 和 push_time。</li> <li><code>sort_by(.push_time)</code>: 根据 push_time 对所有标签进行排序。</li> <li><code>reverse</code>: 将排序结果反转，使最新的排在最前面。</li> <li><code>map(.name)</code>: 只输出每个标签的 name。</li></ol> <blockquote><p>注意，<code>contains()</code> 函数在 jq 中是大小写敏感的，所以这个命令会精确匹配 &quot;CI&quot;（大写）。如果你想要进行大小写不敏感的匹配，我们可以使用 <code>test()</code> 函数代替 <code>contains()</code>，<br> <code>... | select(.name != null and .push_time != null and (.name | test(&quot;(?i)CI&quot;))) | ...</code></p></blockquote> <p>Output:</p> <div class="language-json line-numbers-mode"><pre class="language-json"><code><span class="token punctuation">[</span><span class="token string">&quot;latest&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;1.28.4&quot;</span><span class="token punctuation">,</span> <span class="token string">&quot;1.28&quot;</span><span class="token punctuation">]</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="harbor-仓库问题处理"><a href="#harbor-仓库问题处理" class="header-anchor">#</a> Harbor 仓库问题处理</h2> <ul><li><a href="https://www.lianst.com/4285.html" target="_blank" rel="noopener noreferrer">Harbor 仓库问题处理<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://gitlab.com/gitlab-org/charts/gitlab/-/merge_requests/1007" target="_blank" rel="noopener noreferrer">Add support for setting relativeurls registry config.<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://github.com/distribution/distribution/issues/970" target="_blank" rel="noopener noreferrer">https://github.com/distribution/distribution/issues/970<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.
