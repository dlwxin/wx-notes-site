<main class="page"><div class="theme-vdoing-wrapper bg-style-1"><div class="articleInfo-wrap" data-v-057748f7><div class="articleInfo" data-v-057748f7><ul class="breadcrumbs" data-v-057748f7><li data-v-057748f7><a href="/" title="首页" class="iconfont icon-home router-link-active" data-v-057748f7></a></li> <li data-v-057748f7><a href="/more/#More" data-v-057748f7>More</a></li><li data-v-057748f7><a href="/more/#Container" data-v-057748f7>Container</a></li><li data-v-057748f7><a href="/more/#Docker" data-v-057748f7>Docker</a></li></ul> <div class="info" data-v-057748f7><div title="作者" class="author iconfont icon-touxiang" data-v-057748f7><a href="https://github.com/dlwxin/wx-notes" target="_blank" title="作者" class="beLink" data-v-057748f7>wx</a></div> <div title="创建时间" class="date iconfont icon-riqi" data-v-057748f7><a href="javascript:;" data-v-057748f7>2021-07-20</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-title">目录</div> <div class="right-menu-content"></div></div></div> <h1><!---->Dockerfile Example<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="multiple-stage"><a href="#multiple-stage" class="header-anchor">#</a> Multiple stage</h2> <p><strong>Example 1</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code>FROM alpine/git:1.0.4 AS satge_clone
WORKDIR /code
RUN git clone https://github.com/test/react-app.git
COPY . /code

FROM node:14.4.0 AS builder
WORKDIR /app
COPY --from=satge_clone /code /app
RUN cd react-app &amp;&amp; yarn install &amp;&amp; yarn build

FROM nginx:1.20.1
WORKDIR /usr/share/nginx/html
RUN rm -rf ./*
COPY --from=builder /app/react-app/build .
ENTRYPOINT [&quot;nginx&quot;, &quot;-g&quot;, &quot;daemon off;&quot;]
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p><strong>Example 2</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code># FROM --platform=linux/amd64 debian
FROM node:14.4.0 AS builder
WORKDIR /app
RUN git clone https://github.com/test/react-app.git \
    &amp;&amp; cd react-app \
    &amp;&amp; yarn install \
    &amp;&amp; yarn build

# FROM nginx:1.20.1
# FROM bitnami/nginx
# bitnami/nginx image can run with non-root and do not need specify USER
FROM nginxinc/docker-nginx-unprivileged:stable-alpine
WORKDIR /usr/share/nginx/html
COPY --from=builder /app/react-app/build .
USER nginx
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br></div></div><p><strong>Example 3</strong></p> <div class="language- line-numbers-mode"><pre class="language-text"><code># FROM ibmjava:8-sdk-alpine as builder

# FROM registry.access.redhat.com/ubi8/openjdk-11:1.14-5 as builder
# FROM adoptopenjdk/openjdk11 as builder
FROM openjdk:8-alpine as builder
WORKDIR /app

# COPY [&quot;HelloWorld&quot;, &quot;/usr/src/HelloWorld&quot;]
# COPY [&quot;learn-terraform-docker-container&quot;, &quot;/usr/src/learn-terraform-docker-container&quot;]

COPY . /app
RUN chmod +x mvnw &amp;&amp; ./mvnw package -DskipTests

FROM openjdk:8-alpine
COPY --from=builder /app/target/*.war app.war

ENTRYPOINT [&quot;java&quot;,&quot;-jar&quot;,&quot;app.war&quot;]
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br></div></div><h2 id="build-java-application"><a href="#build-java-application" class="header-anchor">#</a> Build Java application</h2> <ul><li><a href="https://spring.io/guides/topicals/spring-boot-docker/" target="_blank" rel="noopener noreferrer">Spring Boot Docker<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <div class="language- line-numbers-mode"><pre class="language-text"><code>FROM eclipse-temurin:17-jdk-alpine

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><div class="language- line-numbers-mode"><pre class="language-text"><code>FROM amazoncorretto:17-al2023

ARG APP_HOME=/app
WORKDIR ${APP_HOME}
VOLUME /tmp

ARG USERNAME=appuser
ARG USER_UID=1001
ARG GROUP_NAME=appuser
ARG GROUP_GID=1001

RUN yum install -y shadow-utils \
    &amp;&amp; groupadd -g ${GROUP_GID} ${GROUP_NAME} \
    &amp;&amp; useradd -u ${USER_UID} -g ${GROUP_GID} ${USERNAME} \
    &amp;&amp; chown -R ${USERNAME}:${GROUP_NAME} ${APP_HOME} \
    &amp;&amp; chmod -R 755 ${APP_HOME} \
    &amp;&amp; yum remove -y shadow-utils \
    &amp;&amp; yum clean all \
    &amp;&amp; rm -rf /var/cache/yum

USER ${USERNAME}

ARG JAR_FILE=target/*.jar
ARG APP_FILE=app.jar
COPY --chown=${USERNAME}:${GROUP_NAME} ${JAR_FILE} ${APP_FILE}

# ENTRYPOINT [&quot;java&quot;, &quot;-jar&quot;, &quot;app.jar&quot;]
# CMD [&quot;${JAVA_OPTS}&quot;]
ENTRYPOINT [&quot;sh&quot;, &quot;-c&quot;, &quot;java ${JAVA_OPTS} -jar app.jar ${0} ${@}&quot;]
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br><span class="line-number">21</span><br><span class="line-number">22</span><br><span class="line-number">23</span><br><span class="line-number">24</span><br><span class="line-number">25</span><br><span class="line-number">26</span><br><span class="line-number">27</span><br><span class="line-number">28</span><br><span class="line-number">29</span><br></div></div><div class="language- line-numbers-mode"><pre class="language-text"><code>FROM eclipse-temurin:17-jdk-alpine

FROM --platform=$TARGETPLATFORM alpine

RUN apk add --update nginx

CMD [&quot;nginx&quot;, &quot;-g&quot;, &quot;daemon off;&quot;]
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br></div></div><p>在构建该 Dockerfile 时，可以通过设置 <code>TARGETPLATFORM</code> 参数来指定运行时平台。例如，可以使用以下命令为 Raspberry Pi 构建镜像：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>$ <span class="token function">docker</span> buildx build <span class="token parameter variable">--platform</span> linux/arm/v7 <span class="token parameter variable">-t</span> myimage <span class="token builtin class-name">.</span>
$ <span class="token function">docker</span> build <span class="token parameter variable">-t</span> myimage --build-arg <span class="token assign-left variable">TARGETPLATFORM</span><span class="token operator">=</span>linux/arm/v7 <span class="token builtin class-name">.</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>需要注意的是，以上命令使用了 BuildKit 特性。如果你的 Docker 版本不支持 BuildKit，请将上述命令中的 <code>buildx</code> 改为 <code>build</code>。</p> <div class="language- line-numbers-mode"><pre class="language-text"><code># syntax=docker/dockerfile:1

ARG TARGETPLATFORM
ARG BUILDPLATFORM
RUN echo &quot;I am running on $BUILDPLATFORM, building for $TARGETPLATFORM&quot; &gt; /log
FROM alpine
COPY --from=build /log /log
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br></div></div><h2 id="build-python-application"><a href="#build-python-application" class="header-anchor">#</a> Build Python application</h2> <div class="language- line-numbers-mode"><pre class="language-text"><code># FROM python:3.9-alpine

<span class="token builtin class-name">echo</span> <span class="token string">'alias la=&quot;ls -A&quot;'</span> <span class="token operator">&gt;&gt;</span> ~/.bashrc
<span class="token builtin class-name">echo</span> <span class="token string">'alias l=&quot;ls -CF&quot;'</span> <span class="token operator">&gt;&gt;</span> ~/.bashrc
