</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="sql-developer"><a href="#sql-developer" class="header-anchor">#</a> SQL Developer</h2> <ul><li><a href="https://docs.oracle.com/en/database/oracle/sql-developer/22.2/rptug/sql-developer-concepts-usage.html#GUID-464C045C-FBDF-417A-A20B-037D294B3BDA" target="_blank" rel="noopener noreferrer">SQL Developer Concepts and Usage<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="download-sql-developer"><a href="#download-sql-developer" class="header-anchor">#</a> Download SQL Developer</h3> <ul><li><a href="https://www.oracle.com/database/sqldeveloper/technologies/download/" target="_blank" rel="noopener noreferrer">SQL Developer Downloads<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="how-to-change-oracle-sql-developer-language"><a href="#how-to-change-oracle-sql-developer-language" class="header-anchor">#</a> How to Change Oracle SQL Developer Language</h3> <ul><li><a href="http://sql.standout-dev.com/2018/04/howto-change-sql-developer-language/#:~:text=Close%20SQL%20Developer%2C%20if%20it%20is%20running.%20Go,you%20need%20to%20edit%20to%20change%20the%20language." target="_blank" rel="noopener noreferrer">How to Change Oracle SQL Developer Language<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://blog.csdn.net/ieloah/article/details/60866506" target="_blank" rel="noopener noreferrer">设置 SQLdeveloper 界面语言<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <ol><li>Go to <code>&lt;SQL_DEVELOPER_HOME&gt;/sqldeveloper/bin</code> folder</li> <li>Open <code>sqldeveloper.conf</code> file, add the following content</li></ol> <div class="language- line-numbers-mode"><pre class="language-text"><code># GUI language
AddVMOption -Duser.language=en
# AddVMOption -Duser.country=US
# AddVMOption -Duser.language=zh
# AddVMOption -Duser.country=CN
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br></div></div><h3 id="connect-to-mysql-database-with-sql-developer"><a href="#connect-to-mysql-database-with-sql-developer" class="header-anchor">#</a> Connect to MySQL database with SQL Developer</h3> <ul><li><a href="https://docs.singlestore.com/managed-service/en/connect-to-your-workspace/connect-with-sql-developer.html" target="_blank" rel="noopener noreferrer">Connect with SQL Developer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <ol><li>Download a <a href="https://www.mysql.com/products/connector/" target="_blank" rel="noopener noreferrer">MySQL connector(Driver)<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a> for Java.
For example: https://packages.atlassian.com/maven-external/mysql/mysql-connector-java/8.0.24/mysql-connector-java-8.0.24.jar</li> <li>In SQL Developer, add a new third-party database connector. Under Oracle SQL Developer &gt; Preferences &gt; Database &gt; Third-Party JDBC Drivers, add your MySQL connector <code>.jar</code> directory. Click OK.</li> <li>Create a new connection and select <code>MySQL</code> in <code>Database Type</code> option</li></ol> <h3 id="migrate-mysql-to-oracle-with-sql-developer"><a href="#migrate-mysql-to-oracle-with-sql-developer" class="header-anchor">#</a> Migrate MySQL to Oracle with SQL Developer</h3> <ul><li><a href="https://docs.oracle.com/en/database/oracle/sql-developer/18.2/rptug/migrating-third-party-databases.html#GUID-299A057B-2B51-4646-9285-043A848D2A0B" target="_blank" rel="noopener noreferrer">SQL Developer: Migrating Third-Party Databases<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.oracle.com/technetwork/developer-tools/adf/omwb-getstarted-092755-zhs.html" target="_blank" rel="noopener noreferrer">Oracle SQL Developer Migrations：入门<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.modb.pro/db/82077" target="_blank" rel="noopener noreferrer">【必看】MYSQL 数据库迁移到 ORACLE 数据库详解<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p><strong>Migrate single table to Oracle from MySQL</strong></p> <ol><li>Open MySQL connection in SQL Developer</li> <li>Select table which you want to migrate and right click this table</li> <li>Select <code>Copy to Oracle...</code></li></ol> <h3 id="turn-on-line-number"><a href="#turn-on-line-number" class="header-anchor">#</a> Turn on Line Number</h3> <p>Go to Tools -&gt; Preferences -&gt; Code Editor -&gt; Line Gutter -&gt; Show Line Numbers</p> <h3 id="turn-on-auto-commit"><a href="#turn-on-auto-commit" class="header-anchor">#</a> Turn on auto commit</h3> <p>Go to Tools -&gt; Preferences -&gt; Database -&gt; Advanced -&gt; Check <code>Auto Commit</code></p> <h3 id="how-to-see-two-tables-at-the-same-time-in-oracle-sql-developer"><a href="#how-to-see-two-tables-at-the-same-time-in-oracle-sql-developer" class="header-anchor">#</a> How to See Two Tables at the Same Time in Oracle SQL Developer</h3> <ul><li><a href="https://www.thatjeffsmith.com/archive/2013/05/how-to-see-two-tables-at-the-same-time-in-oracle-sql-developer/" target="_blank" rel="noopener noreferrer">How to See Two Tables at the Same Time in Oracle SQL Developer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>By default, as you open a database object in SQL Developer, it will cause any previously opened object to close. However, you may want to leave these open until you explicitly close them.</p></blockquote> <p>Go to Tools -&gt; Preferences -&gt; Database -&gt; Object Viewer -&gt; Select <code>Automatically Freeze Object Viewer Windows</code></p> <h3 id="open-object-on-single-click"><a href="#open-object-on-single-click" class="header-anchor">#</a> Open Object on Single Click</h3> <p>Go to Tools -&gt; Preferences -&gt; Database -&gt; Object Viewer -&gt; Select <code>Open Object on Single Click</code></p> <h3 id="show-query-results-in-new-tabs"><a href="#show-query-results-in-new-tabs" class="header-anchor">#</a> Show query results in new tabs</h3> <p>Go to Tools -&gt; Preferences -&gt; Database -&gt; Worksheet -&gt; Select <code>Show query results in new tabs</code></p> <h3 id="how-can-i-set-a-custom-date-time-format-in-oracle-sql-developer"><a href="#how-can-i-set-a-custom-date-time-format-in-oracle-sql-developer" class="header-anchor">#</a> How can I set a custom date time format in Oracle SQL Developer?</h3> <ul><li><a href="https://stackoverflow.com/questions/8134493/how-can-i-set-a-custom-date-time-format-in-oracle-sql-developer" target="_blank" rel="noopener noreferrer">How can I set a custom date time format in Oracle SQL Developer?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://stackoverflow.com/questions/9180014/using-oracle-to-date-function-for-date-string-with-milliseconds" target="_blank" rel="noopener noreferrer">Using Oracle to_date function for date string with milliseconds<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Go to Tools -&gt; Preferences -&gt; Database -&gt; NLS</p> <p>From the list of NLS parameters, enter <code>DD-MON-RR HH24:MI:SS</code> into the Date Format field.</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token comment">-- Timestamp format</span>
DD<span class="token operator">-</span>MON<span class="token operator">-</span>RRRR HH24:MI:SS<span class="token punctuation">.</span>FF3

YYYY<span class="token operator">-</span>MM<span class="token operator">-</span>DD HH24:MI:SS<span class="token punctuation">.</span>FF3
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br></div></div><h3 id="use-tnsnames-ora-in-oracle-sql-developer"><a href="#use-tnsnames-ora-in-oracle-sql-developer" class="header-anchor">#</a> Use tnsnames.ora in Oracle SQL Developer</h3> <ul><li><a href="https://stackoverflow.com/questions/2019230/use-tnsnames-ora-in-oracle-sql-developer" target="_blank" rel="noopener noreferrer">Use tnsnames.ora in Oracle SQL Developer<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Go to Tools -&gt; Preferences -&gt; Database -&gt; Advanced -&gt; &quot;Tnsnames Directory&quot; -&gt; Browse the directory</p> <p>Run the following command in SQL Worksheet</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">show</span> tns
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="enabling-dbms-output-in-different-environments"><a href="#enabling-dbms-output-in-different-environments" class="header-anchor">#</a> Enabling DBMS_OUTPUT in Different Environments</h3> <p>In Oracle, the <code>DBMS_OUTPUT.PUT_LINE</code> procedure is used to output text to the console, but it requires the output buffer to be enabled in order to actually see the output. <strong>If you don't see any output, it's likely because the output is not enabled.</strong></p> <ol><li><code>SQL*Plus</code> or <code>SQLcl</code>:</li></ol> <p>If you're using <code>SQL*Plus</code> or <code>SQLcl</code>, you need to enable the output explicitly:</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SET</span> SERVEROUTPUT <span class="token keyword">ON</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>By default, the output buffer size is 20,000 bytes.</strong> If you exceed this, you might miss some output. You can increase the buffer size like this:</p> <div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">SET</span> SERVEROUTPUT <span class="token keyword">ON</span> SIZE UNLIMITED<span class="token punctuation">;</span>
<span class="token comment">-- OR</span>
<span class="token keyword">SET</span> SERVEROUTPUT <span class="token keyword">ON</span> SIZE <span class="token number">100000</span><span class="token punctuation">;</span>

<path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>Oracle SQLcl (SQL Developer Command Line) is a Java-based command line interface for Oracle Database. Using SQLcl, you can execute SQL and PL/SQL statements in interactive or batch mode. SQLcl provides inline editing, statement completion, command recall, and also supports your existing <code>SQL*Plus</code> scripts.</p> <h3 id="install-oracle-sqlcl-on-macos"><a href="#install-oracle-sqlcl-on-macos" class="header-anchor">#</a> install Oracle SQLcl on MacOS</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>brew <span class="token function">install</span> sqlcl

<span class="token comment"># SQLCL_HOME=/opt/homebrew/Caskroom/sqlcl/22.3.1.285.1825/sqlcl</span>
<span class="token comment"># export PATH=$SQLCL_HOME/bin:&quot;$PATH&quot;</span>

<span class="token comment"># Set JAVA_HOME only for sqlcl</span>
<span class="token function">vi</span> <span class="token variable">$SQLCL_HOME</span>/bin/sql
<span class="token comment"># add JAVA_HOME to sql file</span>
<span class="token assign-left variable">JAVA_HOME</span><span class="token operator">=</span>your-java-home-directory
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><div class="language-shell line-numbers-mode"><pre class="language-shell"><code>sql <span class="token parameter variable">-v</span>
