</code> namespace</li> <li>springdoc-openapi v2.x: Requires Spring Boot 3.x with <code>jakarta.*</code> namespace (Jakarta EE 9+)</li> <li>springdoc-openapi v2.8.0: Changed default from OpenAPI 3.0 to OpenAPI 3.1</li></ul> <p><strong>#2790 - Moving to OpenAPI 3.1 as the default implementation for springdoc-openapi</strong> from <a href="https://github.com/springdoc/springdoc-openapi/issues/2790" target="_blank" rel="noopener noreferrer">springdoc-openapi/issues/2790<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <div class="language-properties line-numbers-mode"><pre class="language-properties"><code><span class="token comment"># springdoc.api-docs.version=openapi_3_1</span>

<span class="token keyword">import</span> <span class="token import"><span class="token namespace">org<span class="token punctuation">.</span>springframework<span class="token punctuation">.</span>context<span class="token punctuation">.</span>annotation<span class="token punctuation">.</span></span><span class="token class-name">Configuration</span></span><span class="token punctuation">;</span>

    <span class="token comment"># Enable or disable Swagger UI</span>
    <span class="token key atrule">enabled</span><span class="token punctuation">:</span> <span class="token boolean important">true</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br></div></div><h3 id="add-header-authorization-for-swagger-3"><a href="#add-header-authorization-for-swagger-3" class="header-anchor">#</a> add Header - Authorization for swagger 3</h3> <ul><li><a href="https://stackoverflow.com/questions/76734836/how-to-add-header-authorization-for-swagger-3-spring-boot" target="_blank" rel="noopener noreferrer">How to add Header - Authorization for swagger 3, spring boot<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SecurityScheme</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;Authorization&quot;</span><span class="token punctuation">,</span> type <span class="token operator">=</span> <span class="token class-name">SecuritySchemeType</span><span class="token punctuation">.</span><span class="token constant">HTTP</span><span class="token punctuation">,</span>

<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">OpenApiConfig</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br></div></div><p>After you set the security scheme then in your api you can define the security requirement for the following endpoint with @SecurityRequirement.</p> <div class="language-java line-numbers-mode"><pre class="language-java"><code><span class="token annotation punctuation">@SecurityRequirement</span><span class="token punctuation">(</span>name <span class="token operator">=</span> <span class="token string">&quot;Authorization&quot;</span><span class="token punctuation">)</span>
<span class="token keyword">public</span> <span class="token keyword">class</span> <span class="token class-name">PostController</span> <span class="token punctuation">{</span><span class="token punctuation">}</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><p>Make sure the security requirement match with the security scheme you set before. Here is the quote from the following github documentation about the security requirement.</p> <blockquote><p>The name used for each property MUST correspond to a security scheme declared in the Security Schemes under the Components Object.</p></blockquote> <h2 id="others"><a href="#others" class="header-anchor">#</a> Others</h2> <ul><li><a href="https://github.com/springdoc/springdoc-openapi/issues/88" target="_blank" rel="noopener noreferrer">How to include spring-boot-actuator endpoints to swagger-ui?<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h3 id="issue-caused-by-java-lang-nullpointerexception-null-at-springfox-documentation"><a href="#issue-caused-by-java-lang-nullpointerexception-null-at-springfox-documentation" class="header-anchor">#</a> Issue: Caused by: java.lang.NullPointerException: null at springfox.documentation...</h3> <ul><li><a href="https://mp.weixin.qq.com/s/wlhTFJFBgT1YgIk0jB1Yug" target="_blank" rel="noopener noreferrer">Spring Boot 2.6 以上整合 Swagger 的问题：&quot;this.condition&quot; is null<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2 ot;</span><span class="token punctuation">,</span> example <span class="token operator">=</span> <span class="token string">&quot;17-02-2020&quot;</span><span class="token punctuation">)</span>
