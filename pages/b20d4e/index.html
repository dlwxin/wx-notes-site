  mysql-enhanced:8.0

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p><strong>Option1:</strong></p> <p>点击 <code>SSL</code> tab, （<code>Test Connection</code> 在 <code>Main</code> tab）,</p> <ul><li>Select checkbox <code>Use SSL</code></li> <li>Deselect checkbox <code>Verify server certificate</code></li> <li>Select checkbox <code>Allow Public key retrieval</code></li></ul> <p>之后再测试 <code>Test Connection</code></p> <p><strong>Option2:</strong>
执行命令进入到容器中的 MySQL 中，执行下面的 Sql 语句</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment"># 进入到容器中的 MySQL</span>
<span class="token function">docker</span> <span class="token function">ps</span>

CONTAINER ID      IMAGE         COMMAND                  CREATED         STATUS         PORTS                  NAMES
79742fe73ea9      mysql:8.0     <span class="token string">&quot;/entrypoint.sh mysq…&quot;</span>   <span class="token number">24</span> hours ago    Up <span class="token number">6</span> seconds   <span class="token number">0.0</span>.0.0:6630-<span class="token operator">&gt;</span><span class="token number">3306</span>/tcp, :::6630-<span class="token operator">&gt;</span><span class="token number">3306</span>/tcp    test-mysql

<span class="token function">docker</span> <span class="token builtin class-name">exec</span> <span class="token parameter variable">-it</span> 79742fe73ea9 /bin/bash
mysql <span class="token parameter variable">-u</span> root <span class="token parameter variable">-p</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br></div></div><div class="language-sql line-numbers-mode"><pre class="language-sql"><code><span class="token keyword">ALTER</span> <span class="token keyword">USER</span> <span class="token string">'root'</span><span class="token variable">@'%'</span> IDENTIFIED <span class="token keyword">WITH</span> mysql_native_password <span class="token keyword">BY</span> <span class="token string">'mypassword'</span><span class="token punctuation">;</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>之后再测试 <code>Test Connection</code></p> <p><strong>Option3:</strong></p> <ul><li><a href="https://string.quest/read/17260420" target="_blank" rel="noopener noreferrer">DBeaver 连接 mysql 时报错 Public Key Retrieval is not allowed - 探索字符串<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>点击 <code>Driver properties</code> tab,</p> <p>change the value of <code>allowPublicKeyRetrieval</code> to <code>true</code></p> <h3 id="docker-安装-mysql-挂载外部数据和配置"><a href="#docker-安装-mysql-挂载外部数据和配置" class="header-anchor">#</a> Docker 安装 MySql-挂载外部数据和配置</h3> <ul><li><p><a href="https://cloud.tencent.com/developer/article/1467641" target="_blank" rel="noopener noreferrer">Docker 安装 MySql-挂载外部数据和配置<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p></li> <li><p>启动一个临时的 MySQL 容器。进入容器内部，找到配置文件的路径</p></li> <li><p>通过 <code>docker cp</code> 命令将配置文件复制到外部。这时就可以删除这个临时的 container 了</p></li> <li><p>修改配置文件。</p></li></ul> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token function">docker</span> run <span class="token parameter variable">--name</span> some-mysql <span class="token parameter variable">-e</span> <span class="token assign-left variable">MYSQL_ROOT_PASSWORD</span><span class="token operator">=</span>my-secret-pw <span class="token parameter variable">-d</span> mysql:tag
<span class="token function">docker</span> <span class="token function">ps</span>
<span class="token comment"># 进入 container 内部</span>

<span class="token builtin class-name">cd</span> /etc/mysql
<span class="token function">ls</span>
conf.d  my.cnf  my.cnf.fallback

<span class="token function">ls</span>
