E.g: <code>C:\apache\apache-maven-3.6.3\conf\settings.xml</code></li> <li>Open <code>settings.xml</code> and add the following element</li></ol> <div class="language-xml {.line-numbers} line-numbers-mode"><pre class="language-xml"><code><span class="token comment">&lt;!-- localRepository

</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="aliyun-image-repository-configuration"><a href="#aliyun-image-repository-configuration" class="header-anchor">#</a> aliyun image repository configuration</h2> <div id="aliyun_maven_mirror"></div> <h3 id="global-configuration-2"><a href="#global-configuration-2" class="header-anchor">#</a> Global configuration</h3> <ol><li>Open <code>C:\apache\apache-maven-3.6.3\conf\settings.xml</code></li> <li>find <code>mirrors</code> element, and add the following element</li></ol> <div class="language-xml {.line-numbers} line-numbers-mode"><pre class="language-xml"><code><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>mirrors</span><span class="token punctuation">&gt;</span></span>

    | this mirror serves has an ID that matches the mirrorOf element of this mirror. IDs are used
    | for inheritance and direct lookup purposes, and must be unique across the set of mirrors.

  &lt;/mirror&gt;

    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>name</span><span class="token punctuation">&gt;</span></span>Nexus aliyun<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>name</span><span class="token punctuation">&gt;</span></span>
    <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>url</span><span class="token punctuation">&gt;</span></span>http://maven.aliyun.com/nexus/content/groups/public<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>url</span><span class="token punctuation">&gt;</span></span>
  <span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>mirror</span><span class="token punctuation">&gt;</span></span>
<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>mirrors</span><span class="token punctuation">&gt;</span></span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br><span class="line-number">3</span><br><span class="line-number">4</span><br><span class="line-number">5</span><br><span class="line-number">6</span><br><span class="line-number">7</span><br><span class="line-number">8</span><br><span class="line-number">9</span><br><span class="line-number">10</span><br><span class="line-number">11</span><br><span class="line-number">12</span><br><span class="line-number">13</span><br><span class="line-number">14</span><br><span class="line-number">15</span><br><span class="line-number">16</span><br><span class="line-number">17</span><br><span class="line-number">18</span><br><span class="line-number">19</span><br><span class="line-number">20</span><br></div></div><h3 id="单项目配置"><a href="#单项目配置" class="header-anchor">#</a> 单项目配置</h3> <p>单项目配置时，需要修改 pom 文件。pom 文件中，没有 mirror 元素。在 pom 文件中，通过覆盖默认的中央仓库的配置，实现中央仓库地址的变更。</p> <div class="language-xml {.line-numbers} line-numbers-mode"><pre class="language-xml"><code><span class="token prolog">&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;</span>

选中 Maven 工程， Right click -&gt; Build Path -&gt; Config Build Path -&gt; click Libraries -&gt; click <code>JRE System Library[JavaSE-1.5]</code>-&gt; click Edit -&gt; Choose JDK version -&gt; Finish</p></li> <li><p>方式 2：
