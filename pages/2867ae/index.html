l="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.lifewire.com/fix-developer-cannot-be-verified-error-5183898" target="_blank" rel="noopener noreferrer">How to Fix 'Cannot Be Opened Because the Developer Cannot be Verified' Error on Mac<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://www.xiaoyi.vc/macos-tips" target="_blank" rel="noopener noreferrer">macOS 苹果系统技巧教程专题<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://apple.stackexchange.com/questions/208408/profile-is-not-loaded-on-non-login-bin-sh" target="_blank" rel="noopener noreferrer">.profile is not loaded on non-login /bin/sh<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="start-macbook"><a href="#start-macbook" class="header-anchor">#</a> Start Macbook</h2> <p>苹果在支持文档中有所表述，以下情况 Macbook 会自动开启：</p> <p>打开 Macbook 的上盖时
打开上盖后，将 MacBook 插上电源适配器时
关闭上盖，MacBook 外接屏幕，MacBook 插上电源适配器时</p> <h2 id="在-mac-上使用多点触控手势"><a href="#在-mac-上使用多点触控手势" class="header-anchor">#</a> 在 Mac 上使用多点触控手势</h2> <ul><li><a href="https://support.apple.com/zh-cn/HT204895" target="_blank" rel="noopener noreferrer">在 Mac 上使用多点触控手势<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <h2 id="disable-bash-zsh-sessions-in-macos-monterey-12-6"><a href="#disable-bash-zsh-sessions-in-macos-monterey-12-6" class="header-anchor">#</a> Disable bash/zsh sessions in MacOS Monterey 12.6</h2> <ul><li><a href="https://stackoverflow.com/questions/32418438/how-can-i-disable-bash-sessions-in-os-x-el-capitan" target="_blank" rel="noopener noreferrer">How can I disable Bash sessions in OS X El Capitan<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>For <code>zsh</code>. I choose solution below.</p> <p>This behavior is defined in <code>/etc/zshrc_Apple_Terminal</code>. It contains documentation comments describing what it does and how to customize it.</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token builtin class-name">echo</span> <span class="token string">&quot;SHELL_SESSIONS_DISABLE=1&quot;</span> <span class="token operator">&gt;&gt;</span> ~/.zshenv
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h2 id="invalid-active-developer-path"><a href="#invalid-active-developer-path" class="header-anchor">#</a> invalid active developer path</h2> <ul><li><a href="https://apple.stackexchange.com/questions/254380/why-am-i-getting-an-invalid-active-developer-path-when-attempting-to-use-git-a" target="_blank" rel="noopener noreferrer">invalid active developer path<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>After upgrading to macOS Ventura, I tried to run <code>git</code> from Terminal but it kept giving me the following error:</p> <p><code>xcrun: error: invalid active developer path (/Library/Developer/CommandLineTools), missing xcrun at: /Library/Developer/CommandLineTools/usr/bin/xcrun.</code></p></blockquote> <p><strong>Solution</strong></p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>xcode-select <span class="token parameter variable">--install</span>
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><p>This will pop a dialogue box, Select &quot;Install&quot;, and it will download and install the Command Line Tools package and fix the problem. (The popped Window may be behind other windows.)</p> <h2 id="how-to-change-the-cursor-pointer-outline-color-on-mac"><a href="#how-to-change-the-cursor-pointer-outline-color-on-mac" class="header-anchor">#</a> How to change the cursor(pointer) outline color on Mac</h2> <ol><li>Go to the Apple menu -&gt; System Preferences -&gt; Select Accessibility -&gt; Display -&gt; Choose the Pointer tab.</li></ol> <blockquote><p>Pointer fill color: <code>00CCFF</code>(I perferred)</p></blockquote> <h2 id="java-home-in-macos"><a href="#java-home-in-macos" class="header-anchor">#</a> JAVA_HOME in MacOS</h2> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code><span class="token comment">#export JAVA_HOME=$(/usr/libexec/java_home)</span>
<span class="token builtin class-name">export</span> <span class="token assign-left variable">JAVA_HOME</span><span class="token operator">=</span>/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br><span class="line-number">2</span><br></div></div><h2 id="mac-键盘如何将-f1-到-f12-取消按-fn-fn-锁定"><a href="#mac-键盘如何将-f1-到-f12-取消按-fn-fn-锁定" class="header-anchor">#</a> Mac 键盘如何将 F1 到 F12 取消按 fn（Fn 锁定）</h2> <ul><li><a href="https://www.zhihu.com/tardis/zm/art/578750816" target="_blank" rel="noopener noreferrer">Mac 键盘如何将 F1 到 F12 取消按 fn<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li> <li><a href="https://support.apple.com/en-us/102439" target="_blank" rel="noopener noreferrer">Change the default behavior of the keys<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p><strong>Toggle the 'fn' key off in MacOS 13</strong></p> <ol><li>Choose System Settings.</li> <li>Click Keyboard in the sidebar.</li> <li>Click the Keyboard Shortcuts button on the right.</li> <li>Click Function Keys in the sidebar.</li> <li>Turn on &quot;Use F1, F2, etc. keys as standard function keys&quot;.</li></ol> <h2 id="iterm2"><a href="#iterm2" class="header-anchor">#</a> iTerm2</h2> <h3 id="download"><a href="#download" class="header-anchor">#</a> download</h3> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>brew <span class="token function">install</span> <span class="token parameter variable">--cask</span> iterm2
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div><h3 id="make-iterm-default"><a href="#make-iterm-default" class="header-anchor">#</a> Make iTerm default</h3> <ul><li><a href="https://forums.macrumors.com/threads/change-open-in-terminal-right-click-to-iterm-instead-of-apples-terminal.2381372/" target="_blank" rel="noopener noreferrer">Change &quot;Open in Terminal&quot; right click to iTerm instead of Apple's terminal<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <p>The first answer here <a href="https://stackoverflow.com/questions/60210024/how-can-i-use-iterm-as-default-terminal-on-macos" target="_blank" rel="noopener noreferrer">https://stackoverflow.com/questions/60210024/how-can-i-use-iterm-as-default-terminal-on-macos<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <p>Run iTerm2. Menu: iTerm2 &gt; Make iTerm default</p> <h3 id="configuration"><a href="#configuration" class="header-anchor">#</a> Configuration</h3> <ul><li><a href="/pages/151885/#zsh_links">iTerm2 + Oh My Zsh 打造舒适终端体验</a></li></ul> <h2 id="others"><a href="#others" class="header-anchor">#</a> Others</h2> <h3 id="xattr"><a href="#xattr" class="header-anchor">#</a> xattr</h3> <ul><li><a href="https://juejin.cn/post/7510803578506182695" target="_blank" rel="noopener noreferrer">macOS绕过App安全检查<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></li></ul> <blockquote><p>“您是否确定要打开此应用程序？此文件来自不明开发者。”</p></blockquote> <p>这是因为 macOS 自动将该应用标记为“隔离”。如果你确定该工具是可信的，可以使用以下命令移除隔离标志：</p> <div class="language-shell line-numbers-mode"><pre class="language-shell"><code>xattr <span class="token parameter variable">-rd</span> com.apple.quarantine ~/Application/DBeaver.app
</code></pre> <div class="line-numbers-wrapper"><span class="line-number">1</span><br></div></div></div></div> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/tags/?tag=MacOS" title="标签">#MacOS</a></div> <div class="last-updated"><span class="prefix">Last Updated:</span> <span class="time">10/27/2026, 5:36:57 PM</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/5b3fd4/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">Shortcut key of MacOS</div></a> <a href="/pages/570625/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">Docker</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
